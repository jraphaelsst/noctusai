# Raw docker-compose for the stateful services currently managed by Coolify.
# Replaces the Coolify-managed n8n / waha / postgres / redis with plain compose,
# REUSING the EXISTING named volumes so n8n workflows + the WhatsApp session survive.
#
# Migration = stop Coolify's containers → `docker compose -f compose.services.yml up -d`
# (same volumes attach to the new containers). Routing for n8n/waha then comes from
# the Cloudflare named tunnel (deploy/tunnel/), NOT Coolify's Traefik.
#
# Secrets come from .env.services (gitignored, created ON the VPS) — see .env.services.example.
# Bring up:  docker compose --env-file .env.services -f compose.services.yml up -d
name: noctus-services

networks:
  noctus-net:
    external: true        # created once by the fleet (start.sh) — shared with products + tunnel

volumes:
  # external:true → reuse Coolify's existing data volumes verbatim (NO data loss).
  n8n-data:
    external: true
    name: r8co0gwsw8g4gggcc0sko8ko_n8n-data
  waha-sessions:
    external: true
    name: r8co0gwsw8g4gggcc0sko8ko_waha-sessions
  waha-media:
    external: true
    name: r8co0gwsw8g4gggcc0sko8ko_waha-media
  pgdata:
    external: true
    name: r8co0gwsw8g4gggcc0sko8ko_pgdata
  redis-data:
    external: true
    name: r8co0gwsw8g4gggcc0sko8ko_redis-data

services:
  postgres:
    # Pinned 2026-11-15 to the digest PROD IS RUNNING: a floating 16 can bump the debian base (glibc collation
    # change = index corruption on the existing pgdata volume). Upgrades are a deliberate bump, never a re-pull.
    image: postgres:16@sha256:f992505e18f114c1e5102ac4dcf00f791b44462f6a423d899320f0bbf80e386f
    restart: unless-stopped
    networks:
      noctus-net:
        aliases: [postgres]            # other containers reach it as host `postgres`
    environment:
      # Only consumed on FIRST init; pgdata is already initialized, so these just
      # document the existing creds. Real value of POSTGRES_PASSWORD lives in .env.services.
      POSTGRES_DB: ${POSTGRES_DB:-default}
      POSTGRES_USER: ${POSTGRES_USER:-default}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.services}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-default} -d ${POSTGRES_DB:-default}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    # Pinned 2026-11-15 to the digest PROD IS RUNNING (was :latest): a no-op recreate. Auth: requirepass, with the
    # password DERIVED from REDIS_ACL_MASTER_SECRET by `noctus.dev.redis_acl render --write`, which writes it to
    # redis-auth/services-redis.env beside this file (gitignored). Nothing to type, and a stack that has not been
    # rendered yet starts exactly as it does today (no password) instead of failing. DERIVED client list = none
    # (n8n uses SQLite; legacy has its own Redis) — keeper test_services_redis_has_no_unauthenticated_clients.
    image: redis:latest@sha256:4d25e2fe601f7ffaeb4437cb6ced3518bc36edf34ebe98863c80836943d94529
    restart: unless-stopped
    networks:
      noctus-net:
        aliases: [redis]
    volumes:
      - redis-data:/data
    env_file:
      - path: ./redis-auth/services-redis.env   # REDIS_PASSWORD, derived (noctus.dev.redis_acl render --write)
        required: false
    command: ["sh", "-c", "if [ -n \"$$REDIS_PASSWORD\" ]; then exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\"; fi; exec redis-server --appendonly yes"]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  n8n:
    # Pinned 2026-11-15 to the digest PROD IS RUNNING (was :latest): a no-op recreate (n8n refuses a DB downgrade, so
    # never pin older than what runs). Bump deliberately: `noctus.dev.image_pin` resolves the new digest.
    image: n8nio/n8n:latest@sha256:b4ce485c070c95efae9f42fa39918623f821d70ea255cdf6467b02865db3a00e
    restart: unless-stopped
    networks:
      noctus-net:
        aliases: [n8n]                 # tunnel ingress points n8n.noctusai.com -> http://n8n:5678
    environment:
      # Hostnames stay identical → existing webhook URLs keep working once the tunnel serves them.
      N8N_HOST: n8n.noctusai.com
      N8N_PORT: "5678"
      N8N_PROTOCOL: https
      N8N_EDITOR_BASE_URL: https://n8n.noctusai.com
      WEBHOOK_URL: https://n8n.noctusai.com/
      N8N_SECURE_COOKIE: "true"
      GENERIC_TIMEZONE: America/Sao_Paulo
      N8N_LOG_LEVEL: info
      N8N_COMMUNITY_PACKAGES_ALLOW_TOOL_USAGE: "true"
      # Code/Function nodes + expressions cannot read the container env (the n8n 2.x default, made explicit so a
      # future image cannot flip it). `{{ $env.X }}` in workflows is therefore off: the PDF.co / Infosimples template
      # workflows must keep their keys in n8n Credentials (both keys are unset/inert today).
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      # Workflow template credentials — referenced via {{ $env.* }} expressions.
      # Optional: the running n8n had these UNSET (they were lost together with
      # .env.services when production-deploy-migration was archived). Relaxed
      # from `:?` to optional so the project stays compose-manageable; the
      # PDF.co / Infosimples workflows stay inert until real values are supplied
      # in .env.services. NOC-REMEDIATE[config-gap]: recover the two keys + set them. — 2026-06-22
      PDF_CO_API_KEY: ${PDF_CO_API_KEY:-}
      INFOSIMPLES_API_TOKEN: ${INFOSIMPLES_API_TOKEN:-}
      # NOTE: this n8n stores its DB as SQLite inside n8n-data (no DB_POSTGRESDB_* in the
      # Coolify config). The postgres service above is preserved but n8n does NOT use it —
      # verify what (if anything) uses postgres before final Coolify teardown.
    volumes:
      - n8n-data:/home/node/.n8n
    depends_on:
      redis:
        condition: service_healthy

  waha:
    # Pinned by DIGEST (2026-11-05) to the image actually running in prod
    # (container noctus-services-waha-1, image id == this digest; it is the
    # `latest` pull of 2026-07-29, rev 79233e09e348; the image carries no
    # semver label). A floating `latest` re-pulls a different WAHA on any
    # recreate. Bump deliberately: pull a tagged <engine>-<version>, verify,
    # replace this digest (KB INTEGRATIONS/whatsapp.md).
    image: devlikeapro/waha@sha256:2fc1787ddbd343ed2e7d59482846d1b22aa5ca134e29aa8d42d0e88c54e24779
    restart: unless-stopped
    networks:
      noctus-net:
        aliases: [waha]                # tunnel ingress -> http://waha:3000 (public access model: owner decision, runbook § 3)
    environment:
      # Internal hop on noctus-net: independent of the public n8n edge / any Access policy on it.
      WHATSAPP_HOOK_URL: http://n8n:5678/webhook/webhook
      WHATSAPP_HOOK_EVENTS: message
      # NOWEB auto-refreshes the pairing QR; GOWS expires it after ~20s and marks
      # the session FAILED (a hostile pairing UX). NOWEB is WAHA-Core-supported.
      WHATSAPP_DEFAULT_ENGINE: NOWEB
      WHATSAPP_API_KEY: ${WHATSAPP_API_KEY:?set WHATSAPP_API_KEY in .env.services}
      WAHA_DASHBOARD_USERNAME: ${WAHA_DASHBOARD_USERNAME:-noc-admin}
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD:?set WAHA_DASHBOARD_PASSWORD in .env.services}
      # Swagger UI (/docs) basic-auth mirrors the dashboard creds (same env vars)
      # so one login covers both surfaces. Without these passed through here the
      # container ignores the WHATSAPP_SWAGGER_* lines in .env.services (this
      # service has no env_file:, so .env.services is interpolation-only).
      WHATSAPP_SWAGGER_USERNAME: ${WAHA_DASHBOARD_USERNAME:-noc-admin}
      WHATSAPP_SWAGGER_PASSWORD: ${WAHA_DASHBOARD_PASSWORD:?set WAHA_DASHBOARD_PASSWORD in .env.services}
      WAHA_GOWS_PATH: /app/gows
      WAHA_GOWS_SOCKET: /tmp/gows.sock
      WAHA_ZIPPER: ZIPUNZIP
      # Coolify set --max-old-space-size=16384 (16 GB) — nonsensical on an 8 GB box; it's only a
      # V8 heap CEILING (not a reservation) but kept lower here to avoid runaway OOM of the host.
      NODE_OPTIONS: --max-old-space-size=2048
    volumes:
      - waha-sessions:/app/.sessions
      - waha-media:/app/.media
    depends_on:
      redis:
        condition: service_healthy
