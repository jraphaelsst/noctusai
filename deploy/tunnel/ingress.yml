# ingress.yml — SINGLE SOURCE OF TRUTH for public-hostname → local-service routing.
#
# To remap a slug, edit ONE line here, then re-run the sync (cloudflared config + DNS route).
#   See README.md → "Apply an ingress change".
#
# This file is the ONE declarative map the user maintains. Two derived
# artifacts are generated from it (never hand-edit those — edit here):
#   1. config.yml `ingress:` block   — what cloudflared serves.
#   2. the DNS CNAMEs                 — `cloudflared tunnel route dns <tunnel> <hostname>`.
#
# WHY a single source: the user WILL rename slugs in the future. With the
# mapping hand-spread across N per-product files, a rename means N edits +
# easy drift. Here it is one line → re-apply → done. The route target is
# the in-network service name on `noctus-net` (== compose service ==
# `noctus-<slug>` container_name), NOT a published host port — cloudflared
# shares the network and reaches containers by name.
#
# ── Field shape ───────────────────────────────────────────────────────
#   - hostname: <public DNS name>
#     service:  http://<in-network-service-name>:<internal-port>
#   (internal-port == the product's backend_port from start.sh registry;
#    uvicorn serves API + SPA on that one port — single-container model.)
#
# Derived from start.sh BEGIN/END_PRODUCTS_REGISTRY + products/*/docker-compose.yml
# (snapshot 2026-05-21). When the registry changes, regenerate this map.

routes:
  # ── Apex → core ──────────────────────────────────────────────────────
  - hostname: noctusai.com
    service:  http://core:8000
    note:     apex → core product (backend_port 8000)

  # ── Per-product subdomains: <slug>.noctusai.com → noctus-<slug>:<port> ─
  # core is also reachable at its subdomain for symmetry / direct access.
  - hostname: core.noctusai.com
    service:  http://core:8000

  - hostname: erp-imobiliario.noctusai.com
    service:  http://erp-imobiliario:8001

  # seed is a FIRST-CLASS deployed product + canary (migration 038).
  - hostname: seed.noctusai.com
    service:  http://seed:8004

  # ── UN-EXPOSED 2026-08-17 (owner's decision) ───────────────────────────
  # personal-finance:8002 · therapy-platform:8003 · daily-life:8005 ·
  # adconnect:8007 · dev-team:8009
  #
  # All five are `ativo=false, deploy_scope='dev'` in the product catalog,
  # yet every one of them was answering 200 on the public internet from an
  # image 27 seed-changes behind the prod tip — a gap that included the
  # fatal-startup-hook fix, a starlette bump, and several dependency
  # security advisories. Five unused services, publicly reachable, running
  # code the rest of the fleet was deliberately patched off.
  #
  # Updating them was the WRONG fix: it would have kept five unused public
  # endpoints on the internet and cost five image builds for products with
  # no users. Removing the route removes the surface outright.
  #
  # REVERSIBLE BY DESIGN — nothing was deleted. Re-add the two lines here
  # (and the matching pair in config.yml.template, which is a SECOND
  # derived artifact this file does not generate), re-run
  # `deploy/tunnel/route-dns.sh`, and start the container. Reactivating a
  # product lands in `dev` first anyway per product-working-scope, so it
  # would be rebuilt on current seed at that point rather than resurrected
  # at this stale revision.
  # → KB § PATTERNS/architect/product-working-scope.md
  # → KB § PATTERNS/devops/tunnel-ingress-source-of-truth.md

  - hostname: social-wiring.noctusai.com
    service:  http://social-wiring:8011

  - hostname: orbity.noctusai.com
    service:  http://orbity:8010

  - hostname: igig.noctusai.com
    service:  http://igig:8013

  - hostname: p-studio.noctusai.com
    service:  http://p-studio:8014

  # ── Short-name aliases (live edge convenience hosts) ─────────────────
  # Shorter public hostnames pointing at the SAME containers as the
  # full-slug subdomains above — kept alongside, not replacing, them.
  - hostname: erp.noctusai.com
    service:  http://erp-imobiliario:8001
  - hostname: social.noctusai.com
    service:  http://social-wiring:8011

  # ── Self-hosted infra (NOT registry products; noctus-services project) ─
  - hostname: n8n.noctusai.com
    service:  http://n8n:5678
  - hostname: waha.noctusai.com
    service:  http://waha:3000

  # ── Legacy standalone container (NOT a registry product) ─────────────
  - hostname: legacy.noctusai.com
    service:  http://legacy:5000
    note:     standalone legacy container on :5000 (must share noctus-net)
