# GENERATED from deploy/fleet/waha-instances.yml by noctus.dev.waha_instance action='render' -- DO NOT EDIT.
# One WAHA Core container per WhatsApp number. Run from deploy/fleet on the VPS (reads .env.fleet):
#   docker compose -f compose.waha.yml up -d --no-deps waha-<name>   (an edge line: waha-<name>-core waha-<name>)
# KB § CONTEXT/INTEGRATIONS/whatsapp.md § One WAHA per number.
name: noctus-waha

services:
  waha-nosnolimiar:
    # nosnolimiar's own WhatsApp number (session `default`). Internal only: http://waha-nosnolimiar:3000
    image: devlikeapro/waha:noweb-2026.10.1
    platform: linux/amd64
    container_name: noctus-waha-nosnolimiar
    environment:
      WHATSAPP_DEFAULT_ENGINE: NOWEB
      WHATSAPP_API_KEY: ${WAHA_NOSNOLIMIAR_API_KEY:?generate WAHA_NOSNOLIMIAR_API_KEY in .env.fleet on the VPS}
      WHATSAPP_HOOK_HMAC_KEY: ${WAHA_NOSNOLIMIAR_HMAC_SECRET:?generate WAHA_NOSNOLIMIAR_HMAC_SECRET in .env.fleet on the VPS}
      WAHA_DASHBOARD_USERNAME: admin
      WAHA_DASHBOARD_PASSWORD: ${WAHA_NOSNOLIMIAR_DASHBOARD_PASSWORD:?generate WAHA_NOSNOLIMIAR_DASHBOARD_PASSWORD in .env.fleet on the VPS}
      WHATSAPP_SWAGGER_USERNAME: admin
      WHATSAPP_SWAGGER_PASSWORD: ${WAHA_NOSNOLIMIAR_DASHBOARD_PASSWORD:?generate WAHA_NOSNOLIMIAR_DASHBOARD_PASSWORD in .env.fleet on the VPS}
      NODE_OPTIONS: --max-old-space-size=384
    expose:
      - "3000"
    volumes:
      - waha_nosnolimiar:/app/.sessions
    networks:
      - noctus-net
    mem_limit: 512m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/ping').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
  waha-assistant:
    # assistant's own WhatsApp number (session `default`). Internal only: http://waha-assistant:3000
    image: devlikeapro/waha:noweb-2026.10.1
    platform: linux/amd64
    container_name: noctus-waha-assistant
    environment:
      WHATSAPP_DEFAULT_ENGINE: NOWEB
      WHATSAPP_API_KEY: ${WAHA_ASSISTANT_API_KEY:?generate WAHA_ASSISTANT_API_KEY in .env.fleet on the VPS}
      WHATSAPP_HOOK_HMAC_KEY: ${WAHA_ASSISTANT_HMAC_SECRET:?generate WAHA_ASSISTANT_HMAC_SECRET in .env.fleet on the VPS}
      WAHA_DASHBOARD_ENABLED: "false"
      WHATSAPP_SWAGGER_ENABLED: "false"
      NODE_OPTIONS: --max-old-space-size=384
    expose:
      - "3000"
    volumes:
      - waha_assistant:/app/.sessions
    networks:
      - noctus-net
    mem_limit: 512m
    restart: unless-stopped
    labels:
      noctus.line.personal: "true"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/ping').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
  waha-sw-vendas:
    # social-wiring's own WhatsApp number (session `default`). Internal only: http://waha-sw-vendas:3000
    image: devlikeapro/waha:noweb-2026.10.1
    platform: linux/amd64
    container_name: noctus-waha-sw-vendas
    environment:
      WHATSAPP_DEFAULT_ENGINE: NOWEB
      WHATSAPP_API_KEY: ${WAHA_SW_VENDAS_API_KEY:?generate WAHA_SW_VENDAS_API_KEY in .env.fleet on the VPS}
      WHATSAPP_HOOK_HMAC_KEY: ${WAHA_SW_VENDAS_HMAC_SECRET:?generate WAHA_SW_VENDAS_HMAC_SECRET in .env.fleet on the VPS}
      WAHA_DASHBOARD_ENABLED: "false"
      WHATSAPP_SWAGGER_ENABLED: "false"
      NODE_OPTIONS: --max-old-space-size=384
    expose:
      - "3000"
    volumes:
      - waha_sw_vendas:/app/.sessions
    networks:
      - noctus-net
    mem_limit: 512m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/ping').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

networks:
  noctus-net:
    name: noctus-net
    external: true

volumes:
  waha_nosnolimiar:
    name: noctus-waha-nosnolimiar
  waha_assistant:
    name: noctus-waha-assistant
  waha_sw_vendas:
    name: noctus-waha-sw-vendas
