# NoctusAI — PRODUCTION infra (compose project: noctusai-infra-prod).
#
# Project: production-deploy-migration. The prod sibling of the root
# docker-compose.infra.yml. Shared backing services the product fleet
# (docker-compose.prod.yml) talks to over the external noctus-net.
#
# What the prod fleet actually needs (per the deploy audit):
#   • Redis     — ALWAYS. The chatbot buffer/worker + rate-limiter use it.
#                 Products fall back to in-memory only in tests; prod needs
#                 a real Redis. NOT profile-gated here — it always comes up.
#   • WAHA      — OPTIONAL. WhatsApp HTTP API for chatbot-using products.
#                 Profile-gated behind `waha`; absent ⇒ FakeWahaClient
#                 fallback (WAHA_BASE_URL empty), non-chatbot products
#                 unaffected. Only `up` it once a real WhatsApp number is
#                 provisioned.
#   • cache-pg  — OPTIONAL. Postgres + pgvector for the keeper-mirror cache
#                 backend. Profile-gated behind `cache` (also included in
#                 `full`). Dev uses local SQLite — this service is prod-only.
#                 See KB § PATTERNS/devops/prod-cache-container.md.
#   • Postgres  — NOT here. Prod uses remote Supabase (root .env
#                 SUPABASE_URL). The root infra file's local postgres is a
#                 dev/offline convenience only.
#
# Why a separate prod infra file (not just reuse the root one): the root
# docker-compose.infra.yml PUBLISHES host ports (6379, 3000, 5432) for
# local dev convenience. In prod nothing should be on the host — Redis is
# reached service-name → service-name across noctus-net, and WAHA's
# dashboard is reached only through the named tunnel. So this file uses
# expose: (internal) instead of ports: (host-published). Redis stays
# unpublished; if you must reach the WAHA dashboard from the VPS host for
# QR-pairing, route it through deploy/tunnel/ rather than publishing 3000.
#
# Network: noctus-net is EXTERNAL — same shared fabric as the product
# fleet + named tunnel + legacy container. Create once before `up`:
#   docker network create noctus-net
#
# Usage on the VPS:
#   docker compose -f compose.infra.prod.yml up -d                         # Redis only
#   docker compose -f compose.infra.prod.yml --profile waha up -d          # + WAHA
#   docker compose -f compose.infra.prod.yml --profile cache up -d         # + cache-pg
#   docker compose -f compose.infra.prod.yml --profile full up -d          # all services

name: noctusai-infra-prod

services:
  redis:
    image: redis:7-alpine
    container_name: noctus-redis
    # Internal only — products reach it as redis://noctus-redis:6379 over
    # noctus-net. No host port published in prod.
    expose:
      - "6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - noctus-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ── redis-acl — the LOCKED-DOWN Redis (ACL, `default` user OFF) on the private data net ────────────────
  # Redis lockdown (security review F3, 2026-11-10): the `redis` service above has no auth and sits on the
  # network every container (n8n, WAHA, cloudflared ...) shares. It is about to hold the fleet breaker key
  # `noctus:breaker:fleet`. This sibling is deployed ALONGSIDE it, profile-gated (a missing aclfile would
  # make docker create a DIRECTORY at the mount path), and joined ONLY to the internal `noctus-data` net
  # (products + this); WAHA/n8n/cloudflared never see it. Users/patterns are DERIVED by
  # `noctus.dev.redis_acl` into redis-auth/users.acl (hashes only, gitignored). Products reach it as
  # redis://noctus-redis-acl:6379 with REDIS_USERNAME/REDIS_PASSWORD (the seam, redis-auth-seam.md).
  # Runbook + per-step rollback: KB § PATTERNS/devops/redis-acl-lockdown.md.
  redis-acl:
    # PINNED BY DIGEST to redis 7.4.6 (index digest, 2026-11-10): CVE-2025-49844 (Lua use-after-free -> RCE) and
    # CVE-2025-46818 are fixed in 7.2.11 / 7.4.6 / 8.0.4 / 8.2.2; the floating 7-alpine tag can resolve to a vulnerable build. NEVER run an
    # older one: rollout steps 0 and 2 refuse < 7.4.6. Bump deliberately (verify `redis-server --version` first).
    image: redis:7.4.6-alpine@sha256:3b73847e72874be07e6657b129a94761662b79bc0f679273757d4218573b2a98
    container_name: noctus-redis-acl
    expose:
      - "6379"
    # APP data only (the breaker has its own instance below). volatile-lru: only keys WITH a TTL (sessions,
    # limiter counters, caches) are evicted. mem_limit is ~2x maxmemory: a BGREWRITEAOF fork can copy-on-write
    # up to the whole dataset, so a tight limit would OOM-kill Redis exactly when it is busiest.
    # ALERT (NOC-REMEDIATE below): used_memory > 80% of maxmemory, or container memory > 80% of mem_limit
    # (`noctus.vps.stats`); both fire long before eviction starts failing writes.
    command: ["redis-server", "--appendonly", "yes", "--aclfile", "/etc/redis/users.acl",
              "--maxmemory", "512mb", "--maxmemory-policy", "volatile-lru"]
    mem_limit: 1g
    volumes:
      - redis_acl_data:/data
      - ./redis-auth/users.acl:/etc/redis/users.acl:ro
    networks:
      noctus-data:
        aliases: [noctus-redis-acl]
    user: redis
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    restart: unless-stopped
    healthcheck:
      # `healthcheck` ACL user: nopass, +ping only (the default user is off). Reveals liveness, nothing else.
      test: ["CMD-SHELL", "redis-cli --no-auth-warning --user healthcheck --pass x ping | grep -q PONG"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    profiles:
      - redis-acl

  # ── breaker-redis — a DEDICATED, tiny Redis for the fleet breaker keys (noctus:breaker:*) ───────────────
  # Round-3 decision: the breaker shares NOTHING with app data. Under the app Redis's volatile-lru a runaway that
  # fills memory makes `SETNX noctus:breaker:fleet` fail with OOM exactly when it must succeed, and a hung Lua
  # script on the app instance would freeze the breaker too. Here: nothing but breaker keys, `noeviction` (a full
  # instance REFUSES writes loudly instead of dropping a trip), no scripting for ANY user (-@scripting in every
  # aclfile line), AOF on. 64mb is ~thousands of times the real footprint (a handful of tiny keys + a capped
  # audit list); mem_limit leaves AOF-rewrite headroom. Same digest pin, same internal network, same profile.
  # Users: breaker-users.acl (hashes only, gitignored) rendered by `noctus.dev.redis_acl`.
  # NOC-REMEDIATE[redis-memory-alert]: alert on used_memory > 80% of maxmemory for BOTH instances (needs an `info`
  # grant for the probe user or a watchdog exec; `noctus.vps.stats` container memory is the interim signal). — 2026-11-10
  breaker-redis:
    image: redis:7.4.6-alpine@sha256:3b73847e72874be07e6657b129a94761662b79bc0f679273757d4218573b2a98
    container_name: noctus-breaker-redis
    expose:
      - "6379"
    command: ["redis-server", "--appendonly", "yes", "--aclfile", "/etc/redis/users.acl",
              "--maxmemory", "64mb", "--maxmemory-policy", "noeviction"]
    mem_limit: 192m
    volumes:
      - breaker_redis_data:/data
      - ./redis-auth/breaker-users.acl:/etc/redis/users.acl:ro
    networks:
      noctus-data:
        aliases: [noctus-breaker-redis]
    user: redis
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning --user healthcheck --pass x ping | grep -q PONG"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    profiles:
      - redis-acl

  cache-pg:
    # NoctusAI keeper-mirror cache backend — Postgres + pgvector.
    # Used in PROD only; dev uses local SQLite (see KB § PATTERNS/common/
    # cache-backend-portability for the migration path).
    # Image is pinned to pgvector/pgvector:pg16 (Postgres 16 + pgvector
    # extension pre-baked).
    image: pgvector/pgvector:pg16
    container_name: noctus-cache-pg
    expose:
      - "5432"
    # Host-loopback publish (NOT public). 127.0.0.1:5432 → container 5432.
    # Enables: (a) Phase 2 one-shot mirror via SSH tunnel from architect's
    # laptop; (b) Phase 3 sustainable CI via GH Actions deploy-key tunnel.
    # The `127.0.0.1:` prefix is the security carve-out — the port is reachable
    # ONLY from the VPS host's loopback; never from the public interface.
    # Tunneling clients reach it as `localhost:5432` after `ssh -L ... noctus-vps`.
    # KB § PATTERNS/devops/prod-cache-container.md.
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${NOCTUS_CACHE_PG_DB:-noctus_cache}
      POSTGRES_USER: ${NOCTUS_CACHE_PG_USER:-noctus_cache}
      POSTGRES_PASSWORD: ${NOCTUS_CACHE_PG_PASSWORD:?set NOCTUS_CACHE_PG_PASSWORD in .env.fleet}
    volumes:
      - cache_pg_data:/var/lib/postgresql/data
    networks:
      noctus-net:
        aliases: [noctus-cache-pg]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NOCTUS_CACHE_PG_USER:-noctus_cache} -d ${NOCTUS_CACHE_PG_DB:-noctus_cache}"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    profiles:
      - cache
      - full

  waha:
    # WhatsApp HTTP API — profile-gated. Absent ⇒ FakeWahaClient fallback.
    # On a Linux x86 VPS the default amd64 image runs native (no override
    # needed). ${...} below is compose ${VAR} INTERPOLATION (parse-time, from
    #   deploy/fleet/.env.fleet in this directory) — NOT the root `.env` that
    # env_file: loads (the earlier claim here was wrong, same class as the
    #   JULIA_ANTHROPIC_API_KEY incident, KB § GUIDES/production-deploy.md § 6).
    # REVIEWED — WAHA_API_KEY: this whole service is profile-gated
    #   (`--profile waha`); an empty key has zero prod impact until an
    # operator deliberately enables the profile, at which point they must
    #   set it in deploy/fleet/.env.fleet first (`.env.fleet.example`).
    image: ${WAHA_IMAGE:-devlikeapro/waha:latest}
    platform: ${WAHA_PLATFORM:-linux/amd64}
    container_name: noctus-waha
    environment:
      WAHA_API_KEY: ${WAHA_API_KEY:-}  # env-fleet-empty-ok — see REVIEWED comment above
      WAHA_DASHBOARD_USERNAME: ${WAHA_DASHBOARD_USERNAME:-admin}
      # No `admin` fallback: unset/empty makes WAHA generate a random dashboard
      # password at startup (printed in its logs — docs "How to > Security").
      # Not `:?` — interpolation covers profile-gated services too, so a
      # required var here would break the WHOLE fleet up while `waha` is off.
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD:-}  # env-fleet-empty-ok — see comment above
      WHATSAPP_DEFAULT_ENGINE: WEBJS
    # Internal only — products reach it as http://noctus-waha:3000 over
    # noctus-net; the dashboard (for QR-pairing) is reachable through the
    # named tunnel rather than a published host port.
    expose:
      - "3000"
    volumes:
      - waha_sessions:/app/.sessions
    networks:
      - noctus-net
    restart: unless-stopped
    profiles:
      - waha
      - full

networks:
  noctus-net:
    name: noctus-net
    external: true
  # Private data net: `docker network create --internal noctus-data` (once, before the redis-acl profile).
  # Internal = no egress, no host publish; Redis needs neither. Joined by redis-acl + the live products.
  noctus-data:
    name: noctus-data
    external: true

volumes:
  redis_data:
  redis_acl_data:
  breaker_redis_data:
  waha_sessions:
  cache_pg_data:
    name: noctus-cache-pg-data
