# WAHA instances — ONE WAHA Core container per WhatsApp number. THE SOURCE OF TRUTH.
#
# WAHA CORE allows exactly one session (`default`) per container, so N numbers = N containers.
# deploy/fleet/compose.waha.yml is RENDERED from this file (noctus.dev.waha_instance action='render');
# never hand-edit it. check_waha_instances_render_sync (pre-commit) fails when they differ.
# Secrets are NOT here: each instance reads WAHA_<NAME>_API_KEY / _HMAC_SECRET / _DASHBOARD_PASSWORD from
# deploy/fleet/.env.fleet, generated ON the VPS (KB § GUIDES/production-deploy.md § 5a step 7).
# KB § CONTEXT/INTEGRATIONS/whatsapp.md § "One WAHA per number".
image: devlikeapro/waha:noweb-2026.9.2   # WAHA tags are <engine>-<version>; verified pullable on the VPS 2026-10-27. Bump deliberately
platform: linux/amd64
engine: NOWEB                      # chat list / history backfill; the store itself is enabled per session by the product's start call
mem_limit: 512m                    # measured ~208 MB RSS idle on the first instance; headroom for the NOWEB store
node_heap_mb: 384
instances:
  - name: monica                   # -> service waha-monica, http://waha-monica:3000, volume noctus-waha-monica
    product: monica
    session: default               # CORE: always `default`
