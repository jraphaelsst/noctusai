# WAHA instances — ONE WAHA Core container per WhatsApp number. THE SOURCE OF TRUTH.
#
# WAHA CORE allows exactly one session (`default`) per container, so N numbers = N containers.
# deploy/fleet/compose.waha.yml is RENDERED from this file (noctus.dev.waha_instance action='render');
# never hand-edit it. check_waha_instances_render_sync (pre-commit) fails when they differ.
# Secrets are NOT here: each instance reads WAHA_<NAME>_API_KEY / _HMAC_SECRET / _DASHBOARD_PASSWORD from
# deploy/fleet/.env.fleet, generated ON the VPS (KB § GUIDES/production-deploy.md § 5a step 7).
# KB § CONTEXT/INTEGRATIONS/whatsapp.md § "One WAHA per number".
#
# LINE POLICY v1 (KB § CONTEXT/INTEGRATIONS/whatsapp.md § 6a) -- every instance DECLARES, no defaults:
#   line_policy: {send: enabled|disabled, mark_online: bool, full_sync: bool, auto_repair: bool}   # the platform ceiling
#   edge_deny_writes: bool   # default false. true = deny proxy `waha-<name>` (nginx) in front of `waha-<name>-core`; 403s every write
#   dashboard: bool          # default true.  false = WAHA dashboard + Swagger OFF (and no dashboard password key)
# `send: disabled` REQUIRES edge_deny_writes: true and dashboard: false. A line with no policy is refused by the seed
# (fail-closed). The product receives the policy as <PRODUCT>_WAHA_LINE_POLICY (`plan` prints it) and registers it at boot.
image: devlikeapro/waha:noweb-2026.9.2   # WAHA tags are <engine>-<version>; verified pullable on the VPS 2026-10-27. Bump deliberately
platform: linux/amd64
engine: NOWEB                      # chat list / history backfill; the store itself is enabled per session by the product's start call
mem_limit: 512m                    # measured ~208 MB RSS idle on the first instance; headroom for the NOWEB store
node_heap_mb: 384
instances:
  - name: monica                   # -> service waha-monica, http://waha-monica:3000, volume noctus-waha-monica
    product: monica
    session: default               # CORE: always `default`
    line_policy: {send: enabled, mark_online: true, full_sync: true, auto_repair: true}   # monica's CURRENT behaviour, made explicit
  - name: assistant                # -> core waha-assistant (no edge: a send-enabled line has none); volume noctus-waha-assistant
    product: assistant
    session: default
    # The owner's PERSONAL number, LIVE (owner decision 2026-11-12, supersedes the D46/D49 read-only shadow): the assistant
    # product SENDS replies through it. mark_online/full_sync/auto_repair stay off (presence + history are privacy) and the
    # dashboard + Swagger stay off (they can send). WHO may be answered is enforced in the agents product (`decidir`
    # allow-list + on/off) AND at the assistant's send seam, not here. A personal line is provisioned by the owner by hand or
    # by an agent through the shared checks (KB § INTEGRATIONS/whatsapp.md § 6a); `remove` is refused for agents.
    personal: true
    line_policy: {send: enabled, mark_online: false, full_sync: false, auto_repair: false}
    dashboard: false
