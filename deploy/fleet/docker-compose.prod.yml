# NoctusAI — PRODUCTION fleet (compose project: noctusai-products-prod).
#
# Project: production-deploy-migration. This is the PRODUCTION shape of the
# 8-product fleet for a single VPS. It is deliberately DIFFERENT from the
# checked-in per-product products/<slug>/docker-compose.yml files:
#
#   products/<slug>/docker-compose.yml  =  DEV shape
#     build: target runtime-watch + source bind-mounts + host port publish
#     (vite build --watch + uvicorn --reload — live local feedback).
#
#   THIS file                           =  PROD shape
#     image: ghcr.io/... (NO build, NO bind-mounts, slim `runtime` target,
#     baked dist, node-absent) + expose-only (no host port publish — the
#     Cloudflare named tunnel reaches each container over noctus-net) +
#     restart: unless-stopped + healthcheck on /api/health.
#
# Images are pulled from GHCR; build + push them with build-and-push.sh
# (which bakes the per-product VITE_* build args). NOTHING here builds.
#
# Network: noctus-net is EXTERNAL — the same shared fabric the dev fleet,
# the infra project (compose.infra.prod.yml), the named tunnel
# (deploy/tunnel/) and the legacy container (deploy/legacy/) all join.
# Create it ONCE on the VPS before `up`:
#   docker network create noctus-net
#
# Ports are INTERNAL (expose:, not ports:) — nothing is published to the
# VPS host. The named tunnel routes hostname → http://<service>:<port>
# across noctus-net. core (8000) is the APEX product.
#
# Usage on the VPS (full runbook: README.md):
#   echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# Image tag defaults to :latest in prod. CI moves :latest ONLY on a
# prod-ref build (KB § GUIDES/production-deploy.md § 2b PROD-PIN fix,
# 2026-07-20) — a routine `main` push tags the non-fleet-facing :edge
# instead. Pin NOCTUS_IMAGE_TAG=<git-sha> in .env for an immutable deploy.

name: noctusai-products-prod

# Shared cache-backend env (YAML anchor — DRY across all 9 services).
# Wires every prod product container to read the keeper-mirror caches from
# the in-fleet `noctus-cache-pg` Postgres instead of local SQLite.
# - Service alias: `noctus-cache-pg:5432` (resolves over the external
#   `noctus-net` docker network — same fabric the products + infra share).
# - The DSN's `${NOCTUS_CACHE_PG_PASSWORD}` is expanded by docker-compose at
#   parse time from the operator's environment (set via `.env.fleet` or
#   `--env-file`); deploy invocation MUST have it in scope, same as the
#   sibling `compose.infra.prod.yml` cache-pg service.
# Dev uses local SQLite (the backend selector falls back when
# NOCTUS_CACHE_BACKEND is unset) — this anchor only fires in prod.
# KB § PATTERNS/devops/prod-cache-container.md.
x-cache-env: &cache-env
  NOCTUS_CACHE_BACKEND: postgres
  NOCTUS_CACHE_POSTGRES_DSN: postgresql://noctus_cache:${NOCTUS_CACHE_PG_PASSWORD}@noctus-cache-pg:5432/noctus_cache

# The ONE prod environment block, anchored on its own so a service needing
# an EXTRA key merges this instead of re-declaring `environment:`.
#
# Re-declaring shadows the whole inherited mapping rather than adding to it,
# and the failure is silent. `dev-team` did exactly that: it re-declared
# `environment:` for one API key, merged `*cache-env` back to repair the
# cache wiring someone had already noticed going missing — and then silently
# lost `NOCTUS_SCHEDULERS_ENABLED` when that line was added to the anchor
# later, because nothing re-checks a hand-copied subset. Merging THIS anchor
# cannot drift: a key added here reaches every service that merges it.
x-prod-env: &prod-env
  <<: *cache-env
  # Authorises this container to RUN scheduled jobs. Without it,
  # `noctusai_lib.api.scheduler.start_scheduler()` registers every job and
  # starts none.
  #
  # 🔴 This MUST stay here and NEVER move into `.env`. The entire guarantee
  # is that the file a developer copies to a laptop does not carry it — a
  # backend left running locally against the production `.env` fired the
  # nightly Vista sync and wrote to the live catalog on 2026-08-22. `.env`
  # is shared with laptops; this compose block is not.
  #
  # Losing this line does NOT fail loudly at deploy — the container starts
  # healthy and silently runs zero jobs. `start_scheduler` logs at ERROR
  # when it finds a deploy context without the marker; that log is the
  # detection.
  NOCTUS_SCHEDULERS_ENABLED: "1"

  # Prod shape, pinned here for the SAME reason as the line above: `.env` is
  # the file a developer copies to a laptop, this compose block is not.
  #
  # `.env` on the VPS carried `DEBUG=true`, and `settings.debug` gates three
  # unrelated things at once in the seed:
  #   • `docs_url` / `redoc_url` — `/docs` and `/openapi.json` were answering
  #     200 on the PUBLIC internet for all seven products (verified through
  #     the CF edge, 2026-08-24). The whole API surface, published.
  #   • log LEVEL — DEBUG wrote full OpenAI request payloads, customer
  #     WhatsApp message content included, into `docker logs`.
  #   • `settings.is_production` — reported False in production, so Sentry
  #     tagged every event `environment=development` and sampled at 100%.
  #
  # `environment:` wins over `env_file:` in compose, so this holds regardless
  # of what `.env` says — the invariant lives in the repo, not on the host.
  #
  # Readable (non-JSON) logs no longer require this flag: set
  # `NOCTUSAI_JSON_LOGS=0` instead, which changes format ONLY.
  DEBUG: "false"

# Shared per-service prod defaults (YAML anchor — DRY across the fleet).
# env_file the root .env (one source of runtime config + secrets);
# environment is the *prod-env block above; restart unless-stopped;
# join the external noctus-net.
x-prod-defaults: &prod-defaults
  env_file:
    - ../../.env
  environment: *prod-env
  restart: unless-stopped
  networks:
    - noctus-net

services:
  # ── core 8000 — APEX product (the platform shell) ──────────────────
  core:
    <<: *prod-defaults
    image: ghcr.io/jraphaelsst/noctus-core:${NOCTUS_IMAGE_TAG:-latest}
    container_name: noctus-core
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── erp-imobiliario 8001 ───────────────────────────────────────────
  erp-imobiliario:
    <<: *prod-defaults
    image: ghcr.io/jraphaelsst/noctus-erp-imobiliario:${NOCTUS_IMAGE_TAG:-latest}
    container_name: noctus-erp-imobiliario
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── personal-finance 8002 ──────────────────────────────────────────
  personal-finance:
    <<: *prod-defaults
    image: ghcr.io/jraphaelsst/noctus-personal-finance:${NOCTUS_IMAGE_TAG:-latest}
    container_name: noctus-personal-finance
    expose:
      - "8002"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8002/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── therapy-platform 8003 ──────────────────────────────────────────
  therapy-platform:
    <<: *prod-defaults
    image: ghcr.io/jraphaelsst/noctus-therapy-platform:${NOCTUS_IMAGE_TAG:-latest}
    container_name: noctus-therapy-platform
    expose:
      - "8003"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8003/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── seed 8004 — canonical living reference / canary (seed.noctusai.com) ─
  # `products/seed/` is a FIRST-CLASS running product + canary (migration
  # 038 re-adds its dashboard row). Reconciled back into this durable file
  # from the live VPS stopgap, where it had been added as a deploy-local
  # edit during the seed canary (2026-05-25).
  seed:
    <<: *prod-defaults
    image: ghcr.io/jraphaelsst/noctus-seed:${NOCTUS_IMAGE_TAG:-latest}
    container_name: noctus-seed
    expose:
      - "8004"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8004/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── daily-life 8005 ────────────────────────────────────────────────
  daily-life:
    <<: *prod-defaults
    image: ghcr.io/jraphaelsst/noctus-daily-life:${NOCTUS_IMAGE_TAG:-latest}
    container_name: noctus-daily-life
    expose:
      - "8005"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8005/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── adconnect 8007 ─────────────────────────────────────────────────
  adconnect:
    <<: *prod-defaults
    image: ghcr.io/jraphaelsst/noctus-adconnect:${NOCTUS_IMAGE_TAG:-latest}
    container_name: noctus-adconnect
    expose:
      - "8007"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8007/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── dev-team 8009 — needs ANTHROPIC_API_KEY (the agno "switch") ─────
  # The engine (dev_team/) is BAKED into the image at build time
  #   (Dockerfile: `COPY dev_team /opt/dev_team` + `pip install -e`),
  # so NO /opt/dev_team bind-mount is needed in prod — it ships in the
  # image. `environment:` wins over `env_file:` in compose (see x-prod-env
  #   above), so the explicit `ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}`
  # line below is what the container actually gets — ${...} is INTERPOLATED
  #   from deploy/fleet/.env.fleet (compose-parse time, in this directory),
  # NOT read from the root `.env` via env_file, regardless of what the root
  #   `.env` carries for that name (the JULIA_ANTHROPIC_API_KEY class below —
  # this one is documented + reviewed, that one was not, 2026-09-16).
  #   env-fleet-empty-ok — REVIEWED: if unset, dev-team runs healthy but
  # returns {status: "switch-not-flipped"} on /api/run (graceful, by design;
  #   backend/app/services/agno_health.py). See deploy/fleet/env.fleet.keys.
  dev-team:
    <<: *prod-defaults
    image: ghcr.io/jraphaelsst/noctus-dev-team:${NOCTUS_IMAGE_TAG:-latest}
    container_name: noctus-dev-team
    # Merge the FULL prod env, then add this service's extra key. Merging the
    # `*cache-env` subset here (as this did until 2026-08-24) silently dropped
    # every other prod-defaults key — `NOCTUS_SCHEDULERS_ENABLED` among them.
    environment:
      <<: *prod-env
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}  # env-fleet-empty-ok — see block comment above
    expose:
      - "8009"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8009/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── social-wiring 8011 ─────────────────────────────────────────────
  social-wiring:
    <<: *prod-defaults
    image: ghcr.io/jraphaelsst/noctus-social-wiring:${NOCTUS_IMAGE_TAG:-latest}
    container_name: noctus-social-wiring
    expose:
      - "8011"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8011/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── orbity 8010 — agency operating-system (absorbed from sistema-orbity) ─
  orbity:
    <<: *prod-defaults
    image: ghcr.io/jraphaelsst/noctus-orbity:${NOCTUS_IMAGE_TAG:-latest}
    container_name: noctus-orbity
    expose:
      - "8010"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8010/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── igig 8013 — agency ERP (CRM, marca, esteira, distribuição, financeiro) ─
  igig:
    <<: *prod-defaults
    image: ghcr.io/jraphaelsst/noctus-igig:${NOCTUS_IMAGE_TAG:-latest}
    container_name: noctus-igig
    expose:
      - "8013"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8013/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── p-studio 8014 ────────────────────────────────────────────────────
  p-studio:
    <<: *prod-defaults
    image: ghcr.io/jraphaelsst/noctus-p-studio:${NOCTUS_IMAGE_TAG:-latest}
    container_name: noctus-p-studio
    expose:
      - "8014"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8014/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── academia-de-reciclagem 8015 — Julia's real-life project knowledge base ─
  # (roadmap julia-agents-academia-2026-09, M6 cutover). Single product
  # token, append-only kb_revisions, imported sibling-workspace history.
  academia-de-reciclagem:
    <<: *prod-defaults
    image: ghcr.io/jraphaelsst/noctus-academia-de-reciclagem:${NOCTUS_IMAGE_TAG:-latest}
    container_name: noctus-academia-de-reciclagem
    expose:
      - "8015"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8015/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # D1 hardening (roadmap julia-agents-academia-2026-09, row D1).
    # Prod is first contact for this image (dev fleet dormant — KB §
    # PATTERNS/devops/dev-fleet-dormant.md), so the deploy shape carries
    # this from day one rather than bolting it on at cutover.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    # /tmp only, and only because it is genuinely needed: Starlette's
    # multipart parser (POST /api/import, contract §B.6) spools any
    # part over 1MB to a tempfile.SpooledTemporaryFile under the
    # process's tmp dir (verified live against the installed starlette
    # 0.49.3: formparsers.MultiPartParser.spool_max_size == 1024*1024),
    # and the contract caps a bundle at 20MB — every real import
    # spills to disk. mode=1777 mirrors standard /tmp semantics
    # (world-writable + sticky bit) so the `noctus` app user can
    # create its own spill files without a broader writable root.
    tmpfs:
      - /tmp:mode=1777,size=64m
    mem_limit: 512m

  # ── agents 8016 — Julia chat, approvals, persona; lists One Chat's toggle ──
  # (roadmap julia-agents-academia-2026-09, M6 cutover). Julia reaches
  # academia ONLY through her own scoped product token (contract §E.6);
  # her Claude CLI subprocess is spawned per-conversation under one of 3
  # dedicated slot uids (contract §E.11) — never the container's own uid.
  agents:
    <<: *prod-defaults
    image: ghcr.io/jraphaelsst/noctus-agents:${NOCTUS_IMAGE_TAG:-latest}
    container_name: noctus-agents
    # Merge the FULL prod env, then map Julia's DEDICATED, spend-capped key
    # (contract §E.5 — never shared with any other product's LLM calls) onto
    # the container's ANTHROPIC_API_KEY. `JULIA_ANTHROPIC_API_KEY` is a
    # SEPARATE deploy/fleet/.env.fleet key (compose ${...} INTERPOLATION, not
    # env_file:) from the bare `ANTHROPIC_API_KEY` dev-team reads above — the
    # bare name must never reach this container. 🔴 2026-09-16 incident: this
    # key was only ever documented as a root `.env` entry, so it silently
    # interpolated to '' — every Julia turn failed at the CLI-spawn step
    # while /api/health stayed 200. Must be listed (names only) in
    # deploy/fleet/env.fleet.keys AND actually set, with a value, in
    # deploy/fleet/.env.fleet on the VPS — `check_prod_compose_env_manifest_
    # sync` gates the former; the latter has no repo-only witness. Re-merging
    # `*prod-env` (not a hand-copied subset) means a key added to that anchor
    # later is never silently dropped here either (see the dev-team service's
    # own comment above for the incident this pattern already fixed once).
    # REVIEWED: the tech-lead set this key's value in deploy/fleet/.env.fleet
    #   on the VPS during the 2026-09-16 incident response (same session).
    # The STATIC check ends there — whether the VALUE is still present on a
    #   given VPS going forward is the live half no repo-only check can see;
    # verify with the optional `env_fleet_manifest` leg in
    #   noctus.dev.predeploy_check, fed a deploy/fleet/.env.fleet snapshot.
    environment:
      <<: *prod-env
      ANTHROPIC_API_KEY: ${JULIA_ANTHROPIC_API_KEY:-}  # env-fleet-empty-ok — see REVIEWED comment above
    expose:
      - "8016"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8016/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # D1 hardening (roadmap julia-agents-academia-2026-09, row D1;
    # revised for §E.11 per-conversation isolation, 2026-09-15). Prod
    # is first contact for this image (dev fleet dormant — KB §
    # PATTERNS/devops/dev-fleet-dormant.md). `bin/entrypoint.sh` FAILS
    # CLOSED if any of these are missing — verified empirically.
    cap_drop:
      - ALL
    # SETUID/SETGID/KILL — nothing else. I4 (contract §E.11): never
    # CHOWN, FOWNER or DAC_OVERRIDE. contract §E.11 spawns the Julia CLI
    # subprocess under a per-conversation slot uid (`user="julia-cli-
    # <K>"` on ClaudeAgentOptions); dropping to that uid AT EXEC
    # (`bin/entrypoint.sh`'s own `setpriv`, not a bare `USER` directive
    # — verified empirically that `USER` alone never populates AMBIENT
    # caps for a non-root process, moby#45491) needs CAP_SETUID +
    # CAP_SETGID effective on the process making that switch — the
    # SAME two caps also let `bin/julia-cli-exec`'s own `setpriv
    # --clear-groups` run for ANY slot uid (setgroups always needs
    # CAP_SETGID, even for an already-matching uid). CAP_KILL: `noctus`
    # must be able to signal a slot uid's CLI subprocess (a DIFFERENT
    # uid) on turn-timeout/SDK-close — verified empirically that
    # signalling a different uid without it is denied (EPERM), leaking
    # a hung CLI process for the container's whole lifetime. Nothing
    # wider is ever added: no CAP_CHOWN/FOWNER/DAC_OVERRIDE — the slot
    # sweep (`bin/julia-cli-slot`) only ever chmod/rm's files the
    # sweeping uid already OWNS (only that uid can ever create a file
    # under its own mode-0700 tmpfs), so no capability is needed for
    # that either. NOT CAP_SETPCAP: every `setpriv --bounding-set=`
    # clause was removed from every script in this image (wrapper +
    # slot script + entrypoint) — verified empirically that it needs
    # CAP_SETPCAP (`setpriv: apply bounding set: Operation not
    # permitted`), and `cap_drop`/`cap_add` already fix the
    # bounding-set ceiling with zero in-container action needed;
    # `no-new-privileges` keeps the leftover bounding bits inert
    # regardless.
    cap_add:
      - SETUID
      - SETGID
      - KILL
    security_opt:
      - no-new-privileges:true
    read_only: true
    # One dedicated tmpfs PER SLOT for the Julia CLI's own per-
    # conversation HOME/TMPDIR — each owned by its own `julia-cli-K`
    # uid/gid alone, mode 0700 (I3: nothing from one conversation's
    # slot is readable by another slot's uid — verified empirically
    # both ways, and by neither slot uid). 40m each (24 MiB transcript
    # cap plus working space, contract §E.11 user decision 2026-09-15).
    # `/run/julia-handoff` is the ONE shared mount across slots —
    # owned by `noctus` (uid/gid 1000), mode 0711 (traversable by every
    # slot uid — "other" — but not LISTABLE, so a slot can only ever
    # reach a file whose exact path it already expects, never discover
    # a sibling slot's files by listing); `noctus` writes each slot's
    # handoff file with mode 0640 and group `julia-cli-K`, so only that
    # one slot uid (via its own primary group after `--clear-groups`)
    # can read it.
    #
    # This product's `/tmp` belongs to `noctus` ONLY —
    # uid=0,gid=1000,mode=1770 (owner root rwx, group `noctus` rwx +
    # sticky, other/any slot uid NO access at all). agents has no
    # multipart-upload route (unlike academia's `/tmp:mode=1777`, kept
    # as-is there — see `_C_HARDENING_ACADEMIA`'s own comment), so
    # nothing needs `/tmp` to be world-writable here, and locking it to
    # `noctus` closes the one path a slot uid could otherwise have
    # used to leave a file `noctus` might later trust.
    tmpfs:
      - /run/julia-0:uid=2000,gid=2000,mode=0700,size=40m
      - /run/julia-1:uid=2001,gid=2001,mode=0700,size=40m
      - /run/julia-2:uid=2002,gid=2002,mode=0700,size=40m
      - /run/julia-handoff:uid=1000,gid=1000,mode=0711,size=80m
      - /tmp:mode=1770,uid=0,gid=1000,size=64m
    # A small explicit /dev/shm — python/uvicorn have no real shared-
    # memory need here; explicit + small beats an unexamined default.
    shm_size: 64m
    # Worst-case tmpfs is 3×40 + 80 = 200 MiB of this 1 GiB limit
    # (contract §E.11) — the CLI's own RSS has not been measured
    # (CI has no API key); SEC-C records it at the first prod turn. If
    # three concurrent CLIs plus uvicorn exceed the limit, raise this
    # rather than shrink the tmpfs caps.
    mem_limit: 1g
    # `init: true` — a minimal PID-1 init (tini) reaps zombies from any
    # slot's Julia CLI subprocess tree so a killed-but-unreaped child
    # (see the CAP_KILL comment above) never accumulates; without it
    # `noctus` (not PID 1 here — the entrypoint execs INTO it, so it IS
    # PID 1) would have to reap its own children, which the SDK's
    # client-close path already does on the happy path but should not
    # be the ONLY thing standing between a hung turn and a zombie leak.
    init: true
    # AGENTS_INSTANCE_ID (contract §E.9, roadmap D1) is deliberately
    # left UNSET here, not baked as a fixed literal: `app/runtime/
    # __init__.py::_resolve_instance_id` already prefers an explicit
    # env override and falls back to `HOSTNAME`, which Docker sets to
    # this container's own id. That id is stable across a `docker
    # restart` of THIS container (satisfying "stable across restarts
    # of the same container") and changes only when a genuinely NEW
    # container is created on redeploy — which is correctly a new
    # instance for the startup orphan-sweep (contract §E.2 security
    # finding 5), not a bug. Set AGENTS_INSTANCE_ID explicitly only if
    # a future orchestrator stops giving the container a stable
    # hostname (e.g. Swarm/K8s pod churn).


networks:
  noctus-net:
    name: noctus-net
    external: true
