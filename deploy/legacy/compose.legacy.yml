# Legacy app compose — "Sistema de Permutas Imobiliárias" (legacy.noctusai.com).
#
# Two services share ONE built image (the Dockerfile in this dir):
#   legacy         → gunicorn on :5000 (Django + WhiteNoise-served SPA)
#   legacy-celery  → celery -A backend worker (async bilateral matching)
# Without the worker, async match processing silently fails (see the app's
# .replit / CLAUDE.md). Both MUST run.
#
# Redis  : DEDICATED `legacy-redis` (this file), password-protected, on legacy-net ONLY. The legacy Django app is
#          the oldest, least-patched code on the box, so it shares neither a network nor a Redis with the fleet
#          (security hardening 2026-11-15). The password and BOTH Celery URLs are DERIVED from REDIS_ACL_MASTER_SECRET
#          by `noctus.dev.redis_acl render --write` into redis-auth/legacy.env beside this file (gitignored), which is
#          loaded AFTER .env so it wins. Nothing to type; a not-yet-rendered stack starts as before (no password).
# Postgres: EXTERNAL — Supabase, via SUPABASE_DB_URL. No DB container here.
# Network : `legacy-net` (EXTERNAL, created once: `docker network create legacy-net`), NOT `noctus-net`: no product
#           container can resolve or reach `legacy`. The Cloudflare tunnel container ALSO joins legacy-net
#           (deploy/tunnel/compose.tunnel.yml) so legacy.noctusai.com → http://legacy:5000 keeps working.
#           Apply order: create the network, join the tunnel to it, THEN recreate legacy.
#
# Build context = the legacy app source root (the read-only reference clone).
# Adjust `build.context` to wherever that source lives on the VPS.
# REACT_APP_* are BUILD args (CRA inlines them) — set them in the shell env or
# a .env beside this file before `docker compose build`.
#
# Bring up (from this directory):
#   docker compose -f compose.legacy.yml --env-file .env build
#   docker compose -f compose.legacy.yml --env-file .env up -d
# Run migrations once after the DB is reachable (deploy-time, not build-time):
#   docker compose -f compose.legacy.yml run --rm legacy python manage.py migrate --noinput

services:
  legacy:
    depends_on:
      - legacy-redis
    build:
      # Source root of the legacy app (the read-only reference clone). These were
      # relative to the OLD archived location; the assets now live in the live
      # tree (deploy/legacy/), so the paths are env-driven instead of positional
      # and no longer break when this file moves. Defaults match the VPS layout
      # documented in README.md.
      context: ${LEGACY_SRC:-/opt/noctus/legacy-src}
      dockerfile: ${LEGACY_DOCKERFILE:-/opt/noctus/noctusai/deploy/legacy/Dockerfile}
      args:
        # CRA inlines these at build time. REACT_APP_SUPABASE_* are intentionally
        # NOT passed: their only referrer was an unused Supabase client that
        # published the anon key in the public bundle (deleted upstream, da8cf2d).
        REACT_APP_API_URL: ${REACT_APP_API_URL:-}
    # pin-ok: locally built image (build: above), never pulled from a registry
    image: legacy-permutas:latest
    container_name: legacy-permutas
    env_file:
      - .env
      - path: ./redis-auth/legacy.env   # LEGACY_REDIS_PASSWORD + CELERY_* (derived), overrides .env
        required: false
    expose:
      - "5000"
    networks:
      - legacy-net
    restart: unless-stopped
    healthcheck:
      # send the real Host — ALLOWED_HOSTS=legacy.noctusai.com → a bare localhost
      # request 400s (Django DisallowedHost). This curl matches the served host.
      test: ["CMD", "curl", "-fsS", "-H", "Host: legacy.noctusai.com", "http://localhost:5000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  legacy-celery:
    # Reuse the SAME built image (no second build); override the command to run
    # the Celery worker instead of gunicorn.
    # pin-ok: locally built image (shared with `legacy`), never pulled from a registry
    image: legacy-permutas:latest
    container_name: legacy-permutas-celery
    command: ["celery", "-A", "backend", "worker", "--loglevel=info", "--concurrency=2"]
    env_file:
      - .env
      - path: ./redis-auth/legacy.env
        required: false
    depends_on:
      - legacy
      - legacy-redis
    networks:
      - legacy-net
    restart: unless-stopped

  legacy-redis:
    # Same digest-pinned 7.4.6 the fleet's ACL Redis uses.
    image: redis:8.10.3-alpine@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3
    container_name: legacy-permutas-redis
    env_file:
      - path: ./redis-auth/legacy.env   # LEGACY_REDIS_PASSWORD, derived
        required: false
    command: ["sh", "-c", "if [ -n \"$$LEGACY_REDIS_PASSWORD\" ]; then exec redis-server --appendonly yes --requirepass \"$$LEGACY_REDIS_PASSWORD\"; fi; exec redis-server --appendonly yes"]
    volumes:
      - legacy_redis_data:/data
    expose:
      - "6379"
    networks:
      - legacy-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$LEGACY_REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  legacy-net:
    name: legacy-net
    external: true

volumes:
  legacy_redis_data:
