# Canonical per-product compose fragment.
#
# This file at products/seed/docker-compose.yml is the reference; every
# other product's docker-compose.yml is a copy with slug + ports
# substituted. Two ways to use it:
#
#   1. Standalone (just this product):
#        cd products/seed && docker compose up
#
#   2. Orchestrated by the platform root (all products together):
#        docker compose up                          # at repo root
#        docker compose --profile redis up          # + Redis service
#        docker compose --profile full up           # + all optional services
#
# Build context is `../..` so seed/ and product code are both reachable
# from the repo root (vite.config.factory + seed editable installs both
# need the repo-root layout preserved during build).
#
# Networks:
#   noctus-net   shared platform fabric — declared external so the root
#                compose can create it once and every product joins it.
#   seed-net     product-private — backend ↔ frontend isolation by default.

services:
  seed-backend:
    build:
      context: ../..
      dockerfile: products/seed/backend/Dockerfile
    container_name: noctus-seed-backend
    image: ghcr.io/jraphaelsst/noctus-seed-backend:${NOCTUS_IMAGE_TAG:-dev}
    env_file:
      - ../../.env
    ports:
      - "{{BACKEND_PORT}}:{{BACKEND_PORT}}"
    networks:
      - noctus-net
      - seed-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:{{BACKEND_PORT}}/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # Per-product healthcheck override — uncomment + customize for products
    # with deeper readiness probes (e.g. dev-team wires `agno_ping` via
    # HealthEndpointConfig(readiness_hooks=[...]) and targets /_ready here).
    # The seed-native `/_ready` endpoint aggregates every registered
    # readiness_hook; prefer composing hooks over inventing new paths.
    # See KB § PATTERNS/containerization.md §11c · Per-product healthcheck
    # override.
    # healthcheck:
    #   test: ["CMD", "curl", "-fsS", "http://localhost:{{BACKEND_PORT}}/_ready"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 30s

  seed-frontend:
    build:
      context: ../..
      dockerfile: products/seed/frontend/Dockerfile
      # VITE_* build-arg contract — every `import.meta.env.VITE_*`
      # referenced in code MUST be declared (a) as ARG in the frontend
      # Dockerfile build stage and (b) as a key in this `args:` block,
      # sourced from the repo-root `.env` via ${VITE_FOO} interpolation.
      # `.env` is in .dockerignore (it has secrets); build-args bridge it
      # into the Vite build process. Public-by-design: VITE_* ships to
      # the browser bundle — only put PUBLIC config here. Carve-out:
      # `VITE_BACKEND_API_URL` + `VITE_PRODUCT_SCHEMA` are factory-injected
      # via `define:` in vite.config.factory.ts (no build-arg needed for
      # those two). See KB § PATTERNS/containerization.md § VITE_* build-arg contract.
      args:
        VITE_CORE_URL: ${VITE_CORE_URL:-}
    container_name: noctus-seed-frontend
    image: ghcr.io/jraphaelsst/noctus-seed-frontend:${NOCTUS_IMAGE_TAG:-dev}
    ports:
      - "{{FRONTEND_PORT}}:{{FRONTEND_PORT}}"
    depends_on:
      seed-backend:
        condition: service_healthy
    networks:
      - seed-net
    restart: unless-stopped


  seed-tunnel:
    # Cloudflare quick-tunnel — ephemeral *.trycloudflare.com URL pointing
    # at this product's backend. Profile-gated so it's opt-in (cost: one
    # extra container; benefit: webhook/OAuth callback testing without a
    # full deploy). Pattern from noctusai-youtube-crawler.
    image: cloudflare/cloudflared:latest
    container_name: noctus-seed-tunnel
    # `--protocol http2` forces TCP from the start. The default `auto` tries
    # QUIC/UDP first; home/office NATs frequently kill the UDP connection
    # within ~5 minutes ("timeout: no recent network activity"), and
    # cloudflared's auto-reconnect cannot re-register the quick-tunnel
    # hostname once it's been dropped — DNS goes NXDOMAIN forever even
    # though the container stays "Up". HTTP2 is the documented long-running
    # fallback. See KB § PATTERNS/containerization.md § Troubleshooting.
    command: tunnel --no-autoupdate --protocol http2 --url http://seed-backend:{{BACKEND_PORT}}
    depends_on:
      seed-backend:
        condition: service_healthy
    networks:
      - seed-net
    restart: unless-stopped
    profiles:
      - tunnel-seed
      - tunnel-all

networks:
  noctus-net:
    name: noctus-net
    driver: bridge
  seed-net:
    driver: bridge
