# YouTube Crawler frontend — nginx config for the built Vite bundle.
#
# Two jobs:
#   1. Serve the `dist/` static assets.
#   2. SPA fallback — any path that doesn't match a real file resolves to
#      /index.html so the React Router routes (/chat, /upload, /videos,
#      /configuracoes, etc.) work on direct loads + page refreshes.
#
# The frontend never proxies to the backend directly. When the stack
# runs behind the `proxy` service (the public-tunnel path), the proxy
# routes /api/* to the backend before requests ever reach this nginx.
# When accessed directly at localhost:8150 (local-dev only), the
# frontend uses the configured VITE_BACKEND_API_URL with CORS.

server {
  listen 8150;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Static assets — cache aggressively. Vite emits content-hashed
  # filenames so cache-busting is free.
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA fallback — any non-asset path falls back to index.html so
  # React Router can take over.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
