[pytest]
# `importlib` mode stops pytest from synthesizing a `google.tests`
# package path for the test module — the dir name `google` collides
# with the PyPI `google.*` namespace package. conftest.py does the
# sys.path wiring. import-mode has no plain ini key, so it goes through
# addopts (consumed before conftest collection).
addopts = --import-mode=importlib
testpaths = tests
