# Gitleaks configuration — secrets scanning.
#
# Used by:
#   - CI job `gitleaks-scan` in `.github/workflows/test.yml`.
#   - Local invocation:
#       gitleaks detect --no-git --source . --config .gitleaks.toml --verbose
#
# Schema: https://github.com/gitleaks/gitleaks/blob/master/README.md#configuration
#
# Strategy: extend the bundled default ruleset; only add an allowlist for
# known-safe public values that live in the repo (test fixtures, example
# JWTs published by the upstream SDK). We do NOT redefine rules here —
# the bundled defaults cover AWS, GCP, Stripe, GitHub, generic high-entropy
# strings, private keys, etc.

[extend]
useDefault = true

# Repo-wide allowlist. `regexes` matches the LEAKED VALUE itself (not file
# path). `paths` matches file path. Either match = false positive suppressed.
[allowlist]
description = "Known-safe public values that ship in the repo"
regexTarget = "match"

regexes = [
  # Supabase demo publishable JWT — ships in `.github/workflows/test.yml`
  # (`VITE_SUPABASE_PUBLISHABLE_KEY` for E2E tests) and in `.env.example`.
  # This is the documented Supabase local-dev demo key, public, safe.
  # Anchored on the unique payload claim `"iss":"supabase-demo"`.
  '''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9\.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0''',

  # NoctusAI API-key prefix placeholders in router tests.
  # Pattern: `noctus_k_<short-ascii>` — these are fabricated string
  # fragments used as test fixtures for the `key_prefix` field, not
  # real credentials. Real API keys generated by the platform are
  # 32+ char base64url tokens prefixed differently.
  '''noctus_k_[a-z0-9_]{1,16}''',

  # NoctusAI auth-token test fixtures.
  # Pattern: `tok_<state>_<seq>` (e.g. `tok_pending_001`) — fabricated
  # OAuth flow placeholders, not real bearer tokens.
  '''tok_[a-z]+_[a-z0-9_]{1,20}''',
]

paths = [
  # Example / sample env files — populated with placeholders only.
  '''\.env\.example$''',
  '''.*\.env\.example$''',

  # Test fixtures — assume fixture values are non-production.
  # Tightly scoped to fixture directories so real test code is still scanned.
  '''.*/tests?/fixtures/.*''',
  '''.*/tests?/data/.*''',

  # Generated lockfiles — npm + pnpm + yarn lock formats contain registry
  # token hashes that gitleaks' generic-secret rule flags spuriously.
  '''package-lock\.json$''',
  '''pnpm-lock\.yaml$''',
  '''yarn\.lock$''',

  # Project documentation that quotes example secrets for narrative purposes.
  '''KNOWLEDGE-BASE/.*\.md$''',
  '''CLAUDE\.md$''',
  '''.*/CLAUDE/.*\.md$''',

  # Templates ship placeholder env-files for scaffold.
  '''templates/.*''',
]
