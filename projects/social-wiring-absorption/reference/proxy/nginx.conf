# YouTube Crawler reverse-proxy — fronts every public-facing surface
# on a single port so the Cloudflare Quick Tunnel can give one URL for
# both frontend + backend.
#
# Routing:
#   /api/*           → app:8010   (FastAPI routes)
#   /docs            → app:8010   (Swagger UI)
#   /openapi.json    → app:8010   (OpenAPI schema)
#   /redoc           → app:8010   (ReDoc)
#   /waha/*          → waha:3000  (WAHA HTTP API + dashboard)
#   /*               → frontend:8150 (SPA — falls through to /index.html
#                                     via the frontend nginx)
#
# Why a separate proxy instead of putting these blocks on the frontend
# nginx directly:
#   - Keeps the frontend container concerned only with the SPA.
#   - Lets the tunnel point at a stable internal endpoint
#     (proxy:8090) regardless of which backends are being added.
#   - WAHA stays optionally exposed at /waha/* without leaking auth
#     headers — the request flows through with X-Api-Key set by the
#     caller (the WAHA dashboard) so it stays compatible.

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  # Big uploads — videos can be 100s of MB. The body never lives on
  # disk on the proxy, it streams through.
  client_max_body_size 5g;
  client_body_buffer_size 1m;
  proxy_request_buffering off;
  proxy_buffering off;

  # Long-poll friendly — OpenAI vision + video keyframe extraction
  # routinely take 10-30s; YouTube uploads stream for minutes. Don't
  # break the connection in the middle.
  proxy_connect_timeout 30s;
  proxy_send_timeout 600s;
  proxy_read_timeout 600s;
  send_timeout 600s;

  # WebSocket / upgrade plumbing (none today but cheap to enable).
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  log_format compact '$remote_addr "$request" $status $body_bytes_sent rt=$request_time uct=$upstream_connect_time urt=$upstream_response_time';
  access_log /var/log/nginx/access.log compact;

  upstream app_upstream      { server app:8010; }
  upstream frontend_upstream { server frontend:8150; }
  upstream waha_upstream     { server waha:3000; }

  server {
    listen 8090;
    server_name _;

    # ─── Backend API ───────────────────────────────────────────────
    # Every FastAPI router lives under /api/*. The auto-generated
    # docs are top-level but few enough to enumerate.
    location /api/ {
      proxy_pass http://app_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }

    location = /docs {
      proxy_pass http://app_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /openapi.json {
      proxy_pass http://app_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /redoc {
      proxy_pass http://app_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── WAHA HTTP API + dashboard ─────────────────────────────────
    # Mounted under /waha so the public URL can hit the WAHA
    # dashboard (e.g. /waha/dashboard) and the send-text API
    # (/waha/api/sendText) on the same tunnel. We strip the /waha
    # prefix so the WAHA process sees the original path.
    location /waha/ {
      proxy_pass http://waha_upstream/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }

    # ─── Frontend SPA (catch-all) ──────────────────────────────────
    # Everything else — /, /chat, /upload, /videos, /configuracoes,
    # /assets/*.js, etc. — goes to the frontend nginx which serves
    # the Vite build with its own try_files-based SPA fallback.
    location / {
      proxy_pass http://frontend_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
    }
  }
}
