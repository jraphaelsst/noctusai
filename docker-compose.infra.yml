# NoctusAI — shared INFRA (compose project: noctusai-infra).
#
# Project: containerization-single-container. The second of two root
# projects (sibling: docker-compose.yml → noctusai-products). Profile-
# gated shared services products opt into. Separate project ⇒ its own
# collapsible Docker Desktop group, toggled independently of the product
# fleet.
#
# Usage:
#   docker compose -f docker-compose.infra.yml --profile redis up
#   docker compose -f docker-compose.infra.yml --profile full up
#   ./start.sh redis | waha | local-db | full      # (Phase 5 wires these)
#
# `noctus-net` is external + created once by start.sh — every product on
# noctusai-products joins the SAME named network, so backends reach Redis
# here across the project boundary. Standalone:
#   docker network create noctus-net   # one-time

name: noctusai-infra

services:
  redis:
    image: redis:7-alpine
    container_name: noctus-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - noctus-net
    restart: unless-stopped
    profiles:
      - redis
      - full

  waha:
    # WhatsApp HTTP API — for chatbot-using products. Consumed via the
    # noctusai_lib.integrations.whatsapp factory; FakeWahaClient fallback
    # when WAHA_BASE_URL is empty (non-chatbot products unaffected).
    image: devlikeapro/waha:latest
    platform: linux/amd64
    container_name: noctus-waha
    environment:
      WAHA_API_KEY: ${WAHA_API_KEY:-}
      WAHA_DASHBOARD_USERNAME: ${WAHA_DASHBOARD_USERNAME:-admin}
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD:-admin}
      WHATSAPP_DEFAULT_ENGINE: WEBJS
    ports:
      - "3000:3000"
    volumes:
      - waha_sessions:/app/.sessions
    networks:
      - noctus-net
    restart: unless-stopped
    profiles:
      - waha
      - full

  postgres:
    # Local Postgres for offline dev / isolated CI. Profile-gated so the
    # default fleet talks to remote Supabase unless a product's .env
    # overrides SUPABASE_URL to point here. Schema init runs once when the
    # postgres_data volume is empty (scripts/init-local-db/, alpha order).
    image: postgres:16-alpine
    container_name: noctus-postgres
    environment:
      POSTGRES_USER: noctus
      POSTGRES_PASSWORD: noctus_local
      POSTGRES_DB: noctus
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-local-db:/docker-entrypoint-initdb.d:ro
    networks:
      - noctus-net
    profiles:
      - postgres
      - full
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noctus -d noctus"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  noctus-net:
    name: noctus-net
    external: true

volumes:
  redis_data:
  waha_sessions:
  postgres_data:
