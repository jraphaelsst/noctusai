# NoctusAI — shared INFRA (compose project: dev-noctusai-infra).
#
# Project: containerization-single-container. The second of two root
# projects (sibling: docker-compose.yml → dev-noctusai-products). Profile-
# gated shared services products opt into. Separate project ⇒ its own
# collapsible Docker Desktop group, toggled independently of the product
# fleet. The `dev-` prefix marks these as the LOCAL/dev instances — prod
# runs its own (deploy/services/compose.services.yml on the VPS), so a
# local `docker ps` is never confused with the production fleet.
#
# Usage:
#   docker compose -f docker-compose.infra.yml --profile redis up
#   docker compose -f docker-compose.infra.yml --profile full up
#   ./start.sh redis | waha | full
#
# NO local Postgres: both dev and prod talk to remote Supabase (root .env
# SUPABASE_URL), and the dev test loop isolates via the seed Fake — so a
# local postgres container only burned resources. It was removed
# 2026-05-25 (an unused leftover; scripts/init-local-db/ SQL is retained
# for now but has no live consumer).
#
# `noctus-net` is external + created once by start.sh — every product on
# dev-noctusai-products joins the SAME named network, so backends reach
# Redis here across the project boundary. Standalone:
#   docker network create noctus-net   # one-time

name: dev-noctusai-infra

services:
  redis:
    image: redis:7-alpine
    container_name: dev-noctus-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      noctus-net:
        # Keep `noctus-redis` resolvable after the dev- rename: products
        # read REDIS_URL=redis://noctus-redis:6379/0 (container-name DNS).
        # The alias preserves that link; prod redis is unchanged.
        aliases:
          - noctus-redis
    restart: unless-stopped
    profiles:
      - redis
      - full

  waha:
    # WhatsApp HTTP API — for chatbot-using products. Consumed via the
    # noctusai_lib.integrations.whatsapp factory; FakeWahaClient fallback
    # when WAHA_BASE_URL is empty (non-chatbot products unaffected).
    # Arch-aware: WAHA's free image is amd64-only under :latest, but it
    # publishes a native arm64 build as :arm. start.sh exports WAHA_IMAGE
    # /WAHA_PLATFORM = the :arm/linux/arm64 pair on Apple Silicon hosts so
    # it runs NATIVE (no qemu emulation — kills the Docker-Desktop "AMD64 /
    # may have poor performance" warning). Defaults stay amd64 so CI /
    # Linux x86 servers are unaffected. Override-able via env if needed.
    image: ${WAHA_IMAGE:-devlikeapro/waha:latest}
    platform: ${WAHA_PLATFORM:-linux/amd64}
    container_name: dev-noctus-waha
    environment:
      WAHA_API_KEY: ${WAHA_API_KEY:-}
      WAHA_DASHBOARD_USERNAME: ${WAHA_DASHBOARD_USERNAME:-admin}
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD:-admin}
      # Swagger basic-auth mirrors the dashboard creds (same env vars) so the
      # two stay in sync — one login for both dashboard and /docs (Swagger UI).
      WHATSAPP_SWAGGER_USERNAME: ${WAHA_DASHBOARD_USERNAME:-admin}
      WHATSAPP_SWAGGER_PASSWORD: ${WAHA_DASHBOARD_PASSWORD:-admin}
      WHATSAPP_DEFAULT_ENGINE: WEBJS
    ports:
      - "3000:3000"
    volumes:
      - waha_sessions:/app/.sessions
    networks:
      noctus-net:
        # Keep `noctus-waha` / `waha` resolvable after the dev- rename so
        # any product pointing WAHA_BASE_URL at the container/service name
        # still connects (prod waha is unchanged).
        aliases:
          - noctus-waha
          - waha
    restart: unless-stopped
    profiles:
      - waha
      - full

networks:
  noctus-net:
    name: noctus-net
    external: true

volumes:
  redis_data:
  waha_sessions:
