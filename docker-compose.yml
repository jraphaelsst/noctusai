version: "3.8"

services:
  core-backend:
    build:
      context: .
      dockerfile: core/backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped

  erp-backend:
    build:
      context: .
      dockerfile: products/erp-imobiliario/backend/Dockerfile
    ports:
      - "8001:8001"
    env_file:
      - .env
    restart: unless-stopped

  core-frontend:
    build:
      context: .
      dockerfile: core/frontend/Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - core-backend
    restart: unless-stopped

  erp-frontend:
    build:
      context: .
      dockerfile: products/erp-imobiliario/frontend/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - erp-backend
    restart: unless-stopped
