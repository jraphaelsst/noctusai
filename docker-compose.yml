# NoctusAI — PRODUCTS orchestrator (compose project: noctusai-products).
#
# Project: containerization-single-container. This is one of TWO root
# projects (the other: docker-compose.infra.yml → noctusai-infra). The
# split is what gives the Docker Desktop UX: `noctusai-products` is one
# collapsible group with a project-level on/off, and — because every
# product is now a SINGLE container — each product is one row toggled in
# one click. Infra (Redis/WAHA/Postgres) lives in its own group.
#
# `name:` pins the compose project so Docker Desktop groups deterministically.
#
# Usage:
#   ./start.sh                       # whole fleet (this project + infra)
#   ./start.sh <slug> [<slug>...]    # product subset (Phase 5)
#   docker compose up                # all products (no infra)
#   docker compose --profile tunnel-all up   # + every product's tunnel
#   docker compose --profile tunnel-core up  # + just core's tunnel
#
# Per-product dev-mode (Vite HMR + uvicorn --reload) is the seed-inherited
# docker-compose.override.yml, activated per product in Phase 5
# (`./start.sh dev <slug>`) — deliberately NOT auto-merged here so the
# default `up` stays the production-shaped single container.
#
# `noctus-net` is external (created once by start.sh; the two-project
# split means no single project owns it). Standalone/CI without start.sh:
#   docker network create noctus-net   # one-time

name: noctusai-products

include:
  # BEGIN_PRODUCTS_INCLUDE
  # One entry per product compose (single-container). Overrides are NOT
  # path-listed here — the dev-mode override is opt-in per Phase 5.
  - products/core/docker-compose.yml
  - products/erp-imobiliario/docker-compose.yml
  - products/personal-finance/docker-compose.yml
  - products/therapy-platform/docker-compose.yml
  - products/seed/docker-compose.yml
  - products/daily-life/docker-compose.yml
  - products/adconnect/docker-compose.yml
  - products/dev-team/docker-compose.yml
  - path:
      - products/social-wiring/docker-compose.yml
      - products/social-wiring/docker-compose.override.yml
  # END_PRODUCTS_INCLUDE

networks:
  noctus-net:
    name: noctus-net
    external: true
