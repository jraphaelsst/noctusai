# Root dev override compose — auto-merged by `docker compose up` (no -f
# flags) when invoked at the repo root. Mirrors the production-shape
# carried by `docker-compose.yml`; this file flips runtime behavior
# toward dev.
#
# Production deployment NEVER applies this file — it runs
# `docker compose -f docker-compose.yml -f docker-compose.prod.yml up`
# (the prod overlay is T8's scope). See
# KB § PATTERNS/containerization.md §11d "Dev override compose".
#
# What this file does:
#
#   1. Auto-enables the `redis` profile in dev. Many products talk to
#      Redis (chatbot buffer / WhatsApp router / scheduling queues);
#      having it available without typing `--profile redis` every time
#      is a usability win in dev. Profile stays opt-in for production
#      (the production overlay does NOT carry this override). `waha`
#      stays profile-gated even in dev — it's heavy and only needed by
#      chatbot-using products.
#
#   2. Turns on Redis verbose logging (loglevel verbose) so dev sessions
#      see command-level Redis activity. Default `notice` is too quiet
#      for debugging buffer / queue behavior.
#
#   3. Drops `restart: unless-stopped` on shared services (redis / waha
#      / postgres). In dev you want crashes visible, not auto-recovered.
#
# Per-product overrides are auto-merged via the extended `include: path:`
# syntax in the root `docker-compose.yml` (each product's compose +
# override loaded as a single 2-file list). This file ONLY covers the
# shared platform services; per-product dev behavior (bind-mounts +
# uvicorn --reload) lives in each `products/<slug>/docker-compose.override.yml`.

services:
  redis:
    profiles: !reset []
    command:
      - redis-server
      - --loglevel
      - verbose
    restart: "no"

  waha:
    restart: "no"

  postgres:
    restart: "no"
