# erp-imobiliario per-product compose fragment.
#
# Generated from the canonical pattern at products/seed/docker-compose.yml.
# Use standalone (this product only) or orchestrated by repo-root compose
# (all products together — root file uses `include:` to pull this in).
#
# Build context is `../..` so seed/ + product code are both reachable.

services:
  erp-imobiliario-backend:
    build:
      context: ../..
      dockerfile: products/erp-imobiliario/backend/Dockerfile
    container_name: noctus-erp-imobiliario-backend
    image: noctus-erp-imobiliario-backend:dev
    env_file:
      - ../../.env
    ports:
      - "8001:8001"
    networks:
      - noctus-net
      - erp-imobiliario-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  erp-imobiliario-frontend:
    build:
      context: ../..
      dockerfile: products/erp-imobiliario/frontend/Dockerfile
    container_name: noctus-erp-imobiliario-frontend
    image: noctus-erp-imobiliario-frontend:dev
    ports:
      - "8080:8080"
    depends_on:
      erp-imobiliario-backend:
        condition: service_healthy
    networks:
      - erp-imobiliario-net
    restart: unless-stopped


  erp-imobiliario-tunnel:
    # Cloudflare quick-tunnel — ephemeral *.trycloudflare.com URL pointing
    # at this product's backend. Profile-gated so it's opt-in (cost: one
    # extra container; benefit: webhook/OAuth callback testing without a
    # full deploy). Pattern from noctusai-youtube-crawler.
    image: cloudflare/cloudflared:latest
    container_name: noctus-erp-imobiliario-tunnel
    # `--protocol http2` forces TCP from the start — see core/docker-compose.yml
    # tunnel block for the full rationale (UDP/QUIC fails behind NATs after
    # ~5min and cannot re-register the quick-tunnel hostname).
    command: tunnel --no-autoupdate --protocol http2 --url http://erp-imobiliario-backend:8001
    depends_on:
      erp-imobiliario-backend:
        condition: service_healthy
    networks:
      - erp-imobiliario-net
    restart: unless-stopped
    profiles:
      - tunnel-erp-imobiliario
      - tunnel-all

networks:
  noctus-net:
    name: noctus-net
    driver: bridge
  erp-imobiliario-net:
    driver: bridge
