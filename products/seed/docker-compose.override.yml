# Dev-mode override — seed-inherited (project: containerization-single-
# container, Phase 4). Generated from this canonical by
# scripts/propagate-overrides.sh (slug + port substitution).
#
# WHY an override: the prod image is ONE container serving the built SPA
# via uvicorn (production-shaped — no hot reload). Dev mode restores
# instant feedback by (a) overlaying the backend with `uvicorn --reload`
# + source bind-mounts (.py edits reload) and (b) adding a Vite dev
# sidecar that serves the SPA with HMR (.tsx edits hot-swap in <1s).
#
# AUTO-LOAD SEMANTICS (deliberate): `docker-compose.override.yml` is
# auto-merged ONLY by a direct `cd products/seed && docker compose up`
# (the standalone "I'm hacking on this product" path) or by
# `./start.sh dev seed` (Phase 5). The root `noctusai-products` project
# does NOT path-list overrides (Phase 3) → the FLEET stays prod-shaped.
# So: standalone = dev (HMR + reload); fleet = prod single container.
#
# Prereq: `noctus-seed-frontend-base:dev` built (scripts/build-base-
# images.sh) + external net (`docker network create noctus-net`).
# In dev the SPA is cross-port (sidecar :9004), so the vite factory
# keeps the absolute API URL (VITE_SAME_ORIGIN unset here).

services:
  seed:
    # Overlay the prod container → API-only + hot Python reload. Empty
    # SERVE_SPA_DIR disables the Phase-1 SPA mount (fail-soft: empty ⇒
    # API only); the sidecar serves the SPA in dev.
    environment:
      SERVE_SPA_DIR: ""
    volumes:
      - ./backend:/app/products/seed/backend
      - ../../seed:/app/seed
    command:
      - uvicorn
      - app.main:app
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8004"
      - "--app-dir"
      - products/seed/backend
      - "--reload"

  seed-frontend-dev:
    # Vite dev server with HMR. Inherits the shared seed frontend base
    # (seed FE packages pre-installed); bind-mounts product + seed
    # frontend source and installs the product manifest at start.
    image: noctus-seed-frontend-base:dev
    container_name: noctus-seed-frontend-dev
    working_dir: /app/products/seed/frontend
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 9004"
    env_file:
      - ../../.env
    volumes:
      - ./frontend:/app/products/seed/frontend
      - ../../seed/framework/frontend:/app/seed/framework/frontend
      - ../../seed/lib/frontend:/app/seed/lib/frontend
    ports:
      - "9004:9004"
    depends_on:
      - seed
    networks:
      - noctus-net
    restart: unless-stopped
