# personal-finance per-product compose fragment.
#
# Generated from the canonical pattern at products/seed/docker-compose.yml.
# Use standalone (this product only) or orchestrated by repo-root compose
# (all products together — root file uses `include:` to pull this in).
#
# Build context is `../..` so seed/ + product code are both reachable.

services:
  personal-finance-backend:
    build:
      context: ../..
      dockerfile: products/personal-finance/backend/Dockerfile
    container_name: noctus-personal-finance-backend
    image: noctus-personal-finance-backend:dev
    env_file:
      - ../../.env
    ports:
      - "8002:8002"
    networks:
      - noctus-net
      - personal-finance-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8002/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  personal-finance-frontend:
    build:
      context: ../..
      dockerfile: products/personal-finance/frontend/Dockerfile
      # VITE_* build-arg contract — see KB § PATTERNS/containerization.md
      # § VITE_* build-arg contract. Every VITE_* in code must be both ARG
      # (in Dockerfile) and args: (here), sourced from `.env` via ${...}.
      args:
        VITE_CORE_URL: ${VITE_CORE_URL:-}
    container_name: noctus-personal-finance-frontend
    image: noctus-personal-finance-frontend:dev
    ports:
      - "8090:8090"
    depends_on:
      personal-finance-backend:
        condition: service_healthy
    networks:
      - personal-finance-net
    restart: unless-stopped


  personal-finance-tunnel:
    # Cloudflare quick-tunnel — ephemeral *.trycloudflare.com URL pointing
    # at this product's backend. Profile-gated so it's opt-in (cost: one
    # extra container; benefit: webhook/OAuth callback testing without a
    # full deploy). Pattern from noctusai-youtube-crawler.
    image: cloudflare/cloudflared:latest
    container_name: noctus-personal-finance-tunnel
    # `--protocol http2` forces TCP from the start — see core/docker-compose.yml
    # tunnel block for the full rationale (UDP/QUIC fails behind NATs after
    # ~5min and cannot re-register the quick-tunnel hostname).
    command: tunnel --no-autoupdate --protocol http2 --url http://personal-finance-backend:8002
    depends_on:
      personal-finance-backend:
        condition: service_healthy
    networks:
      - personal-finance-net
    restart: unless-stopped
    profiles:
      - tunnel-personal-finance
      - tunnel-all

networks:
  noctus-net:
    name: noctus-net
    driver: bridge
  personal-finance-net:
    driver: bridge
