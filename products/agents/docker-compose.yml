# agents compose — SINGLE CONTAINER (generated from products/seed/docker-compose.yml; edit there + re-propagate).
#
# Project: containerization-single-container. This file at products/agents/
# is the reference; every other product's docker-compose.yml is generated
# from it by scripts/propagate-composes.sh (slug + port substitution +
# per-product VITE args). When the pattern evolves, edit THIS file and
# re-propagate.
#
# One service `<slug>` (was <slug>-backend + <slug>-frontend): uvicorn
# serves the API AND the built SPA on ONE port (the seed factory
# `serve_spa` seam — Phase 1). nginx + the per-product `<slug>-net`
# private network are gone (nothing to isolate — it's one container).
#
# `<slug>-tunnel` is MANDATORY in the standardized pattern (always wired)
# but profile-gated (only RUNS when asked) — "wired in, consumed when
# needed". Cloudflare quick-tunnel for webhook/OAuth/demo testing.
#
# Network: `noctus-net` is now `external: true` — the two-project split
# (noctusai-products / noctusai-infra) means the shared fabric is created
# ONCE outside any single compose project. start.sh ensures it exists
# (`docker network create noctus-net`) before any `up`. Standalone use
# (`cd products/seed && docker compose up`) requires it pre-created:
#   docker network create noctus-net   # one-time
#
# Build context = repo root (seed bases + product code reachable). The
# image inherits the shared seed bases — run scripts/infra/build-base-images.sh
# first (start.sh orders this in Phase 5).

services:
  agents:
    build:
      context: ../..
      dockerfile: products/agents/backend/Dockerfile
      # ONE container, ONE shape (project: containerization-single-env).
      # The local fleet builds the `runtime-watch` target: same single
      # container, plus node + the watch entrypoint (vite build --watch +
      # uvicorn --reload). No `dev` command, no sidecar, no separate
      # project. Deploy/CI build the default `runtime` target (slim,
      # baked dist, plain uvicorn — node absent) — that's the shippable
      # image; this compose is the LOCAL orchestration.
      target: runtime-watch
      args:
        # Boot-critical Supabase vars — baked at build (Vite inlines
        # them; empty ⇒ blank-page throw). Backend URL stays runtime.
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:-}
        VITE_CORE_URL: ${VITE_CORE_URL:-}
    container_name: dev-noctus-agents
    image: ghcr.io/jraphaelsst/noctus-agents:${NOCTUS_IMAGE_TAG:-dev}
    env_file:
      - ../../.env
    # Source bind-mounted → edits reflect with no rebuild: vite
    # build --watch refreshes dist/, uvicorn --reload restarts on .py.
    volumes:
      - ./backend:/app/products/agents/backend
      - ./frontend:/app/products/agents/frontend
      # Anonymous volume — MUST come after the ./frontend bind-mount. The
      # host frontend/ dir has darwin-arm64 node_modules (or none); without
      # this it shadows the image's linux node_modules → the watch
      # entrypoint dies with "vite: not found" or "Cannot find module
      # '@rollup/rollup-linux-*'". Docker seeds an anonymous volume from
      # the image layer on first create, so the container keeps its own
      # platform-correct node_modules while source stays live-editable.
      - /app/products/agents/frontend/node_modules
      - ../../seed:/app/seed
      # Same shadow problem as above, for the SEED framework/lib FE
      # node_modules: the ../../seed bind-mount (node_modules-less in any
      # clean checkout/CI/worktree) would mask the glibc deps the
      # Dockerfile installs for the tailwind/vite factory require. These
      # anon volumes MUST come AFTER ../../seed (nested-after-parent);
      # Docker seeds them from the image layer so the factory require
      # resolves while seed source stays live-editable. (§3.2b)
      - /app/seed/framework/frontend/node_modules
      - /app/seed/lib/frontend/node_modules
    ports:
      - "8016:8016"
    networks:
      - noctus-net
    # Restart policy is a dev↔prod-divergent knob (deploy-config-contract).
    # Default `unless-stopped` is PROD-SAFE (auto-restart on crash/reboot — no
    # prod-config change needed). Dev sets `NOCTUS_RESTART_POLICY=no` via
    # start.sh so a host sleep / Docker relaunch does NOT resurrect stale dev
    # containers (the 2026-05-29 stale-container drift). KB § PATTERNS/devops/deploy-config-contract.md.
    restart: ${NOCTUS_RESTART_POLICY:-unless-stopped}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8016/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # D1 hardening (roadmap julia-agents-academia-2026-09, row D1;
    # tech-lead + security-advisor review 2026-09-14). Prod is first
    # contact for this image (dev fleet dormant — KB § PATTERNS/devops/
    # dev-fleet-dormant.md). `bin/entrypoint.sh` FAILS CLOSED if any of
    # these three are missing — verified empirically, not asserted.
    cap_drop:
      - ALL
    # SETUID/SETGID/KILL — nothing else. contract §E.5 spawns the Julia
    # CLI subprocess under a DIFFERENT, dedicated uid
    # (`user="julia-cli"` on ClaudeAgentOptions); dropping to that uid
    # AT EXEC (`bin/entrypoint.sh`'s own `setpriv`, not a bare `USER`
    # directive — verified empirically that `USER` alone never
    # populates AMBIENT caps for a non-root process, moby#45491) needs
    # CAP_SETUID + CAP_SETGID effective on the process making that
    # switch. CAP_KILL: `noctus` must be able to signal the Julia CLI
    # subprocess (uid 1001, a DIFFERENT uid) on turn-timeout/SDK-close —
    # verified empirically that signalling a different uid without it
    # is denied (EPERM), leaking a hung CLI process for the container's
    # whole lifetime. NOT CAP_SETPCAP: every `setpriv --bounding-set=`
    # clause was removed from every script in this image (wrapper +
    # entrypoint) — verified empirically that it needs CAP_SETPCAP
    # (`setpriv: apply bounding set: Operation not permitted`), and
    # `cap_drop`/`cap_add` already fix the bounding-set ceiling with
    # zero in-container action needed; `no-new-privileges` keeps the
    # leftover bounding bits inert regardless.
    cap_add:
      - SETUID
      - SETGID
      - KILL
    security_opt:
      - no-new-privileges:true
    read_only: true
    # A dedicated tmpfs for the Julia CLI's own HOME/TMPDIR — owned by
    # `julia-cli` (uid/gid 1001) alone, mode 0700: `noctus` cannot read
    # or write into it, and `julia-cli` cannot read or write this
    # product's `/tmp` (below) — verified empirically both ways.
    # size-capped; the CLI's own scratch needs are small.
    #
    # This product's `/tmp` belongs to `noctus` ONLY —
    # uid=0,gid=1000,mode=1770 (owner root rwx, group `noctus` rwx +
    # sticky, other/`julia-cli` NO access at all). agents has no
    # multipart-upload route (unlike academia's `/tmp:mode=1777`, kept
    # as-is there — see `_C_HARDENING_ACADEMIA`'s own comment), so
    # nothing needs `/tmp` to be world-writable here, and locking it to
    # `noctus` closes the one path `julia-cli` could otherwise have
    # used to leave a file `noctus` might later trust.
    tmpfs:
      - /run/julia:uid=1001,gid=1001,mode=0700,size=32m
      - /tmp:mode=1770,uid=0,gid=1000,size=64m
    # A small explicit /dev/shm — python/uvicorn have no real shared-
    # memory need here; explicit + small beats an unexamined default.
    shm_size: 64m
    mem_limit: 1g
    # `init: true` — a minimal PID-1 init (tini) reaps zombies from the
    # Julia CLI subprocess tree so a killed-but-unreaped child (see
    # `bin/entrypoint.sh`'s CAP_KILL comment above) never accumulates;
    # without it `noctus` (not PID 1 here — the entrypoint execs INTO
    # it, so it IS PID 1) would have to reap its own children, which
    # the SDK's client-close path already does on the happy path but
    # should not be the ONLY thing standing between a hung turn and a
    # zombie leak.
    init: true
    # AGENTS_INSTANCE_ID (contract §E.9, roadmap D1) is deliberately
    # left UNSET here, not baked as a fixed literal: `app/runtime/
    # __init__.py::_resolve_instance_id` already prefers an explicit
    # env override and falls back to `HOSTNAME`, which Docker sets to
    # this container's own id. That id is stable across a `docker
    # restart` of THIS container (satisfying "stable across restarts
    # of the same container") and changes only when a genuinely NEW
    # container is created on redeploy — which is correctly a new
    # instance for the startup orphan-sweep (contract §E.2 security
    # finding 5), not a bug. Set AGENTS_INSTANCE_ID explicitly only if
    # a future orchestrator stops giving the container a stable
    # hostname (e.g. Swarm/K8s pod churn).

  agents-tunnel:
    # Cloudflare quick-tunnel → ephemeral *.trycloudflare.com pointing at
    # this product's single container. `--protocol http2` forces TCP from
    # the start (QUIC/UDP dies behind NATs in ~5min and cannot
    # re-register — see KB § PATTERNS/containerization.md § Troubleshooting).
    image: cloudflare/cloudflared:latest
    container_name: dev-noctus-agents-tunnel
    command: tunnel --no-autoupdate --protocol http2 --url http://agents:8016
    depends_on:
      agents:
        condition: service_healthy
    networks:
      - noctus-net
    restart: ${NOCTUS_RESTART_POLICY:-unless-stopped}
    profiles:
      - tunnel-agents
      - tunnel-all

networks:
  noctus-net:
    name: noctus-net
    external: true
