# media-scheduling per-product compose fragment.
#
# Generated from the canonical pattern at products/seed/docker-compose.yml.
# Use standalone (this product only) or orchestrated by repo-root compose
# (all products together — root file uses `include:` to pull this in).
#
# Build context is `../..` so seed/ + product code are both reachable.

services:
  media-scheduling-backend:
    build:
      context: ../..
      dockerfile: products/media-scheduling/backend/Dockerfile
    container_name: noctus-media-scheduling-backend
    image: ghcr.io/jraphaelsst/noctus-media-scheduling-backend:${NOCTUS_IMAGE_TAG:-dev}
    env_file:
      - ../../.env
    ports:
      - "8096:8096"
    networks:
      - noctus-net
      - media-scheduling-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8096/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  media-scheduling-frontend:
    build:
      context: ../..
      dockerfile: products/media-scheduling/frontend/Dockerfile
    container_name: noctus-media-scheduling-frontend
    image: ghcr.io/jraphaelsst/noctus-media-scheduling-frontend:${NOCTUS_IMAGE_TAG:-dev}
    ports:
      - "8140:8140"
    depends_on:
      media-scheduling-backend:
        condition: service_healthy
    networks:
      - media-scheduling-net
    restart: unless-stopped


  media-scheduling-tunnel:
    # Cloudflare quick-tunnel — ephemeral *.trycloudflare.com URL pointing
    # at this product's backend. Profile-gated so it's opt-in (cost: one
    # extra container; benefit: webhook/OAuth callback testing without a
    # full deploy). Pattern from noctusai-youtube-crawler.
    image: cloudflare/cloudflared:latest
    container_name: noctus-media-scheduling-tunnel
    # `--protocol http2` forces TCP from the start — see core/docker-compose.yml
    # tunnel block for the full rationale (UDP/QUIC fails behind NATs after
    # ~5min and cannot re-register the quick-tunnel hostname).
    command: tunnel --no-autoupdate --protocol http2 --url http://media-scheduling-backend:8096
    depends_on:
      media-scheduling-backend:
        condition: service_healthy
    networks:
      - media-scheduling-net
    restart: unless-stopped
    profiles:
      - tunnel-media-scheduling
      - tunnel-all

networks:
  noctus-net:
    name: noctus-net
    driver: bridge
  media-scheduling-net:
    driver: bridge
