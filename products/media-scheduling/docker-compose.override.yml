# Dev override compose — auto-merged by `docker compose up` (no -f).
# See KB § PATTERNS/containerization.md §11d for the full pattern.

services:
  media-scheduling-backend:
    volumes:
      - ./backend:/app/products/media-scheduling/backend
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8096"
      - --reload
      - --app-dir
      - products/media-scheduling/backend
    restart: "no"

  media-scheduling-frontend:
    build:
      # `target: dev` picks the vite-dev-server stage from the multi-stage
      # frontend Dockerfile. See KB § PATTERNS/containerization.md §11d.
      target: dev
    volumes:
      - ./frontend:/app/products/media-scheduling/frontend
    # `--host 0.0.0.0` is non-negotiable — vite's default `localhost`
    # binding inside a container = unreachable from the host. `--port`
    # MUST match the compose `ports:` mapping (8140:8140).
    command:
      - npm
      - run
      - dev
      - --
      - --host
      - 0.0.0.0
      - --port
      - "8140"
    environment:
      NODE_ENV: development
    restart: "no"
