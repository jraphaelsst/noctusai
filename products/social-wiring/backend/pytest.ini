[pytest]
# Default per-test timeout — un-hangs the suite (the live E4-AUDIT
# pytest-timeout CI-hazard: tests/services froze the whole run indefinitely
# on network-touching tests). A hung test now FAILS loudly by name after
# the timeout instead of blocking CI forever — surfaced, not skip-hidden.
#
# `signal` method (2026-10-09; was `thread`): SIGALRM raises INSIDE the hung
# test, so only that test fails and the run continues to its summary. The
# `thread` method instead os._exit()s the WHOLE pytest process with no
# summary — under machine load (avg ~35 that day) one slow test killed the
# full SW run for several sessions. Verified: a sleeping test, a hung
# thread.join() and a hung `await asyncio.sleep` each fail individually and
# the run completes (pytest-asyncio runs tests on the main thread's loop, so
# SIGALRM reaches them).
# 300 s per test: headroom for a legitimately slow test on a loaded machine;
# a genuine hang still fails by name instead of stalling the run.
timeout = 300
timeout_method = signal
markers =
    realdb: tests that require a live Supabase instance
