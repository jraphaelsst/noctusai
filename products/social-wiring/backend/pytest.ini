[pytest]
# Default per-test timeout — un-hangs the suite (the live E4-AUDIT
# pytest-timeout CI-hazard: tests/services froze the whole run indefinitely
# on network-touching tests). A hung test now FAILS loudly by name after
# the timeout instead of blocking CI forever — surfaced, not skip-hidden.
# `thread` method is signal-free (safe under asyncio / non-main threads).
timeout = 60
timeout_method = thread
markers =
    realdb: tests that require a live Supabase instance
