<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Social Wiring</title>
    <meta name="description" content="A minimal NoctusAI product — proves the entire shared stack works" />
    <!-- No-flash theme: seed THEME_INLINE_SCRIPT (marketing/theme.tsx), default key "nx.theme" = LandingThemeProvider's. -->
    <script>(function(){try{var k="nx.theme";var s=localStorage.getItem(k);var t=s;if(!t||t==="system"){t=window.matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";}document.documentElement.setAttribute("data-theme",t);document.documentElement.classList.toggle("dark",t==="dark");}catch(e){}})();</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
