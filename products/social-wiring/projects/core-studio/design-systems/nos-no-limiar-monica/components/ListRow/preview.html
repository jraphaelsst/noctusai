<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Lora:wght@400;500&family=Inter:wght@400;500;600&display=swap">
<style>

  .r{display:flex;align-items:center;gap:14px;background:var(--offWhite);border-radius:var(--radius-card);padding:14px 16px;min-height:72px;max-width:380px;color:var(--ash)}

    <div><i><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="m5 12 5 5 9-10"/></svg></i>Desenhe a planta e marque três lugares</div>
