<!-- @dsCard group="Actions" height=110 subtitle="Chips and icon buttons" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Lora:wght@400;500&family=Inter:wght@400;500;600&display=swap">
<style>
  .b{background:var(--paper);padding:22px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  .chip{font:600 12px/16px var(--font-ui);letter-spacing:.8px;text-transform:uppercase;padding:4px 10px;border-radius:var(--radius-pill)}
  .wine{background:var(--wine);color:var(--offWhite)} .char{background:var(--charcoal);color:var(--offWhite)} .sand{background:var(--sand);color:var(--ink)}
  .ib{width:var(--space-48);height:var(--space-48);border-radius:50%;display:grid;place-items:center;border:0;cursor:pointer}
  .ib.w{background:var(--wine);color:var(--offWhite)} .ib.p{background:var(--offWhite);color:var(--ink)} .ib.n{background:none;color:var(--ink)}
  .ib:focus-visible{outline:3px solid var(--wine);outline-offset:3px}
</style>
<div class="b">
  <button class="ib w" aria-label="Abrir"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
  <button class="ib p" aria-label="Salvar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 3h12v18l-6-4-6 4Z"/></svg></button>
  <button class="ib n" aria-label="Notificações"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg></button>
  <span class="chip wine">Rotina</span><span class="chip char">Bem-estar</span><span class="chip sand">Explorar</span>
</div>
