<!-- @dsCard group="Type" height=420 subtitle="Caps and sentence-case modes, at 1/3 scale" -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&family=Playfair+Display:wght@800;900&display=swap">
<style>
  .row{display:flex;gap:16px;flex-wrap:wrap;padding:16px;background:var(--surface)}
  .card{flex:1 1 300px;min-width:0;padding:32px;background:var(--surface);border:1px solid color-mix(in srgb,var(--headline) 12%,transparent)}
  .card.night{background:var(--midnight)}
  .h{font-family:var(--font-display);color:var(--headline);margin:0;text-wrap:balance}
  .caps{font-size:36px;line-height:.95;font-weight:800;letter-spacing:-.01em;text-transform:uppercase}
  .mixed{font-size:50px;line-height:.86;font-weight:900;letter-spacing:-.045em}
  .num{font-size:66px}
  .k{color:var(--keyword)}
  .d{font-family:var(--font-sans);color:var(--deck);font-weight:500;font-size:16px;line-height:1.18;margin:8px 0 0}
  .d.caps{letter-spacing:.03em;text-transform:uppercase;font-size:15px;line-height:1.2}
  .d b{font-weight:700;color:var(--keyword-small)}
  .rule{width:40px;height:3px;background:var(--accent-line);margin-top:22px}
  .night .h,.night .d{color:var(--paper)}
  .night .d b{color:var(--gold-bright)}
</style>
<div class="row">
  <div class="card night">
    <p class="h caps">O que acontece<br><span class="k">com o dinheiro</span></p>
    <p class="d caps">de alguém que paga<br>aluguel por 10 anos<br>é assustador.</p>
    <div class="rule"></div>
  </div>
  <div class="card">
    <p class="h mixed"><span class="num">3</span> hábitos<br>que <span class="k">destroem</span></p>
    <p class="d">sua performance<br>como corretor.</p>
    <div class="rule"></div>
  </div>
  <div class="card">
    <p class="h mixed">Esperar<br>os juros<br><span class="k">baixarem</span></p>
    <p class="d">pode fazer você pagar<br><b>muito mais caro</b><br>pelo imóvel.</p>
    <div class="rule"></div>
  </div>
</div>
