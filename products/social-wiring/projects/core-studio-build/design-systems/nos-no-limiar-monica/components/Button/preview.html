<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Lora:wght@400;500&family=Inter:wght@400;500;600&display=swap">
<style>
  .b{background:var(--paper);padding:22px;display:grid;gap:14px}
  .row{display:flex;flex-wrap:wrap;gap:14px;align-items:center}

  .link{font:500 15px var(--font-ui);color:var(--ink);text-decoration:underline;text-underline-offset:3px}

  <div class="row"><button class="btn secondary">Ler agora →</button><a class="link" href="#">Já tenho uma conta</a><span class="ta">Ver todos →</span></div>
