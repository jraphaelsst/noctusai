<!-- @dsCard group="Content" height=230 subtitle="Section header and activity cards" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Lora:wght@400;500&family=Inter:wght@400;500;600&display=swap">
<style>
  .b{background:var(--paper);padding:22px;display:grid;gap:14px}
  .sh{display:flex;justify-content:space-between;align-items:baseline;max-width:380px}
  .sh h4{font:500 23px/28px var(--font-display);margin:0;color:var(--ink)}
  .ta{font:500 15px var(--font-ui);color:var(--stone)}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,180px));gap:var(--space-12)}
  .c{background:var(--sand);border-radius:var(--radius-card);padding:12px;display:grid;gap:10px;min-height:128px;align-content:start;position:relative}
  .c h5{font:600 20px/24px var(--font-display);margin:0;max-width:85%;color:var(--ink)}
  .chip{justify-self:start;font:600 12px/16px var(--font-ui);letter-spacing:.8px;text-transform:uppercase;padding:4px 10px;border-radius:var(--radius-pill);color:var(--offWhite)}
  .wine{background:var(--wine)} .char{background:var(--charcoal)}
  .go{position:absolute;right:10px;bottom:10px;width:30px;height:30px;border-radius:50%;background:var(--wine);color:var(--offWhite);display:grid;place-items:center}
</style>
<div class="b">
  <div class="sh"><h4>Para você hoje</h4><span class="ta">Ver todos →</span></div>
  <div class="cards">
    <div class="c"><span class="chip wine">Criar</span><h5>Mapa da casa da infância</h5><span class="go"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></div>
    <div class="c"><span class="chip char">Sair</span><h5>Turista no próprio bairro</h5><span class="go"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></div>
  </div>
</div>
