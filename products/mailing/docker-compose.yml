# mailing per-product compose fragment.
#
# Generated from the canonical pattern at products/seed/docker-compose.yml.
# Use standalone (this product only) or orchestrated by repo-root compose
# (all products together — root file uses `include:` to pull this in).
#
# Build context is `../..` so seed/ + product code are both reachable.

services:
  mailing-backend:
    build:
      context: ../..
      dockerfile: products/mailing/backend/Dockerfile
    container_name: noctus-mailing-backend
    image: ghcr.io/jraphaelsst/noctus-mailing-backend:${NOCTUS_IMAGE_TAG:-dev}
    env_file:
      - ../../.env
    ports:
      - "8006:8006"
    networks:
      - noctus-net
      - mailing-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8006/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  mailing-frontend:
    build:
      context: ../..
      dockerfile: products/mailing/frontend/Dockerfile
    container_name: noctus-mailing-frontend
    image: ghcr.io/jraphaelsst/noctus-mailing-frontend:${NOCTUS_IMAGE_TAG:-dev}
    ports:
      - "8120:8120"
    depends_on:
      mailing-backend:
        condition: service_healthy
    networks:
      - mailing-net
    restart: unless-stopped


  mailing-tunnel:
    # Cloudflare quick-tunnel — ephemeral *.trycloudflare.com URL pointing
    # at this product's backend. Profile-gated so it's opt-in (cost: one
    # extra container; benefit: webhook/OAuth callback testing without a
    # full deploy). Pattern from noctusai-youtube-crawler.
    image: cloudflare/cloudflared:latest
    container_name: noctus-mailing-tunnel
    # `--protocol http2` forces TCP from the start — see core/docker-compose.yml
    # tunnel block for the full rationale (UDP/QUIC fails behind NATs after
    # ~5min and cannot re-register the quick-tunnel hostname).
    command: tunnel --no-autoupdate --protocol http2 --url http://mailing-backend:8006
    depends_on:
      mailing-backend:
        condition: service_healthy
    networks:
      - mailing-net
    restart: unless-stopped
    profiles:
      - tunnel-mailing
      - tunnel-all

networks:
  noctus-net:
    name: noctus-net
    driver: bridge
  mailing-net:
    driver: bridge
