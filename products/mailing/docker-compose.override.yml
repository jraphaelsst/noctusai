# Dev override compose — auto-merged by `docker compose up` (no -f).
# See KB § PATTERNS/containerization.md §11d for the full pattern.

services:
  mailing-backend:
    volumes:
      - ./backend:/app/products/mailing/backend
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8006"
      - --reload
      - --app-dir
      - products/mailing/backend
    restart: "no"

  mailing-frontend:
    volumes:
      - ./frontend:/app/products/mailing/frontend
    environment:
      NODE_ENV: development
    restart: "no"
