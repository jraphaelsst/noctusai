# daily-life per-product compose fragment.
#
# Generated from the canonical pattern at products/seed/docker-compose.yml.
# Use standalone (this product only) or orchestrated by repo-root compose
# (all products together — root file uses `include:` to pull this in).
#
# Build context is `../..` so seed/ + product code are both reachable.

services:
  daily-life-backend:
    build:
      context: ../..
      dockerfile: products/daily-life/backend/Dockerfile
    container_name: noctus-daily-life-backend
    image: noctus-daily-life-backend:dev
    env_file:
      - ../../.env
    ports:
      - "8005:8005"
    networks:
      - noctus-net
      - daily-life-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8005/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  daily-life-frontend:
    build:
      context: ../..
      dockerfile: products/daily-life/frontend/Dockerfile
      # VITE_* build-arg contract — see KB § PATTERNS/containerization.md
      # § VITE_* build-arg contract. Every VITE_* in code must be both ARG
      # (in Dockerfile) and args: (here), sourced from `.env` via ${...}.
      args:
        VITE_CORE_URL: ${VITE_CORE_URL:-}
    container_name: noctus-daily-life-frontend
    image: noctus-daily-life-frontend:dev
    ports:
      - "8110:8110"
    depends_on:
      daily-life-backend:
        condition: service_healthy
    networks:
      - daily-life-net
    restart: unless-stopped


  daily-life-tunnel:
    # Cloudflare quick-tunnel — ephemeral *.trycloudflare.com URL pointing
    # at this product's backend. Profile-gated so it's opt-in (cost: one
    # extra container; benefit: webhook/OAuth callback testing without a
    # full deploy). Pattern from noctusai-youtube-crawler.
    image: cloudflare/cloudflared:latest
    container_name: noctus-daily-life-tunnel
    # `--protocol http2` forces TCP from the start — see core/docker-compose.yml
    # tunnel block for the full rationale (UDP/QUIC fails behind NATs after
    # ~5min and cannot re-register the quick-tunnel hostname).
    command: tunnel --no-autoupdate --protocol http2 --url http://daily-life-backend:8005
    depends_on:
      daily-life-backend:
        condition: service_healthy
    networks:
      - daily-life-net
    restart: unless-stopped
    profiles:
      - tunnel-daily-life
      - tunnel-all

networks:
  noctus-net:
    name: noctus-net
    driver: bridge
  daily-life-net:
    driver: bridge
