# Dev override compose — auto-merged by `docker compose up` (no -f).
# See KB § PATTERNS/containerization.md §11d for the full pattern.

services:
  daily-life-backend:
    volumes:
      - ./backend:/app/products/daily-life/backend
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8005"
      - --reload
      - --app-dir
      - products/daily-life/backend
    restart: "no"

  daily-life-frontend:
    build:
      # `target: dev` picks the vite-dev-server stage from the multi-stage
      # frontend Dockerfile. See KB § PATTERNS/containerization.md §11d.
      target: dev
    volumes:
      - ./frontend:/app/products/daily-life/frontend
    # `--host 0.0.0.0` is non-negotiable — vite's default `localhost`
    # binding inside a container = unreachable from the host. `--port`
    # MUST match the compose `ports:` mapping (8110:8110).
    command:
      - npm
      - run
      - dev
      - --
      - --host
      - 0.0.0.0
      - --port
      - "8110"
    environment:
      NODE_ENV: development
    restart: "no"
