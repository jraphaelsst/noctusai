# Dev override compose — auto-merged by `docker compose up` (no -f).
# See KB § PATTERNS/containerization.md §11d for the full pattern.
#
# dev-team caveat — `--reload` works here, but every code save re-runs
# the agno engine warmup (the readiness_hook re-imports `dev_team`,
# re-probes ANTHROPIC_API_KEY, re-validates the leader allowlist). Cold
# reload typically takes 10-20s on a warm Anthropic API connection.
# If iteration speed becomes painful, drop `--reload` here and use
# `docker compose restart dev-team-backend` after edits (manual reload).

services:
  dev-team-backend:
    volumes:
      - ./backend:/app/products/dev-team/backend
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8009"
      - --reload
      - --app-dir
      - products/dev-team/backend
    restart: "no"

  dev-team-frontend:
    build:
      # `target: dev` picks the vite-dev-server stage from the multi-stage
      # frontend Dockerfile. See KB § PATTERNS/containerization.md §11d.
      # dev-team's frontend port (8123) is off-pattern but its
      # vite.config.ts also pins port: 8123, so `--port 8123` aligns
      # config + CLI flag.
      target: dev
    volumes:
      - ./frontend:/app/products/dev-team/frontend
    # `--host 0.0.0.0` is non-negotiable — vite's default `localhost`
    # binding inside a container = unreachable from the host. `--port`
    # MUST match the compose `ports:` mapping (8123:8123).
    command:
      - npm
      - run
      - dev
      - --
      - --host
      - 0.0.0.0
      - --port
      - "8123"
    environment:
      NODE_ENV: development
    restart: "no"
