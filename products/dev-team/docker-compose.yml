# dev-team per-product compose fragment.
#
# Generated from the canonical pattern at products/seed/docker-compose.yml.
# Use standalone (this product only) or orchestrated by repo-root compose
# (all products together — root file uses `include:` to pull this in).
#
# Build context is `../..` so seed/ + product code are both reachable.

services:
  dev-team-backend:
    build:
      context: ../..
      dockerfile: products/dev-team/backend/Dockerfile
    container_name: noctus-dev-team-backend
    image: ghcr.io/jraphaelsst/noctus-dev-team-backend:${NOCTUS_IMAGE_TAG:-dev}
    env_file:
      - ../../.env
    ports:
      - "8009:8009"
    networks:
      - noctus-net
      - dev-team-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8009/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  dev-team-frontend:
    build:
      context: ../..
      dockerfile: products/dev-team/frontend/Dockerfile
    container_name: noctus-dev-team-frontend
    image: ghcr.io/jraphaelsst/noctus-dev-team-frontend:${NOCTUS_IMAGE_TAG:-dev}
    ports:
      - "8123:8123"
    depends_on:
      dev-team-backend:
        condition: service_healthy
    networks:
      - dev-team-net
    restart: unless-stopped


  dev-team-tunnel:
    # Cloudflare quick-tunnel — ephemeral *.trycloudflare.com URL pointing
    # at this product's backend. Profile-gated so it's opt-in (cost: one
    # extra container; benefit: webhook/OAuth callback testing without a
    # full deploy). Pattern from noctusai-youtube-crawler.
    image: cloudflare/cloudflared:latest
    container_name: noctus-dev-team-tunnel
    # `--protocol http2` forces TCP from the start — see core/docker-compose.yml
    # tunnel block for the full rationale (UDP/QUIC fails behind NATs after
    # ~5min and cannot re-register the quick-tunnel hostname).
    command: tunnel --no-autoupdate --protocol http2 --url http://dev-team-backend:8009
    depends_on:
      dev-team-backend:
        condition: service_healthy
    networks:
      - dev-team-net
    restart: unless-stopped
    profiles:
      - tunnel-dev-team
      - tunnel-all

networks:
  noctus-net:
    name: noctus-net
    driver: bridge
  dev-team-net:
    driver: bridge
