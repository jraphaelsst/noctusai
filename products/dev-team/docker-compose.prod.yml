# dev-team per-product production overlay.
#
# Generated from canonical pattern at products/seed/docker-compose.prod.yml.
# See KB § PATTERNS/containerization.md §11e for the full rationale.
#
# Resource caps bumped vs the canonical defaults: the agno multi-agent
# engine (`dev_team/` package + 11 specialists + 3 sub-teams) is genuinely
# heavier than other backends — model loading, per-turn telemetry, and
# the leader/router fanout all live in-process. 2 CPUs / 1GB memory is
# the conservative starting envelope; revise after first prod run.

services:
  dev-team-backend:
    image: ghcr.io/jraphaelsst/noctus-dev-team-backend:${NOCTUS_IMAGE_TAG}
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M

  dev-team-frontend:
    image: ghcr.io/jraphaelsst/noctus-dev-team-frontend:${NOCTUS_IMAGE_TAG}
    environment:
      NODE_ENV: production
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
