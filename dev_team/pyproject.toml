[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "noctusai-dev-team"
version = "0.1.0"
description = "agno multi-agent dev team for the NoctusAI platform — 11 specialists, 3 sub-teams, hybrid memory, MCP-exposed."
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "agno>=2.6.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "anthropic>=0.40.0",
]

[project.optional-dependencies]
testing = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
dev-team = "dev_team.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
