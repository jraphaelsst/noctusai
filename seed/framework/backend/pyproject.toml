[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "noctusai-seed"
version = "0.1.0"
description = "NoctusAI Seed Framework — structural bones for all products"
requires-python = ">=3.11"
dependencies = [
    "noctusai-lib",
    "fastapi>=0.121.0",
    # `noctusai_seed.app` imports starlette DIRECTLY (Request/Response types and
    # the middleware base), so it is a first-order dependency here, not merely
    # fastapi's transitive. seed/lib already declares starlette explicitly with
    # an EXPLICIT upper bound and a long comment about why floor-only once let
    # the env pull a starlette that broke 14 router tests; this package had the
    # same import and none of that protection. Same bounds, deliberately, so the
    # two seed packages can never resolve to different starlettes in one env.
    "starlette>=0.49.1,<1.7.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.2",
    "supabase>=2.9.1",
    "PyJWT>=2.9.0",
    "httpx>=0.27.0",
    "slowapi>=0.1.9",
    # `noctusai_seed.apply_sqlite_migrations._bcrypt_hash` imports it to seed the
    # local-dev SQLite user row (mirrors `auth.users.encrypted_password` so the
    # row shape is faithful). Declared HERE, at the importer, for the same reason
    # `defusedxml` is declared in seed/lib's pyproject: a product-only pin leaves
    # THIS package's own import unsatisfied in any consumer that does not happen
    # to have it — which was the live state until 2026-09-09. bcrypt was declared
    # NOWHERE (not here, not seed/lib, not the root superset) and the import
    # worked only where something else had dragged it in transitively; the very
    # first CI run of this suite failed 8 tests on `ModuleNotFoundError: No
    # module named 'bcrypt'`. A hard dep, not an optional extra, matching the
    # monolithic-install choice seed/lib documents for the three LLM SDKs:
    # simpler ops, and bcrypt ships wheels so the image cost is negligible.
    "bcrypt>=4.0.0",
]

[tool.setuptools.packages.find]
include = ["noctusai_seed*"]
