[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "noctusai-lib"
version = "0.1.0"
description = "Backend code library for all NoctusAI products"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.2",
    "supabase>=2.9.1,<2.10",  # 2.10+ dropped ClientOptions.storage; matches product exact-pin to ==2.9.1
    "PyJWT>=2.9.0",
    "slowapi>=0.1.9",
    "sentry-sdk>=1.40.0",
    # LLM providers — monolithic install, every product gets all three SDKs
    # even if it only uses one. Simpler ops; slightly bigger image.
    "openai>=1.50.0",
    "anthropic>=0.40.0",
    "google-genai>=1.0.0,<1.3.0",  # 1.3.0+ widened transitive constraints; pip backtracks through 50+ versions during Docker builds (T1/T6-A/core-backend hit this 2026-05-10). Bump intentionally when re-tested.
    # Cache backend — optional at runtime (only used when REDIS_URL is set),
    # but installed monolithically so every product can opt in without
    # touching requirements.txt.
    "redis>=5.0.0",
    # In-memory Redis-compatible client — powers
    # `noctusai_lib.integrations.redis.make_fake_redis_client` and
    # `noctusai_lib.domain.chatbot.make_in_memory_buffer_client`. Required
    # at install time so test/dev consumers don't need to add it
    # individually. See `KB § PATTERNS/seed-fake-real-adapter.md`.
    "fakeredis>=2.20.0",
    # Email digest rendering — Jinja templates platform-wide. Used by
    # noctusai_lib.email.digest.render() (formalized 2026-04-25 once 5
    # adopters surfaced; see KB § 04-SHARED-LIBRARY § email/).
    "jinja2>=3.1.0",
    # Google Calendar real adapters (service-account + OAuth). Used by
    # noctusai_lib.integrations.google_calendar.{service_account_adapter,
    # oauth_adapter}.
    "google-api-python-client>=2.100.0",
    "google-auth>=2.30.0",
    # Symmetric crypto — Fernet-based at-rest token encryption used by
    # noctusai_lib.security.encrypted_tokens (OAuth tokens, similar small
    # secrets) AND HMAC primitives used by noctusai_lib.security.webhook_signatures.
    # Pulled transitively by google-auth/PyJWT historically; promoted to explicit
    # 2026-05-04 (seed-hardening Phase 1 close — Engineer A's bystander finding)
    # so a future transitive drop doesn't quietly break both modules.
    "cryptography>=42.0",
    # PDF intake — noctusai_lib.integrations.media.OpenAIMediaResolver text
    # extraction (PyMuPDF page.get_text(), matching erp-imobiliario's
    # certidoes_service convention) + rasterize-then-vision fallback for
    # scanned docs. pdfminer.six is the secondary text fallback. Both
    # already used by erp-imobiliario; promoted to the seed 2026-05-16
    # (social-wiring-absorption Wave 1.E5) so every chatbot product gets
    # multimodal PDF intake without touching requirements.txt. Lazily
    # imported — the Fake media path stays importable if these are absent.
    "PyMuPDF>=1.24.0",
    "pdfminer.six>=20231228",
]

[tool.setuptools.packages.find]
include = ["noctusai_lib*"]

# Pytest auto-loaded plugin — every test session that has `noctusai-lib`
# installed gets `noctusai_lib.testing.pytest_plugin` registered. The
# plugin probes for `app.main` and imports it (triggering the framework's
# `create_product_app(consent_features=...)`, which loads the consent
# catalog). Non-product test sessions (seed-lib own tests, mcp tests)
# silently no-op when `app.main` doesn't resolve. Eliminates the per-
# product `from app.main import app as _app` line in `tests/conftest.py`.
[project.entry-points.pytest11]
noctusai-product-bootstrap = "noctusai_lib.testing.pytest_plugin"
