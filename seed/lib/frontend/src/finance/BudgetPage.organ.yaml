known_facts:
  - "Budget vs actual per category and month; the actual is the DRE's own accrual number (same collection code on the server), so the screen and the DRE cannot disagree. Admins edit the planned amounts in the grid and save once; the accountant read grant sees it read-only."
  - "Over-budget expenses and under-target income are flagged in words (not only colour); an empty cell is 'no budget', 0 is a real budget of zero."
  - "Part of the finance organ; money is integer cents end to end, formatted only via formatCents; pt-BR copy in finance/messages.ts."
  - "Loading contract: read hooks return showSkeleton = isPending && !data and isRefreshing = isFetching && !!data (lying-loading-state.md); never isLoading, never a bare isFetching gate."
  - "Seed-portable: no product coupling; the host passes its authenticated api client; isAdmin / canExport are UX gates only (the server enforces the admin and accountant-read gates)."

