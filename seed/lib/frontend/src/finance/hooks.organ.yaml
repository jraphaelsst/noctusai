known_facts:
  - "TanStack Query hook factory for the finance API (/api/finance: accounts, categories, cost centers, entries + settle/cancel/reverse/delete, accounts + delete, recurrences, transfers, cashflow/aging/DRE reports, attachments, reconciliation, exports). Accepts a base URL or an authenticated seed ApiClient; unwraps {data}/{data,pagination} envelopes. DRE hooks and types mirror the shipped backend (CONTRACT §10/§11)."
  - "Part of the finance organ (projects/commerce-seed-p4/CONTRACT.md §3 + §10); money is integer cents end to end, formatted only via formatCents (shared with the commerce organ); pt-BR copy in finance/messages.ts."
  - "Loading contract: read hooks return showSkeleton = isPending && !data and isRefreshing = isFetching && !!data (lying-loading-state.md); components never use isLoading and never gate on a bare isFetching."
  - "Seed-portable: no product coupling; the host passes its authenticated api client and isAdmin (UX gate only; the server enforces every write)."

