known_facts:
  - "Create/edit one item in three tabs (Geral, Fiscal, Medidas). Fiscal tab: NCM, CEST, CFOP padrão, origem 0-8, GTIN with GS1 check digit — client-side format checks mirror backend validators.py; the server 422 (error.details.field) is mapped back onto the field and its tab."
  - "Money typed in reais, sent as integer cents; no stock fields (the inventory organ owns stock)."
  - "Part of the items organ (backend noctusai_lib.domain.items; roadmap project-history/roadmaps/erp-seed-2026-10.md E2/E5/E8); money is integer cents end to end, formatted only via commerce formatCents; pt-BR copy in items/messages.ts."
  - "Loading contract: read hooks return showSkeleton = isPending && !data and isRefreshing = isFetching && !!data (lying-loading-state.md); components never use isLoading and never gate on a bare isFetching."
  - "Seed-portable: no product coupling; the host product passes its authenticated api client."

