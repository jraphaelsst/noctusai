organ_version: "1.0"
validation_status: emerging

known_facts:
  - "The lifecycle action for the current status (approve / mark sent / cancel). Authorization is the SERVER's: an org admin or a member of THIS org's approver list (pur_approvers; no global permission), and above the org's approval_threshold_cents only an approver (the limit is re-judged inside the pur_transition RPC under the order lock; a threshold change starts a 10-minute cooldown); the host's canApprove prop only hides a button the user can never use. Refusals render with their stable code's pt-BR copy."
  - "Part of the purchasing organ (project-history/roadmaps/erp-seed-2026-10.md E2 / W3); backend noctusai_lib.domain.purchasing. Order lifecycle draft -> approved -> sent -> partially_received -> received (+ cancelled, only before any receipt). Quantities are numeric(18,3) sent as decimal STRINGS; money is integer cents, formatted only via formatCents; pt-BR copy (purchasing/messages.ts)."
  - "Loading contract: read hooks return showSkeleton = isPending && !data and isRefreshing = isFetching && !!data (lying-loading-state.md); components never use isLoading and never gate on a bare isFetching."
  - "Seed-portable: no product coupling; the host passes its authenticated api client and, for the pickers, the parties / items / inventory hooks (optional props rendered as sub-components, so a host without those organs gets free-text supplier, manual lines, no warehouse)."

