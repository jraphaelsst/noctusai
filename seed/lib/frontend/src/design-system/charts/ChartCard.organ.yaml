known_facts:
  - "Titled/subtitled card frame with the loading / empty / error / success state machine baked in — formalizes the triad that was copy-pasted verbatim across VisaoGeralPanel.tsx (social-wiring), the personal-finance chart cards, and erp-imobiliario's ui/chart.tsx consumers."
  - "Slot-based: `children` renders only in the success state. `loading` -> pulsing skeleton block; `error` (any truthy string) -> dashed border + destructive text; `isEmpty` -> dashed border + muted text with a default pt-BR message, overridable via `emptyMessage`."
  - "0 consumers at ship time BY DESIGN — this is Slice B of the Leads module PROJECT (products/social-wiring/projects/leads-module-PROJECT.md); Slice D (wave 2, dispatched after B merges) is the scheduled first consumer, not an orphan."
  - "`minBodyHeight` keeps card height stable across all four states so a subtab doesn't reflow while data loads."

