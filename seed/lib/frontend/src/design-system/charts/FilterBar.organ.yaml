known_facts:
  - "Composable filter shell: label+control slots (`children`), an active-filter chips row with individual clear buttons, an optional 'Limpar tudo' action, and a collapsed/expanded toggle on narrow (< sm) viewports. Built for the Leads 'Base de Leads' sticky filter bar (leads-module-PROJECT.md §6) and its canonical filter set (§5.1), but has ZERO dependency on that domain."
  - "PRESENTATIONAL ONLY — filter STATE (selected values, the URL-query-string mirror) stays entirely with the consumer (e.g. a `useLeadsFilters()`-style hook). This component owns only its own collapsed/expanded UI-local boolean."
  - "Chips are keyed + individually clearable via `chip.onClear`; 'Limpar tudo' only renders when both `chips.length > 0` AND `onClearAll` is supplied."
  - "0 consumers at ship time — Slice B of the Leads module PROJECT; Slice D (wave 2) is the scheduled first consumer."

errors_encountered: []

