validation_status: shelfware

known_facts:
  - "Thin, typed recharts wrapper. Props: `data`, `xKey`, `series: {key,label,color?}[]`, `height` (default 280), `valueFormatter` (default `formatCompactNumber`), `xTickFormatter`, `className`. Shares axis/grid/tooltip rendering with AreaChart/BarChart via the internal `_cartesian-shared.tsx` (not exported)."
  - "Per-series color resolution goes through `useChartTheme().getSeriesColor(index, series[i].color)` — an explicit `color` wins (e.g. the Leads `lead_sources.cor` hex), otherwise the theme-aware categorical palette (`--chart-1`..`--chart-8`) cycles by index."
  - "0 consumers at ship time — Slice B of the Leads module PROJECT; Slice D (wave 2) is the scheduled first consumer."

