alternatives_considered:
  - "Considered a single generic `CartesianChart` component parameterized by chart kind (line/area/bar) instead of 3 separate exports — rejected: recharts' per-kind props (Area's fillOpacity, Bar's radius/layout) diverge enough that a single component would need a large discriminated-union prop surface, worse for the consumer than 3 small typed wrappers."

