known_facts:
  - "Circular SVG progress indicator. Values >100 are clamped for display but the label renders the real number — this is intentional for 'over-target' gamification scenarios (e.g. 120% of monthly quota)."
  - "Color tiers deliberately match ScorePill: good/warn/bad thresholds share the same green/amber/red semantic. The two components are visual siblings for gamification dashboards."
  - "size prop (pixel diameter, default 72) and strokeWidth prop (default 6) allow sizing from compact table cells to large KPI widgets. Inline-flex with column alignment centers the optional label below the ring."
