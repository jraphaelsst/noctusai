known_facts:
  - "Small inline pill displaying a numeric score with threshold-based color tiering: green (≥80), amber (≥50), red (<50) by default. Thresholds are configurable per-callsite via the thresholds prop."
  - "Null-safe: renders a muted '—' when value is null/undefined/NaN — no consumer needs to guard. This makes it safe for table cells where data may be loading."
  - "3 consumers from @noctusai/lib/design-system in products: erp-imobiliario/MetaEventoIndicator.tsx, erp-imobiliario/MetasAgentWidget.tsx, and AIIndicator.tsx (which re-uses ScorePill for AI output scores). Meets consumer threshold but lacks test."
  - "Consumed by AIIndicator internally — thus indirectly present on any product that uses AIIndicator."

