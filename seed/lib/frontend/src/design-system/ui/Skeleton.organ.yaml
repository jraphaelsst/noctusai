  - "`announce` (default true) toggles between the ONE `role=\"status\"` + `aria-label` block per loading region (screen readers hear exactly one \"Carregando\") and `aria-hidden=\"true\"` decorative repeats — see TableSkeleton for the canonical multi-block consumer."
  - "`prefers-reduced-motion` suppression is JS-detected via `window.matchMedia` (with a try/catch fallback to `false`/motion-OK for environments without it), NOT a pure Tailwind `motion-reduce:` CSS variant — chosen specifically so the suppression is unit-testable (jsdom doesn't evaluate CSS media queries, so a CSS-only approach can't be asserted in vitest)."
  - "PageSkeleton.tsx's internal `Skel` was refactored to consume this Skeleton at its definition site — the formalization is proven by adoption, not just declared."

