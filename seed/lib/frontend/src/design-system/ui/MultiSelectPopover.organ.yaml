  - "`max` is a hard cap: at the cap unchecked options are disabled and `maxMessage` renders as role=alert; options switch to role=checkbox/aria-checked when `max` is set."
  - "Search input appears only when options.length > 6; it resets on popover close."
  - "Composes the seed Popover plus CardHubButton/CardHubInput (SW shadcn-parity) so the swap from the product-local file is visually identical."

