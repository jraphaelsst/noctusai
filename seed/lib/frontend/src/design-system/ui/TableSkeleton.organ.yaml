known_facts:
  - "Direct replacement for the hand-rolled `{isLoading && <div>Carregando...</div>}` shape found in the social-wiring Leads subtabs (Corretores.tsx / Empreendimentos.tsx / Origens.tsx / Importacao.tsx) — the observed bug: a TEXT placeholder that lies (looks fine, tells the user nothing is loading) instead of a skeleton that visibly signals 'not known yet.'"
  - "`{ rows?, columns?, showHeader?, className? }` — renders a header row (optional) + N body rows of pulsing cells shaped like the real table, so there is no layout jump when real data replaces it."
  - "Composes `Skeleton` with `announce=false` on every cell except the very first body cell — exactly ONE `role=\"status\"` announcement for the whole table, not one per cell."
  - "Leads.social-wiring is the first real consumer (Slice: seed-skeleton-organs) — swept into Corretores/Empreendimentos/Origens/Importacao/BaseDeLeads in the same slice."

