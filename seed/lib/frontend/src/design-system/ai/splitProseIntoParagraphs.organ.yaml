known_facts:
  - "Exported from DigestCard.tsx (co-located) and re-exported via design-system/ai/index.ts and design-system/index.ts barrel. Splits a prose string into paragraph arrays by double-newline or single-newline separators, trimming empty strings. Returns [] for null/undefined input."
  - "3 consumers from @noctusai/lib/design-system: DigestCard uses it internally, and at least 2 product-level callers use it to pre-process prose before passing paragraphs to DigestCard (e.g. PF monthly narrative, Daily Life weekly review)."
  - "Pure function — no React dependency, no side effects. Can be used in both component and non-component contexts."
  - "Null-safe: splitProseIntoParagraphs(null) and splitProseIntoParagraphs(undefined) both return [] safely — consumers do not need to guard."

