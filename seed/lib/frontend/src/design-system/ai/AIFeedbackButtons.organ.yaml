known_facts:
  - "Thumbs-up/down feedback widget (X3 cross-cutting — ai-expansion Phase 17, 2026-04-25). Click upserts a row in <schema>.ai_feedback; UNIQUE(user_id, output_ref) makes it idempotent. Second click on the same direction is no-op; opposite direction overwrites."
  - "output_ref convention: 'ai_output:<uuid>' for indicators, 'digest:<service>:<period_token>' for digest narratives. The ref enables analytics correlation with prompt versions via optional prompt_version prop."
  - "Optimistic UI: local optimisticRating state gives instant visual feedback before the mutation resolves. 'obrigado' toast on success (hideThankYou=true suppresses for tight surfaces)."
  - "1 explicit consumer via @noctusai/lib/design-system — but consumed by DigestCard (which has 3 consumers) and AIIndicator (3 consumers) as a sub-component, giving it indirect wide reach."

