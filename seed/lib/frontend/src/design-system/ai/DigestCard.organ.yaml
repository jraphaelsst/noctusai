known_facts:
- 'Uniform container for AI-generated digest narratives across products. 3 consumers:
  PF monthly narrative, Daily Life weekly review, Core admin audit digest.'
- 'Renders 4 states: loading (skeleton), error (inline — does NOT break surrounding
  page), empty, and content (paragraphs + AIFeedbackButtons). Non-destructive error
  handling is explicit by design: digest is informational.'
- Integrates AIFeedbackButtons when outputRef is provided — the standard `digest:<service>:<period_token>`
  ref convention enables analytics correlation with prompt versions. Feedback wiring
  on day-one is preferred.
- 'LGPD note embedded in source: digest narratives may contain personal data summaries
  (PF financial diary, Daily Life personal narrative). Consent guard lives at the
  BACKEND; the frontend renders whatever the backend returned with no additional gating.'
- Located in design-system/ai/ (not design-system/components/) — canonical namespace
  for AI-rendered output surfaces.
