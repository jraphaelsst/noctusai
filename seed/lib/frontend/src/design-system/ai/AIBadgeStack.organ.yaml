known_facts:
  - "Composes multiple AI badges into the single LayoutEnrichment.aiBadge slot. Each child null-renders when empty, so the entire stack collapses to nothing when no badge has content — zero visual noise for products with no active AI features."
  - "The seed layout factory uses AIBadgeStack as the default aiBadge fill (DEFAULT_AI_BADGES). Products spread the defaults to add product-specific badges: aiBadge: <AIBadgeStack badges={[<DailyBriefBadge/>, ...DEFAULT_AI_BADGES]}/>."
  - "Inline-flex with 8px gap matches the layout actions row spacing convention. Pure composition — no data fetching, no state."
  - "1 explicit consumer via @noctusai/lib/design-system in products — emerging; consumed indirectly by all products that use createProductLayout with aiBadge slot."

