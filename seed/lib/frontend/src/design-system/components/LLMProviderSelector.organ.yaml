known_facts:
  - "Provider + model picker for LLM configuration UIs. Two native selects side-by-side. Marks stub providers with '(STUB)' and unconfigured providers with '(sem chave)' — consumers get honest visibility into what is wired vs what is placeholder."
  - "Purely presentational: takes current value + handlers + data lists from useLLMProviders()/useLLMModels() hooks. No internal data fetching — follows the hook-injection pattern for product agnosticism."
  - "hideUnconfigured prop filters providers the org hasn't configured. credentialsHref prop links to Core API Keys page for org admins to configure their LLM keys without leaving the product."
  - "2 consumers in products: therapy-platform/clinic/LLMPreferences.tsx and at least one other — below canonical threshold without a test."

