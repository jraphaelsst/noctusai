known_facts:
  - "8 product consumers; third in the auth trio. Handles the FULL invite acceptance flow: token validation → signup form → submission → success/error."
  - "Does NOT use Supabase client — calls backend directly via fetch to the product's accept endpoint. The backend handles auth user creation from the invite record. This separates concerns: FE handles UX state machine, BE handles auth provisioning."
  - "5-state machine: loading → form → submitting → success → error (type PageState). Token extracted from URL search params (?token=...) unless passed as prop."
  - "The acceptEndpoint + apiBaseUrl props allow products to configure their own invite backend path without forking the component."
  - "Zero external deps beyond React + lucide-react; no sonner, no Supabase, no router — the most portable of the auth trio."
  - "Bug fixed 2026-05-26 (commit 06b5eeb6): team router /accept TypeError + integration test — this organ's backend counterpart had a TypeError that was fixed in-flight."

