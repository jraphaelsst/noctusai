alternatives_considered:
  - "Products previously authored per-product sidebar components; Sidebar was absorbed to eliminate replication. The standaloneItems prop covers nav items outside groups (e.g. Settings)."
  - "Force-closing every Collapsible group while collapsed (so the rail shows only group icons) — rejected, see the group-header decision in known_facts."
  - "Rendering a separate icon-only rail component alongside the full sidebar — rejected: two DOM trees for one nav guarantees they drift, and the labels could not animate between the two states."
  - "Hiding labels with sr-only / hidden — rejected: display toggling pops at the end of the width transition and (for `hidden`) drops the name from the a11y tree."

