name: NotificationBell
path: seed/lib/frontend/src/design-system/components/NotificationBell.tsx
phase: pilot-seed
registered_at: "2026-05-29"
organ_version: "1.0"
validation_status: emerging

known_facts:
  - "Self-contained notification dropdown (no shadcn/ui deps) — intentionally avoids any UI primitive that might not be present in all products. Hook injection pattern: consumers pass a hooks object (useNotificacoes, useContagemNaoLidas, useMarcarComoLida, useMarcarTodasComoLidas) rather than hard-wiring to a specific query client."
  - "3 consumers from @noctusai/lib/design-system in products (erp-imobiliario re-exports it locally, therapy-platform uses via @noctusai/seed/infra, and at least one other direct consumer). Meets consumer threshold but lacks test."
  - "Backed by the Notificacao type from seed/lib/frontend/src/notifications — the data shape is standardized. viewAllPath and onViewAll props enable per-product 'Ver todas' routing without forking."
  - "onNavigate (2026-10-21): a notification carrying an in-app link (link, else metadata.link; same-origin paths only) is clickable -- marks read, closes, calls onNavigate(link). createProductInfra wires it to react-router navigate, so every product's bell opens the record a notice points at (agents lead opt-out -> social-wiring /julia/opt-outs?evento=<id>; the link is relative to the app the bell is in)."
  - "Cross-product (2026-10-21): the core notice feed has no product filter, so every product's bell lists every notice. A notice with metadata.product (well-formed slug) differing from currentProduct (env.PRODUCT_SLUG) shows a product label and, on click, calls onNavigateProduct(product, link) instead of onNavigate. createProductInfra implements it through core's POST /api/sso/token (license + known-product check, URL from resolve_product_url -- the launcher's mechanism; no FE URL map), then withNextPath appends next=<path> to the launch URL (fragment for strict, query for legacy) and SSOCallback lands there after redeem. Path-only links; absolute/protocol-relative links are inert; a rejected launch navigates nowhere but the notice is still marked read."
  - "footer slot allows product-specific content at the bottom of the dropdown without structural override."

errors_encountered: []

drifts_surfaced:
  - "erp-imobiliario has a local NotificationBell.tsx that re-exports the shared one: `import { NotificationBell as SharedNotificationBell } from '@noctusai/lib/design-system'`. This is a backward-compat shim, not a fork — acceptable pattern."

alternatives_considered:
  - "Hard-coding react-query hooks directly was rejected because not all products use TanStack Query. The hook-injection pattern makes this consumable by any product regardless of data-fetching strategy."

