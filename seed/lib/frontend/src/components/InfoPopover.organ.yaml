known_facts:
  - "Import: import { InfoPopover, InfoSecoes } from '@noctusai/lib/components'."
  - "InfoPopover = muted Info icon button (aria-label = label, required) + Radix popover; InfoSecoes = optional title + bullet sections + nota + rodape (e.g. a 'Ver no guia' router link)."
  - "The popover body mounts ONLY while open (Radix unmounts PopoverContent when closed) — a product wrapper may call a data hook inside the body; nothing fetches until opened, and the row carrying the icon stays renderable without a QueryClientProvider."
  - "The trigger stops click propagation (it lives inside clickable rows/labels/cells); hit area padded via after:-inset-2 so a 14px icon is still touch-friendly without reflowing the row."
  - "Consumers at registration: social-wiring DocumentoInfo / CertidaoInfo / DadoObrigatorioInfo (components/guia/GuiaInfo.tsx), placed in ChecklistItemRow, IdentidadeChecklistRow, DocumentoTipoSlot and certidoes/ParteSecao."

