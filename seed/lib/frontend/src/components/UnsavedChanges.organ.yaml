known_facts:
  - "Import: import { useUnsavedChanges, UnsavedChangesNotice } from '@noctusai/lib/components' (also re-exported from '@noctusai/lib')."
  - "useUnsavedChanges(draft, saved, { fields?, guardNavigation? }) -> { dirty, changed }. saved = the persisted value in the draft's own shape (same toDraft); undefined while loading => never dirty."
  - "Field equality: null ≡ undefined ≡ '' (an input cannot show the difference); arrays / plain objects structurally."
  - "While dirty a beforeunload guard asks before reload / tab close. In-app close of a drawer is SideDrawer's `dirty` prop."
  - "A selector whose chip LOOKS applied is not a draft: persist on pick (the F91 condomínio fix) and keep the rest of the card on this hook."
  - "Pilot consumer: social-wiring inline 'Salvar' cards (ImovelCartorioCard, ImovelEnderecoCard, ImovelAvaliacaoSection, ImovelCertidoesCard, TermosNegocioSection, QualificacaoContratoForm, NegociacaoPanel, MatriculaAtoDetalhesEditor, SimecConfigEditor, CerebroEditor, CerebroPerguntas)."

