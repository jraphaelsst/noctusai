name: HelpChatBubble
path: seed/lib/frontend/src/components/help-chat/HelpChatBubble.tsx
phase: pilot-seed
registered_at: '2026-09-28'
validation_status: emerging
known_facts:
- The frontend half of the "help chat" organ — a floating, always-available
  chat bubble that streams an AI specialist's answers scoped to the HOST
  product's own knowledge (`noctusai_lib.domain.help_chat` on the backend).
  A product enables both halves with one router-mount call + a knowledge
  markdown file — no per-product frontend logic required beyond passing
  `title`/`getBaseUrl`/`getAuthToken` (and optionally `starters`).
- 'Auth seam: takes `getBaseUrl`/`getAuthToken` directly (`Pick<CreateApiClientOptions,
  ...>`) rather than a constructed `ApiClient`, because streaming needs a raw
  `fetch` + `ReadableStream` — the same two callbacks a product already wires
  for `createApiClient`, no new auth mechanism.'
- Mobile layout reuses `useSheetLayout` (the same `<640px` breakpoint decision
  the card-hub organ standardizes) rather than a second ad-hoc media query —
  full-screen sheet below `sm`, a ~400x600 anchored panel above it.
- Transcript is mirrored client-side to `sessionStorage` only (capped,
  try/catch). Since 2026-10-07 the BACKEND stores every conversation
  (`public.help_chat_conversas` / `help_chat_mensagens`, platform-team-only
  read) keyed by the `conversa_id` this organ sends — the panel says so in
  its "As conversas são registradas para melhorar o suporte." line.
- Enablement is a `createProductLayout({ helpChat: {...} })` option (seed
  framework `layout.tsx`) that mounts the bubble on every authenticated page,
  OR manual mounting via this direct export for a product not on
  `createProductLayout`.
- 'Conversation storage + rating (2026-10-07): the bubble sends a client-generated
  uuid v4 `conversa_id` (kept in the same sessionStorage record as the transcript
  and last-activity timestamp; new id after "Nova conversa" / rating / dismissal).
  The attendance ends on an SSE `{"encerrado": true}` frame or after
  `inactivityMinutes` (default 15) without a user message, computed from the stored
  timestamp so reloads do not lose it; it then asks a 1-5 rating
  (POST `ratingEndpoint`, default /api/ajuda/avaliacao -> 204) and shows a quiet
  "conversations are recorded" disclosure. The `[[ATENDIMENTO_CONCLUIDO]]` marker
  is stripped client-side too. sessionStorage shape is now an object (legacy bare
  array still loads).
errors_encountered: []
drifts_surfaced:
- 'Found while wiring this organ into `createProductLayout`: the mobile
  sidebar drawer never closed after picking a nav item (`Sidebar`''s
  `onNavigate` prop was never wired in `layout.tsx`) — fixed same commit as
  a drift-fix-on-contact (`AppShell.sidebar` now also accepts a render-prop
  form so `layout.tsx` can pass `closeSidebar` down to `<Sidebar onNavigate=.../>`).'
alternatives_considered:
- 'Considered building the streaming fetch on top of `createApiClient`''s
  `post()` — rejected: `post()` always calls `response.json()`, which cannot
  represent an `SSE`/`ReadableStream` body. The organ therefore does its own
  minimal `fetch` + reader loop, reusing only `extractErrorMessage` and the
  auth-token seam from `@noctusai/lib/api` for the non-streaming (pre-flight
  error) path.'
