known_facts:
- 'Built ON CardHubDialog (rail + subpage registry + activity pane). The tabs are not written here: they
  come from the funnel schema (`tabsFor(card)`: order, `when`, section kind). Section kinds rendered by the
  organ: fields, form (PATCH, only meta.campos_editaveis), list, linked, timeline, custom; geral/schedule/
  reminders/conversation need product services and are injected through `renderers` (a missing renderer says
  so on screen).'
- 'Activity pane = the card-hub timeline + composer when the card links a hub (`hubEntityId`), else the
  stage-move history (`GET P/cards/{id}/movimentos`) with no composer (CardHubDialog `activity.composer` is
  optional since this organ).'
- 'Header: "Etapa" select (move without drag), schema header actions (confirm/inputs via
  useFunnelActionFlow), Perder (coded reason; "Outro" requires text), Reabrir, Arquivar. A refused move shows
  the server message + pendencias in place and the select snaps back.'
- 'Fields: a missing value renders "—", never 0.'

