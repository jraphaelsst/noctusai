known_facts:
  - "Lifted from products/social-wiring (pages/Conexoes.tsx WhatsApp card section + pages/Conexao.tsx + components/ConnectionDetailDialog.tsx, QR panel ~:114-122) as a PURE ADDITION — social-wiring itself is untouched in this pass; it still runs its own richer copy (marca scoping, auto-reply toggle, authorized-numbers + bound-chats editors)."
  - "Composed of three components under this directory: WhatsAppConnectionsPage (list + create + detail composition), CreateConnectionDialog (label + WAHA api_key form), ConnectionDetailDialog (status badge + QR panel + start/restart/logout + the start→restart→logout+start recovery ladder + webhook display/reconfigure). All three are also exported standalone for a product that wants its own list layout."
  - "Data layer is createWhatsAppConnectionsHooks (seed/lib/frontend/src/whatsapp.ts) — a REWORK of the formerly single-session createWhatsAppConnectionHooks (removed, zero consumers) into the multi-connection shape mirroring social-wiring's backend_connections_router.py: list/create/update/delete + per-line status/qr/start/restart/logout/recover/webhook. Same hooks-factory injection idiom as createPipelineHooks/PipelineBoard — the CALLER calls createWhatsAppConnectionsHooks(api) once and passes the resulting hook-function bag down as the `hooks` prop."
  - "WhatsAppConnectionLine deliberately EXCLUDES social-wiring's chatbot-intake extension fields (auto_reply_enabled / authorized_numbers / bound_chats / marca_id) — those are per-product routing config for SW's own chatbot feature, not generic WAHA connection-line management. A product needing them extends the type locally."
  - "WhatsAppConnectionsPage accepts optional `emptyState` and `banner` ReactNode slots so a product can render e.g. 'Integração futura — nenhuma conexão pareada.' instead of the default empty-state copy, or a top banner (availability notice, upsell) above the list."
  - "Loading uses showSkeleton/isRefreshing (never a bare isLoading/isFetching) on both useConnections (the list) and per-row useConnectionStatus (live status polling per line, stops polling once paired) / useConnectionQr (polls until status === WORKING, NOT merely !scannable — a single transient non-scannable reply must not kill the poll permanently, per social-wiring's own 2026-08-03 production incident)."

