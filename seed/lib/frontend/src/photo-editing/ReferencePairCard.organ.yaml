known_facts:
  - "One before/after pair from the global reference pool (contract §5 `/referencias`, platform scope). Renders the pair as two static side-by-side thumbnails (not `BeforeAfterCompare` — the pool is a scan-many-cards grid, not a single-photo focus view), plus room (comodo) tag, edit-type tags, free-text note, and an archive action."
  - "Archive is a soft delete (contract §5: kept for history, excluded from the pair-limit count) implemented as a two-step INLINE confirm (click 'Arquivar' → 'Confirmar'/'Cancelar'), not a modal — deliberately reads as reversible rather than destructive."
  - "Omitting the `onArquivar` prop renders the card read-only (no archive control) — for a non-curator viewer of the pool."
  - "Already-archived pairs (`arquivada_em` set) render at reduced opacity with an 'Arquivada' badge and no archive control."
  - "`formatComodo` / `formatTipoEdicao` (optional, default identity) translate the backend literals (`area_externa`, `staging_virtual`) for display — the declared seam for product copy, so a consumer never forks the card to relabel badges (W6, 2026-09-16)."
  - "`antes_url`/`depois_url` are short-lived SIGNED URLs: the pool bucket (`edicao-fotos-referencias`) is private and the row stores bucket keys, which never reach the wire (W6)."

