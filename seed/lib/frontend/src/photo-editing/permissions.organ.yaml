alternatives_considered:
  - "A single `usePermissions()` hook wrapping `useCapacidades()` + these guards was considered and rejected in favour of keeping this module react-query-free and pure — callers already have `capacidades` from `hooks.ts`; coupling the two files would block reusing these guards outside a component (e.g. a route guard)."

