known_facts:
  - "Pure guard functions (`podeVerVeredito`, `podeCriarLote`, `podeGerirPool`, `podeAprovarRegras`, `podeAtivarGuia`, `economicoDisponivel`, `modeloConfigurado`, ...) over a `Capacidades` object from `GET /capacidades` (contract §2) — the ONLY source of truth for what a caller may do in this feature. No SSO/role derivation anywhere in this file, by construction (no import of `../roles` or `../sso`)."
  - "`podeVerVeredito` is the gate `PhotoReviewGrid` receives as a prop for the AI-verdict block — the actual security boundary is server-side (table separation on `fotos_avaliacoes`, contract §1); this guard exists so no FE consumer has a reason to branch on the field's mere presence."
  - "Every guard defaults CLOSED (`false`/`null`) while `capacidades` is `null`/`undefined` (still loading or the query failed) — never optimistically open."

