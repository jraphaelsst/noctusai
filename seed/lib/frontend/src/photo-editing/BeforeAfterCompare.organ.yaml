known_facts:
  - "Drag-to-reveal before/after image comparison — the 'depois' (edited) image renders full-bleed, the 'antes' (original) image is clipped over it via CSS `clip-path` driven by a slider position (0-100). Control is a native `<input type=\"range\">`, stretched transparently over the card, so drag/touch/keyboard all work without a custom pointer-event implementation."
  - "geradaComIA prop renders the 'Imagem gerada com IA' Badge overlay for virtual-staging output (contract §1: staging edits get a watermark baked into the file PLUS this on-screen badge)."
  - "Pure presentational — takes urlAntes/urlDepois as props, no data fetching, no product coupling. Consumed by PhotoReviewGrid's expanded-thumbnail state; any product page can use it directly."

