known_facts:
  - "ActivitiesPanel: the card-hub TAB listing the tasks / calls / meetings / visits of one (entityKind, entityId), with quick-add, done/undone, reschedule, reassign and cancel."
  - "Part of the activities organ (project-history/roadmaps/crm-cms-erp-vertical-seeds-2026-11.plan.md §2.1 row activities, slice W1-5; frozen contract: crm-cms-erp-vertical-seeds-2026-11.activities-contract.md); backend noctusai_lib.domain.activities. Every lifecycle write is one RPC that also appends an immutable intent-named event; the assignee is a plain user id the host maps to a name (assigneeLabel / assigneeOptions)."
  - "Loading contract: read hooks return showSkeleton = isPending && !data and isRefreshing = isFetching && !!data (lying-loading-state.md); components never use isLoading. Writes go through useCacheWriteMutation: drawn on the click, the server row written on the answer, settled in the background; a refusal is shown in pt-BR and rolls the row back."
  - "Seed-portable: no product coupling and no market nouns; the activity types (visits, key custody, maintenance, field work ...) are market DATA from CrmPreset.activity_types."

