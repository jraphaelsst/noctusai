# NoctusAI Platform — production overlay (root).
#
# Activate explicitly:
#
#   NOCTUS_IMAGE_TAG=<sha> docker compose \
#       -f docker-compose.yml \
#       -f docker-compose.prod.yml \
#       up
#
# Using the `-f -f` pair MUST be explicit because Compose auto-loads
# `docker-compose.override.yml` whenever you say `docker compose up`
# without `-f`. The override is dev-shape (bind-mounts, hot-reload, no
# resource caps); prod must opt-out of that auto-load by naming files
# explicitly. See KB § PATTERNS/containerization.md §11e.
#
# What this overlay tightens vs the dev base:
#   - resource caps (cpus + memory) on shared platform services
#   - `restart: always` (stronger than dev's `unless-stopped`)
#   - json-file log rotation (10MB × 3 files; prevents disk fill)
#
# What this overlay does NOT do:
#   - bring up `postgres`. Prod talks to managed Supabase / RDS / Cloud
#     SQL; the `postgres` service stays profile-gated for offline dev
#     and is intentionally absent here.
#   - rebuild images. Images come from the registry (`docker compose
#     pull` first, then `up`); `build:` directives in base files are
#     unused at deploy time.
#
# NOCTUS_IMAGE_TAG MUST be set when this overlay is in play. Per-product
# overlays use bare `${NOCTUS_IMAGE_TAG}` (no `:-dev` fallback) so
# Compose fails loudly if the tag isn't pinned to a specific SHA.
#
# `include:` uses Compose's path-list shape — the first entry is the
# base, subsequent entries overlay on top. We re-list each product's
# pair (base + prod overlay) so the per-product prod hardening lands
# under `docker compose -f -f config`. Without this re-list, the root
# overlay would only touch the platform-shared services declared in
# this file; per-product caps + image-tag pins would never be applied.

include:
  # BEGIN_PRODUCTS_INCLUDE_PROD
  - path:
      - products/core/docker-compose.yml
      - products/core/docker-compose.prod.yml
  - path:
      - products/erp-imobiliario/docker-compose.yml
      - products/erp-imobiliario/docker-compose.prod.yml
  - path:
      - products/personal-finance/docker-compose.yml
      - products/personal-finance/docker-compose.prod.yml
  - path:
      - products/therapy-platform/docker-compose.yml
      - products/therapy-platform/docker-compose.prod.yml
  - path:
      - products/seed/docker-compose.yml
      - products/seed/docker-compose.prod.yml
  - path:
      - products/daily-life/docker-compose.yml
      - products/daily-life/docker-compose.prod.yml
  - path:
      - products/mailing/docker-compose.yml
      - products/mailing/docker-compose.prod.yml
  - path:
      - products/adconnect/docker-compose.yml
      - products/adconnect/docker-compose.prod.yml
  - path:
      - products/dev-team/docker-compose.yml
      - products/dev-team/docker-compose.prod.yml
  - path:
      - products/media-scheduling/docker-compose.yml
      - products/media-scheduling/docker-compose.prod.yml
  # END_PRODUCTS_INCLUDE_PROD

services:
  # ─── Per-product frontend dev-override resets ───────────────────────
  # The root `docker-compose.yml`'s `include:` block uses path-list
  # syntax to auto-merge each product's `docker-compose.override.yml`
  # (dev shape) on top of its base compose. Compose's `!reset` cannot
  # cross include boundaries — a reset inside `<slug>/docker-compose.prod.yml`
  # (itself loaded via this file's `include:`) does NOT see the override
  # because the override was merged inside the ROOT base's include tree
  # (a separate merge operation).
  #
  # The fix: declare top-level frontend service entries here that clear
  # the dev override's `build.target: dev` + `command: ["npm", "run",
  # "dev", ...]` via `!reset null`. Without these resets, the prod
  # render would carry `command: npm run dev` against an nginx-only
  # image (no node binary) and prod containers would crash on start.
  #
  # See KB § PATTERNS/containerization.md §11d "Dev/prod target split"
  # for the multi-stage Dockerfile design that introduced this need.
  core-frontend:
    build: !reset null
    command: !reset null
  erp-imobiliario-frontend:
    build: !reset null
    command: !reset null
  personal-finance-frontend:
    build: !reset null
    command: !reset null
  therapy-platform-frontend:
    build: !reset null
    command: !reset null
  seed-frontend:
    build: !reset null
    command: !reset null
  daily-life-frontend:
    build: !reset null
    command: !reset null
  mailing-frontend:
    build: !reset null
    command: !reset null
  adconnect-frontend:
    build: !reset null
    command: !reset null
  dev-team-frontend:
    build: !reset null
    command: !reset null
  media-scheduling-frontend:
    build: !reset null
    command: !reset null
  youtube-crawler-frontend:
    build: !reset null
    command: !reset null

  redis:
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  waha:
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
