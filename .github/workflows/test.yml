name: Tests & Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  erp-backend-tests:
    name: ERP Backend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system build deps (cairo/pango/gdk for pycairo/weasyprint/pyHanko)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcairo2-dev libgirepository1.0-dev libpango1.0-dev \
            libgdk-pixbuf-2.0-dev libffi-dev libpq-dev pkg-config

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run tests
        working-directory: products/erp-imobiliario/backend
        run: pytest --tb=short -q

  core-backend-tests:
    name: Core Backend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system build deps (cairo/pango/gdk for pycairo/weasyprint/pyHanko)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcairo2-dev libgirepository1.0-dev libpango1.0-dev \
            libgdk-pixbuf-2.0-dev libffi-dev libpq-dev pkg-config

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run tests
        working-directory: products/core/backend
        run: pytest --tb=short -q

      - name: FRAMEWORK_DEPS parity (moved from compose-validate; needs noctusai_lib from requirements)
        run: python mcp/noctusai/cli.py --check-framework-deps

  pf-backend-tests:
    name: PF Backend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system build deps (cairo/pango/gdk for pycairo/weasyprint/pyHanko)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcairo2-dev libgirepository1.0-dev libpango1.0-dev \
            libgdk-pixbuf-2.0-dev libffi-dev libpq-dev pkg-config

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run tests
        working-directory: products/personal-finance/backend
        run: pytest --tb=short -q

  erp-frontend-build:
    name: ERP Frontend Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: products/erp-imobiliario/frontend/package-lock.json

      - name: Install seed frontend deps (file:-linked; product npm ci skips them)
        run: |
          (cd seed/framework/frontend && npm install --no-audit --no-fund --include=peer)
          (cd seed/lib/frontend && npm install --no-audit --no-fund --include=peer)

      - name: Install dependencies
        working-directory: products/erp-imobiliario/frontend
        run: npm ci

      - name: Lint
        working-directory: products/erp-imobiliario/frontend
        run: npm run lint

      - name: Build
        working-directory: products/erp-imobiliario/frontend
        run: npm run build

  core-frontend-build:
    name: Core Frontend Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: products/core/frontend/package-lock.json

      - name: Install seed frontend deps (file:-linked; product npm ci skips them)
        run: |
          (cd seed/framework/frontend && npm install --no-audit --no-fund --include=peer)
          (cd seed/lib/frontend && npm install --no-audit --no-fund --include=peer)

      - name: Install dependencies
        working-directory: products/core/frontend
        run: npm ci

      - name: Build
        working-directory: products/core/frontend
        run: npm run build

  pf-frontend-build:
    name: PF Frontend Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: products/personal-finance/frontend/package-lock.json

      - name: Install seed frontend deps (file:-linked; product npm ci skips them)
        run: |
          (cd seed/framework/frontend && npm install --no-audit --no-fund --include=peer)
          (cd seed/lib/frontend && npm install --no-audit --no-fund --include=peer)

      - name: Install dependencies
        working-directory: products/personal-finance/frontend
        run: npm ci

      - name: Build
        working-directory: products/personal-finance/frontend
        run: npm run build

  core-e2e-tests:
    name: Core E2E Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: products/core/frontend/package-lock.json

      - name: Install seed frontend deps (file:-linked; product npm ci skips them)
        run: |
          (cd seed/framework/frontend && npm install --no-audit --no-fund --include=peer)
          (cd seed/lib/frontend && npm install --no-audit --no-fund --include=peer)

      - name: Install dependencies
        working-directory: products/core/frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: products/core/frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: products/core/frontend
        run: npx playwright test

      - name: Upload report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: core-playwright-report
          path: products/core/frontend/playwright-report/
          retention-days: 14

  erp-e2e-tests:
    name: ERP E2E Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: products/erp-imobiliario/frontend/package-lock.json

      - name: Install seed frontend deps (file:-linked; product npm ci skips them)
        run: |
          (cd seed/framework/frontend && npm install --no-audit --no-fund --include=peer)
          (cd seed/lib/frontend && npm install --no-audit --no-fund --include=peer)

      - name: Install dependencies
        working-directory: products/erp-imobiliario/frontend
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browsers
        working-directory: products/erp-imobiliario/frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: products/erp-imobiliario/frontend
        run: npx playwright test
        env:
          VITE_SUPABASE_URL: http://localhost:54321
          VITE_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
          VITE_BACKEND_API_URL: http://localhost:8001

      - name: Upload report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: erp-playwright-report
          path: products/erp-imobiliario/frontend/playwright-report/
          retention-days: 14

  docker-compose-validate:
    name: Docker Compose Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Provide .env for compose interpolation (per-product env_file refs ../../.env)
        # The root .env is gitignored (delivered out-of-band in prod); compose
        # `config` still resolves the per-product `env_file: ../../.env`, so CI
        # needs a placeholder. The template carries no secrets.
        run: cp .env.example .env
      - name: Ensure external noctus-net (compose references it as external)
        run: docker network inspect noctus-net >/dev/null 2>&1 || docker network create noctus-net
      - name: Validate noctusai-products (root, resolves all includes)
        run: docker compose -f docker-compose.yml config --quiet
      - name: Validate noctusai-infra
        run: docker compose -f docker-compose.infra.yml config --quiet
      - name: Validate each per-product compose standalone
        run: |
          set -e
          for compose in products/*/docker-compose.yml; do
            echo "→ $compose"
            (cd "$(dirname "$compose")" && docker compose config --quiet)
          done

  docker-images-build:
    # SINGLE container per product (KB § PATTERNS/containerization.md).
    # ONE image per product (no backend/frontend role split) = 11 matrix
    # cells. Each cell: build the shared seed base images (gha-cached,
    # shared scope so the heavy layer is built once across the matrix),
    # then build the product's SLIM `runtime` target (the shippable
    # artifact — NOT `runtime-watch`), Trivy-scan it, and push
    # ghcr.io/jraphaelsst/noctus-<slug> on main only after a clean scan.
    # fail-fast: false so one heavy product can't cancel siblings.
    name: Image — ${{ matrix.product }}
    runs-on: ubuntu-latest
    needs: docker-compose-validate
    permissions:
      contents: read
      packages: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        product:
          - core
          - erp-imobiliario
          - personal-finance
          - therapy-platform
          - daily-life
          - adconnect
          - dev-team
          - social-wiring
          - seed
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build shared seed base images
        # The product Dockerfile does `FROM noctus-seed-{backend,frontend}-base:dev`.
        # Build them into the local daemon (`--load`) with a SHARED gha
        # cache scope so the first matrix cell populates it and the rest
        # are cache hits — the heavy layer (apt + cairo/weasyprint + pip
        # wheels + seed npm) is paid once across the fleet.
        run: |
          docker buildx build --load \
            -f seed/docker/Dockerfile.backend-base \
            -t noctus-seed-backend-base:dev \
            --build-arg GIT_SHA=${{ steps.sha.outputs.short }} \
            --cache-from type=gha,scope=seed-backend-base \
            --cache-to type=gha,mode=max,scope=seed-backend-base .
          docker buildx build --load \
            -f seed/docker/Dockerfile.frontend-base \
            -t noctus-seed-frontend-base:dev \
            --cache-from type=gha,scope=seed-frontend-base \
            --cache-to type=gha,mode=max,scope=seed-frontend-base .

      - name: Build product image — slim `runtime` target (for scan)
        # `--target runtime` = the shippable artifact (baked dist, node
        # absent, plain uvicorn). NOT `runtime-watch` (that's the local
        # bind-mount dev shape). `--load` so Trivy can scan it locally;
        # push happens later, main-only, gated on a clean scan.
        run: |
          docker buildx build --load \
            --target runtime \
            -f products/${{ matrix.product }}/backend/Dockerfile \
            -t ghcr.io/jraphaelsst/noctus-${{ matrix.product }}:${{ steps.sha.outputs.short }} \
            -t ghcr.io/jraphaelsst/noctus-${{ matrix.product }}:latest \
            --build-arg GIT_SHA=${{ steps.sha.outputs.short }} \
            --cache-from type=gha,scope=${{ matrix.product }} \
            --cache-to type=gha,mode=max,scope=${{ matrix.product }} .

      - name: Scan image with Trivy (HIGH,CRITICAL — fail on findings)
        # Pinned action; exit-code 1 so a vulnerable image fails the
        # build BEFORE the push step → never lands in the registry.
        id: scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/jraphaelsst/noctus-${{ matrix.product }}:${{ steps.sha.outputs.short }}
          format: sarif
          output: trivy-${{ matrix.product }}.sarif
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      - name: Upload Trivy SARIF to GH Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.product }}.sarif
          category: trivy-${{ matrix.product }}

      - name: Push to GHCR (main only, scan-clean only)
        # Image already built + scanned in the local daemon; just push
        # the two tags. Reached only if Trivy passed (exit-code 1 above
        # would have failed the job).
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push ghcr.io/jraphaelsst/noctus-${{ matrix.product }}:${{ steps.sha.outputs.short }}
          docker push ghcr.io/jraphaelsst/noctus-${{ matrix.product }}:latest

  trivy-fs-scan:
    # Filesystem-level dependency scan. Complements the per-image scan
    # inside `docker-images-build` by reading lockfiles directly
    # (requirements.txt, package-lock.json, etc.) BEFORE any image
    # builds. Faster signal + lower cost on dep-only changes.
    #
    # Config bit-for-bit matches the T9 spec recorded in
    # `KNOWLEDGE-BASE/CONTEXT/PATTERNS/accept-with-rationale.md §
    # "Entries from trivy-prescan-2026-05-11"`:
    #   - aquasec/trivy:0.49.1 (pinned, not @latest)
    #   - --severity HIGH,CRITICAL
    #   - --ignore-unfixed
    #   - respects `.trivyignore` at repo root (2 accepted CVEs)
    name: Trivy filesystem scan (deps)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan — HIGH/CRITICAL, ignore-unfixed
        # Run via the official action (matches the image-scan job's
        # `aquasecurity/trivy-action@0.24.0` pin so DB / engine stay
        # consistent across scan modes). `scan-type: fs` reads
        # requirements*.txt / package-lock.json / Pipfile.lock etc.
        # exit-code: 1 gates the PR; `trivyignores:` picks up the
        # repo-root `.trivyignore` per the T9 spec.
        id: scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: .trivyignore

      - name: Upload Trivy SARIF to GH Security tab
        # `if: always()` so the report uploads even when the scan
        # fails — same shape as the image-scan job above. Reviewers
        # need to see WHICH CVE failed.
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  bandit-scan:
    # Python static-application-security-testing.
    # Config: `bandit.yml` at repo root.
    # Gate: fails on MEDIUM+ severity AND MEDIUM+ confidence.
    # Targets: every product's backend app + the shared seed lib.
    name: Bandit Python SAST
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install bandit
        # Pinned to 1.9.x — confirmed compatible with Python 3.11+ and
        # the bandit.yml shape at repo root. `[toml]` extra so bandit
        # can read pyproject-style configs alongside its own YAML.
        run: pip install 'bandit[toml]==1.9.4' bandit-sarif-formatter

      - name: Run bandit (SARIF output)
        # `--exit-zero` here so we can run BOTH the SARIF report
        # (always uploaded) and the gate (next step) without short-
        # circuiting on first failure. Same split-pattern as the
        # Trivy job above.
        run: |
          bandit -r products/*/backend/app/ seed/lib/backend/noctusai_lib/ \
            -c bandit.yml \
            --severity-level medium \
            --confidence-level medium \
            -f sarif \
            -o bandit.sarif \
            --exit-zero

      - name: Upload bandit SARIF to GH Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: bandit.sarif
          category: bandit

      - name: Bandit gate — fail on NEW MEDIUM+ findings
        # Real gate: re-run bandit against the committed baseline.
        # `--baseline bandit-baseline.json` grandfathers existing
        # findings (4 known issues — 3× XML parsing, 1× SHA1; tracked
        # in the follow-up bandit-baseline-cleanup project). NEW
        # findings introduced by a PR cause a non-zero exit and
        # fail the job. Same config so the report above and the
        # gate here surface identical NEW findings.
        run: |
          bandit -r products/*/backend/app/ seed/lib/backend/noctusai_lib/ \
            -c bandit.yml \
            --severity-level medium \
            --confidence-level medium \
            --baseline bandit-baseline.json \
            -f screen

  gitleaks-scan:
    # Secrets scanning. Config: `.gitleaks.toml` at repo root.
    # Gate: any leaked secret fails the job.
    # On PRs: scans the PR diff (fast).
    # On push to main: scans the diff against the previous commit.
    # Full-history scan is out-of-scope (would push CI past 10min for
    # zero signal — history is already merged).
    name: Gitleaks secrets scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks-action needs the diff history; fetch-depth: 0
          # pulls the full ref so the diff base is available.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          # Public repo / free tier — no license required. Action
          # auto-detects event shape (push vs pull_request) and
          # scopes the scan accordingly.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Honour the repo-root `.gitleaks.toml` allowlist for
          # known-safe public values (Supabase demo JWT, etc.).
          config-path: .gitleaks.toml
