name: Tests & Build

# `dev` is the integration branch — CI runs on every push to it so its tip is
# already proven green by bless-time (dev→main is then a clean FF of validated
# code). `main` stays gated too. KB § PATTERNS/branching-and-merging.md § 0.
on:
  # Manual re-trigger. Added 2026-08-26, during a GitHub Actions `major_outage`
  # that left a queued run wedged for over an hour with zero jobs — GitHub
  # reported the SAME run as queued, completed AND "already running" — while
  # `release stage='bless'` correctly refuses a tip with no green CI. With only
  # `push`/`pull_request` there was no way to ask for a fresh run once the
  # outage cleared: the only lever was an empty commit, i.e. dirtying history to
  # work around an upstream incident. `build-and-push.yml` and
  # `embedding-cache-gate.yml` already carried this; the two heaviest gates did
  # not.
  workflow_dispatch:
  push:
    # `release/**` (2026-09-22): a ship-consent CUT (noctus.dev.release
    # stage=bless mode=cut) pushes release/<stamp>; bless REQUIRES this
    # workflow GREEN on that exact sha before main may fast-forward to it.
    # KB § PATTERNS/devops/ship-consent-riders.md.
    branches: [main, dev, 'release/**']
    # R2 (2026-09-24, the dev-freeze fix): a push touching ONLY
    # `project-history/**/*.ndjson` (branch-pointer / worktree-salvage /
    # ledger bookkeeping commits — 68 of ~90 dev pushes in one 24h window)
    # never starts a run at all, so it can never cancel-in-progress a REAL
    # code run either. This is the SAME "ledger-only" predicate the `changes`
    # job's own `NON_LEDGER=... grep -vE '^project-history/.*\.ndjson$'`
    # step below applies post-checkout — kept in sync by
    # `tests/test_ci_workflow_scope.py::test_paths_ignore_matches_the_ledger_only_scope_predicate`,
    # which runs both against the same path battery and refuses to drift.
    # `noctus.dev.release stage='bless'` (R1) no longer needs the exact dev
    # tip to be green anyway — it walks back to the newest verified commit —
    # so a ledger-only tail with NO run at all is expected steady state, not
    # a gap: bless's own `_is_docs_only` classifier already treats
    # `project-history/` as the sanctioned no-CI-needed exception.
    paths-ignore:
      - 'project-history/**/*.ndjson'
  pull_request:
    branches: [main, dev]

# Cost trim (2026-05-31): cancel a superseded in-flight run when a newer commit
# lands on the same branch / PR. Without this, a rapid push sequence (e.g. a
# chore-commit train — a single session pushed ~12 times) ran the FULL ~21-job
# suite to completion every time, burning compute on commits the very next push
# already obsoleted. Only the newest commit's green status matters. No coverage
# loss (every job still runs on the latest commit); this is strictly waste removal.
# `build-and-push.yml` + `embedding-cache-gate.yml` already carry this; `test.yml`
# (the heaviest, every-push workflow) was the one missing it.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read  # the scope job looks up the last heavy-green run (verified diff base)
  packages: write
  security-events: write

jobs:
  # Scope detector (2026-09 CI-cost audit): 43% of dev pushes touch ONLY
  # `project-history/*.ndjson` (chore(salvage) / branch-pointer / ledger
  # commits) yet fired all 46 downstream jobs — ~50 runner-minutes/run for
  # zero code changed. This job ALWAYS runs (no `if:`), so the workflow's
  # overall conclusion stays `success` (not `skipped`) even when every
  # downstream job below is gated off by `if:` — GitHub reports a run as
  # `skipped` only when EVERY job in it skips; one always-green job here is
  # enough for `release stage='bless'`'s `_ci_verdict` probe
  # (mcp/noctusai/tools/noctus/dev/release.py) to keep reading `success`.
  # Mirrors the git-diff → changed-scope pattern `build-and-push.yml`
  # (lines ~101–182) already uses for per-product image builds — DRY would
  # extract a shared script under `scripts/ci/` if a THIRD consumer shows up
  # (N=2 → triage, N=3+ → formalize).
  changes:
    name: Detect changed scope
    runs-on: ubuntu-latest
    outputs:
      run_heavy: ${{ steps.classify.outputs.run_heavy }}
      shared_changed: ${{ steps.classify.outputs.shared_changed }}
      changed_products: ${{ steps.classify.outputs.changed_products }}
      active_products: ${{ steps.classify.outputs.active_products }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need the diff base (before..sha / PR base) to scope

      - name: Classify the pushed/PR'd diff
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}  # read-only run lookup for the verified diff base
        run: |
          set -euo pipefail

          # ASLEEP-product gate (2026-09-22). `deploy/fleet/active-scope.txt`
          # is the GENERATED, catalog-derived list of awake slugs (`core` +
          # every `ativo=true` product) — never hand-maintain the awake/asleep
          # sets here (KB § PATTERNS/devops/product-lockfile-and-slug-drift.md
          # "derive, don't sync by hand"). Comma-wrapped like
          # `changed_products` so a downstream `grep -q ",<slug>,"` is an
          # exact-segment match. Computed ONCE, up front, so every branch
          # below (including the always-exit-0 ones) carries it.
          #
          # FAIL TOWARD COVERAGE: a missing scope file must never silently
          # narrow the gates — `active_products=ALL` is a sentinel every
          # downstream "Scope gate" / job-level `if:` treats as "run
          # everything", matching `product_scope.filter_active`'s own
          # fail-open contract (mcp/noctusai/tools/noctus/dev/product_scope.py).
          if [ -f deploy/fleet/active-scope.txt ]; then
            ACTIVE="$(grep -vE '^\s*#' deploy/fleet/active-scope.txt | grep -vE '^\s*$' | sort -u | tr '\n' ',')"
            echo "active_products=,${ACTIVE}" >> "$GITHUB_OUTPUT"
            echo "active scope (deploy/fleet/active-scope.txt): ${ACTIVE:-none}"
          else
            echo "active_products=ALL" >> "$GITHUB_OUTPUT"
            echo "::warning::deploy/fleet/active-scope.txt is missing — every product is being treated as active (fail toward coverage, never silently narrowed)"
          fi

          # Release branches + manual re-triggers ALWAYS run the full suite —
          # bless (push to `main`) and promote-adjacent verification must
          # never be scoped down, no matter what the diff looks like.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || \
             [ "${{ github.ref }}" = "refs/heads/main" ] || \
             [ "${{ github.ref }}" = "refs/heads/prod" ] || \
             [ "${GITHUB_REF#refs/heads/release/}" != "${GITHUB_REF}" ]; then
            echo "run_heavy=true" >> "$GITHUB_OUTPUT"
            echo "shared_changed=true" >> "$GITHUB_OUTPUT"
            echo "changed_products=," >> "$GITHUB_OUTPUT"
            echo "scope: workflow_dispatch or a release-branch ref → full suite, never scoped down"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
            # VERIFIED BASE (2026-09-24). `event.before` alone is unsafe with
            # cancel-in-progress: a ledger-only push right after a code push
            # CANCELS the code run, then diffs only its own ledger commit and
            # skips every heavy job — dev reads green on untested code (hit 4x
            # on 2026-09-23). Diff against the head of the LAST run on this ref
            # whose heavy jobs actually ran green instead, so every commit not
            # yet verified is in scope. Falls back to event.before when no such
            # run exists or it is not an ancestor.
            VERIFIED=""
            for RID in $(gh run list --workflow "${{ github.workflow }}" --branch "${GITHUB_REF_NAME}" \
                           --status success --limit 20 --json databaseId -q '.[].databaseId' 2>/dev/null || true); do
              if gh run view "$RID" --json jobs \
                   -q '[.jobs[] | select(.name | startswith("Product Backend Tests")) | .conclusion] | any(. == "success")' \
                   2>/dev/null | grep -q true; then
                VERIFIED="$(gh run view "$RID" --json headSha -q .headSha 2>/dev/null || true)"
                break
              fi
            done
            if [ -n "$VERIFIED" ] && git cat-file -e "${VERIFIED}^{commit}" 2>/dev/null \
               && git merge-base --is-ancestor "$VERIFIED" "${{ github.sha }}"; then
              echo "diff base: last heavy-green run head ${VERIFIED} (event.before was ${BASE})"
              BASE="$VERIFIED"
            else
              echo "::warning::no heavy-green ancestor run found on ${GITHUB_REF_NAME}; diffing against event.before (${BASE})"
            fi
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "run_heavy=true" >> "$GITHUB_OUTPUT"
            echo "shared_changed=true" >> "$GITHUB_OUTPUT"
            echo "changed_products=," >> "$GITHUB_OUTPUT"
            echo "scope: no usable diff base ($BASE — new branch or unreachable commit) → full suite"
            exit 0
          fi

          CHANGED="$(git diff --name-only "$BASE" "${{ github.sha }}")"
          echo "changed files:"; echo "$CHANGED" | sed 's/^/  /'

          # (a) A diff touching ONLY project-history/*.ndjson needs zero code
          # verification — every heavy job below skips via job-level `if:`.
          NON_LEDGER="$(echo "$CHANGED" | grep -vE '^project-history/.*\.ndjson$' || true)"
          if [ -z "$NON_LEDGER" ]; then
            echo "run_heavy=false" >> "$GITHUB_OUTPUT"
            echo "shared_changed=false" >> "$GITHUB_OUTPUT"
            echo "changed_products=," >> "$GITHUB_OUTPUT"
            echo "scope: project-history/*.ndjson-only diff → every heavy job skipped"
            exit 0
          fi
          echo "run_heavy=true" >> "$GITHUB_OUTPUT"

          # (b) A shared-root change invalidates every product — same family
          # of paths build-and-push.yml treats as "rebuild the active set".
          # `deploy/fleet/active-scope.txt` itself is IN this set: waking a
          # product (editing the file, or the commit that regenerates it) must
          # re-test it immediately, not wait for a diff that happens to touch
          # its own `products/<slug>/` tree.
          if echo "$CHANGED" | grep -qE '^(seed/|requirements.*\.txt$|\.github/|scripts/ci/|package(-lock)?\.json$|deploy/fleet/active-scope\.txt$)'; then
            echo "shared_changed=true" >> "$GITHUB_OUTPUT"
            echo "changed_products=," >> "$GITHUB_OUTPUT"
            echo "scope: shared root changed → every product matrix entry runs"
            exit 0
          fi

          # (c) Product-scoped diff — only the touched products' matrix
          # entries run (product-backend-tests / product-frontend-tests).
          # Comma-wrapped so a downstream `contains(...)` check is an exact
          # segment match, never a substring false-positive (e.g. `core` vs
          # `core-x`).
          SLUGS="$(echo "$CHANGED" | sed -nE 's#^products/([^/]+)/.*#\1#p' | sort -u | tr '\n' ',')"
          echo "shared_changed=false" >> "$GITHUB_OUTPUT"
          echo "changed_products=,${SLUGS}" >> "$GITHUB_OUTPUT"
          echo "scope: product-scoped diff → changed products: ${SLUGS:-none}"

  product-backend-tests:
    # Per-product backend pytest. WAS 3 hand-maintained jobs (erp/core/pf) — the
    # OTHER 6 product backends had NO CI job, so KE's missing dep (python-docx,
    # absent from the root superset) only surfaced at deploy pre-flight, never in
    # CI (the unenforced-gate class — same as the FE-test matrix this session).
    # Matrixed over ALL products with a backend suite (2026-05-31, 9 products;
    # extended 2026-08-13 to igig/orbity/seed — `check_ci_test_matrix_coverage`
    # keeps this list from silently going stale again). Each installs the ROOT
    # requirements.txt (the unified
    # superset — check_root_requirements_superset keeps it complete) + pytest, then
    # runs that product's suite. fail-fast:false. (Per-product-install for full
    # dev↔prod parity is a tracked follow-up; the keeper makes root-install safe.)
    name: Product Backend Tests (pytest)
    needs: changes
    # `matrix` is NOT a valid context in a job-level `if:` (actionlint-verified
    # — only github/inputs/needs/vars are), so the job only gates on
    # `run_heavy` here; the PER-PRODUCT scoping (shared root ⇒ all, else only
    # this matrix entry's own changed product) happens in the "Scope gate"
    # step below, where `matrix.*` IS valid, and every expensive step after it
    # is conditioned on that step's output. Matrix list stays static (every
    # slug still enumerated below) so `check_ci_test_matrix_coverage` /
    # `check_every_test_file_is_gated` keep working unchanged.
    if: needs.changes.outputs.run_heavy == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        product:
          - core
          - erp-imobiliario
          - personal-finance
          - social-wiring
          - therapy-platform
          - knowledge-extractor
          - adconnect
          - daily-life
          - dev-team
          - igig
          - orbity
          - seed
          - p-studio
          - academia-de-reciclagem
          - agents
          - community

    steps:
      - uses: actions/checkout@v7

      - name: Scope gate — does this product need to run?
        id: gate
        run: |
          # ASLEEP products are out of the process entirely, on every event
          # type — checked BEFORE the changed/shared diff logic, which only
          # decides whether an AWAKE product runs on this particular diff.
          # `active_products=ALL` (scope file missing) skips this check, same
          # fail-toward-coverage sentinel the `changes` job emits.
          ACTIVE="${{ needs.changes.outputs.active_products }}"
          if [ "$ACTIVE" != "ALL" ] && ! echo "$ACTIVE" | grep -q ",${{ matrix.product }},"; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::skipping ${{ matrix.product }} — asleep (not in deploy/fleet/active-scope.txt)"
            exit 0
          fi

          if [ "${{ needs.changes.outputs.shared_changed }}" = "true" ] || \
             echo "${{ needs.changes.outputs.changed_products }}" | grep -q ",${{ matrix.product }},"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::skipping ${{ matrix.product }} backend tests — unaffected by this diff"
          fi

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system build deps (cairo/pango/gdk for pycairo/weasyprint/pyHanko + libpq/ffi)
        if: steps.gate.outputs.run == 'true'
        run: |
          # 🔴 A THIRD-PARTY APT SOURCE MUST NOT BE ABLE TO FAIL THIS BUILD.
          # The runner image ships Google's Chrome repo, so `apt-get update`
          # contacts dl.google.com even for a job whose only wants are
          # cairo/pango/libpq/ffi — and `apt-get update` exits 100 when ANY
          # source fails. On 2026-09-09 that index served a corrupt
          # "Hash Sum mismatch" for hours and took the WHOLE matrix down on a
          # diff touching none of it, blocking `release stage='bless'` (which
          # correctly refuses a red tip).
          #
          # Two layers, because the first attempt at this guessed wrong:
          # removing `/etc/apt/sources.list.d/google-chrome.list` did nothing,
          # since the image can declare the repo as a deb822 `.sources` file or
          # inline in `sources.list`. So find it by CONTENT rather than by a
          # path we assumed.
          sudo grep -rlE 'dl\.google\.com' /etc/apt/sources.list.d/ 2>/dev/null \
            | sudo xargs -r rm -f
          sudo sed -i '/dl\.google\.com/d' /etc/apt/sources.list 2>/dev/null || true
          # And then refuse to let a stale index be fatal at all. This is NOT a
          # swallowed error: `apt-get install` below is the real gate and stays
          # fatal — a package that genuinely cannot be resolved fails there,
          # loudly and by name. What `|| true` drops is only the "some index
          # failed to download" verdict, which says nothing about whether the
          # packages we actually need are installable.
          sudo apt-get update || true
          sudo apt-get install -y --no-install-recommends \
            libcairo2-dev libgirepository1.0-dev libpango1.0-dev \
            libgdk-pixbuf-2.0-dev libffi-dev libpq-dev pkg-config

      - name: Install dependencies (root superset)
        if: steps.gate.outputs.run == 'true'
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run tests
        if: steps.gate.outputs.run == 'true'
        working-directory: products/${{ matrix.product }}/backend
        run: pytest --tb=short -q

      - name: FRAMEWORK_DEPS parity (core — needs noctusai_lib from requirements)
        if: steps.gate.outputs.run == 'true' && matrix.product == 'core'
        run: python mcp/noctusai/cli.py --check-framework-deps

  seed-backend-tests:
    # The SHARED-LIBRARY half of the backend suite — `noctusai_lib`
    # (seed/lib/backend, 3637 tests) and `noctusai_seed`
    # (seed/framework/backend, 203 tests).
    #
    # 🔴 WHY THIS JOB EXISTS (2026-09-09). It did not, and nothing noticed.
    # Every product backend imports these two packages; a regression here
    # breaks the whole fleet at once. Yet `working-directory` across this
    # whole workflow reached `seed/lib/frontend` and `seed/framework/frontend`
    # and never their backend siblings — the seed's FRONTEND halves were
    # gated, its BACKEND halves were not. Nobody chose that: the FE jobs were
    # added by hand and the BE ones simply never were.
    #
    # `check_ci_test_matrix_coverage` — the keeper built precisely to stop a
    # test suite from silently never running — could not see it either: its
    # domain is `_on_disk_products()`, i.e. `products/*`, and `seed/lib` is
    # not a product. A gate whose DOMAIN excludes the gap is indistinguishable
    # from no gate at all, which is why `check_seed_test_root_ci_coverage`
    # ships in the same commit as this job: it derives the seed's test roots
    # from disk and asserts each one is actually run here.
    #
    # Sized before landing rather than after: both suites run green from a
    # scrubbed `env -i` (no `.env`, no SUPABASE_*) in ~12s total, so this goes
    # in BLOCKING on day one — a `continue-on-error` warm-up period would only
    # have re-answered a question a local run already answered.
    name: Seed Backend Tests (pytest)
    needs: changes
    if: needs.changes.outputs.run_heavy == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        root:
          - seed/lib/backend
          - seed/framework/backend

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system build deps (cairo/pango/gdk for pycairo/weasyprint/pyHanko + libpq/ffi)
        run: |
          # Same third-party-apt-source guard as `product-backend-tests` above —
          # see that job for the full rationale (dl.google.com served a corrupt
          # index on 2026-09-09 and took the whole matrix down).
          sudo grep -rlE 'dl\.google\.com' /etc/apt/sources.list.d/ 2>/dev/null \
            | sudo xargs -r rm -f
          sudo sed -i '/dl\.google\.com/d' /etc/apt/sources.list 2>/dev/null || true
          sudo apt-get update || true
          sudo apt-get install -y --no-install-recommends \
            libcairo2-dev libgirepository1.0-dev libpango1.0-dev \
            libgdk-pixbuf-2.0-dev libffi-dev libpq-dev pkg-config

      - name: Install dependencies (root superset)
        # The root requirements.txt already carries `-e seed/lib/backend` and
        # `-e seed/framework/backend`, so both packages install editable and
        # import under their real names — the same resolution every product
        # backend job gets.
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run tests
        working-directory: ${{ matrix.root }}
        run: pytest --tb=short -q

  erp-frontend-build:
    name: ERP Frontend Build
    needs: changes
    # erp-imobiliario is ASLEEP (deploy/fleet/active-scope.txt) — this job is
    # not matrixed, so there is no per-entry "Scope gate" step to hang the
    # check off (that pattern needs a `matrix.product`, and `matrix` is not a
    # valid job-level `if:` context — see product-backend-tests above); gate
    # here at job level instead, directly on `needs.changes.outputs.active_products`.
    # `== 'ALL'` is the fail-toward-coverage sentinel for a missing scope file.
    if: needs.changes.outputs.run_heavy == 'true' && (needs.changes.outputs.active_products == 'ALL' || contains(needs.changes.outputs.active_products, ',erp-imobiliario,'))
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: products/erp-imobiliario/frontend/package-lock.json

      - uses: ./.github/actions/install-seed-frontend

      - name: Install dependencies
        working-directory: products/erp-imobiliario/frontend
        run: npm ci

      - name: Lint
        working-directory: products/erp-imobiliario/frontend
        run: npm run lint

      - name: Build
        working-directory: products/erp-imobiliario/frontend
        run: npm run build

  core-frontend-build:
    name: Core Frontend Build
    needs: changes
    if: needs.changes.outputs.run_heavy == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: products/core/frontend/package-lock.json

      - uses: ./.github/actions/install-seed-frontend

      - name: Install dependencies
        working-directory: products/core/frontend
        run: npm ci

      - name: Build
        working-directory: products/core/frontend
        run: npm run build

  product-frontend-tests:
    # Per-product FE vitest suites — the consistent unenforced-gate closure.
    # Born 2026-05-31 (social-wiring, standalone) to close the FE-test CI gap:
    # no product ran FE vitest in CI — the same unenforced-gate silent-debt class
    # as the toolkit suite. Generalized 2026-05-31 to a matrix over EVERY product
    # with a real FE suite (DRY — the recurrence rule, N=5 ⇒ formalize), each
    # verified green at the time of gating (social-wiring 19, pf 30, erp 16,
    # therapy 9, daily-life 5). 2026-05-31: core / adconnect / dev-team had FE test
    # infra but ZERO test files; each got a minimal `__harness_smoke__.test.tsx`
    # (proves vitest+jsdom+testing-library run) so they join the gate too.
    # 2026-08-13: `orbity` added (real specs under src/hooks/__tests__/, found
    # missing by `check_ci_test_matrix_coverage`). `knowledge-extractor` /
    # `products/seed` remain out — each has a vitest.config.ts but ZERO
    # `*.test.ts(x)` files yet. `vitest run` fails on "no test files found",
    # so a product joins the matrix the same commit it gets its first test.
    # 2026-08-31: `igig` added — the refetch-unmount fleet-audit fix landed
    # its first `*.test.ts(x)` files (hook + page regression suites).
    # 2026-09-16: `community` added — module 1 (Membros/Planos/Inscrições)
    # frontend landed its first hook + page test suites.
    # `fail-fast: false` so one product's red doesn't mask others.
    name: Product Frontend Tests (vitest)
    needs: changes
    # `matrix` is not valid in a job-level `if:` — see product-backend-tests
    # above for the full rationale. Same "Scope gate" step pattern here.
    if: needs.changes.outputs.run_heavy == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        product:
          - social-wiring
          - personal-finance
          - erp-imobiliario
          - therapy-platform
          - daily-life
          - core
          - adconnect
          - dev-team
          - orbity
          - p-studio
          - igig
          - academia-de-reciclagem
          - agents
          - community

    steps:
      - uses: actions/checkout@v7

      - name: Scope gate — does this product need to run?
        id: gate
        run: |
          # ASLEEP products are out of the process entirely, on every event
          # type — checked BEFORE the changed/shared diff logic, which only
          # decides whether an AWAKE product runs on this particular diff.
          # `active_products=ALL` (scope file missing) skips this check, same
          # fail-toward-coverage sentinel the `changes` job emits.
          ACTIVE="${{ needs.changes.outputs.active_products }}"
          if [ "$ACTIVE" != "ALL" ] && ! echo "$ACTIVE" | grep -q ",${{ matrix.product }},"; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::skipping ${{ matrix.product }} — asleep (not in deploy/fleet/active-scope.txt)"
            exit 0
          fi

          if [ "${{ needs.changes.outputs.shared_changed }}" = "true" ] || \
             echo "${{ needs.changes.outputs.changed_products }}" | grep -q ",${{ matrix.product }},"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::skipping ${{ matrix.product }} frontend tests — unaffected by this diff"
          fi

      - name: Set up Node
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: products/${{ matrix.product }}/frontend/package-lock.json

      - uses: ./.github/actions/install-seed-frontend
        if: steps.gate.outputs.run == 'true'

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        working-directory: products/${{ matrix.product }}/frontend
        run: npm ci

      - name: Run FE tests (vitest)
        if: steps.gate.outputs.run == 'true'
        working-directory: products/${{ matrix.product }}/frontend
        run: npm test

      # Type check. vitest transpiles without type-checking and `vite build`
      # does the same, so a type error could reach prod with every job green.
      # All 16 product frontends were at 0 errors when this landed (2026-09-21).
      - name: Type check (tsc --noEmit)
        if: steps.gate.outputs.run == 'true'
        working-directory: products/${{ matrix.product }}/frontend
        run: npx tsc --noEmit -p tsconfig.json

  seed-frontend-tests:
    # The SHARED-LIBRARY half of the FE suite — `@noctusai/lib`
    # (seed/lib/frontend: 32 spec files, 375 tests).
    #
    # 🔴 Found 2026-09-09 while closing the backend half above, and it is the
    # WORSE of the two: `seed-typecheck.yml` already visits this exact
    # directory, so the seed FE looked gated. It runs `npm run check` — `tsc
    # --noEmit` only. The `test` script (`vitest run`) was never invoked by
    # any workflow, so 375 tests over the components EVERY product renders
    # had been silently uncollected. A directory appearing in CI is not the
    # same as its tests running in CI, which is precisely why
    # `check_seed_test_root_ci_coverage` matches on the RUN COMMAND, not on
    # the presence of a `working-directory:`.
    #
    # 🔴 CORRECTION (2026-09-10). This comment used to say
    # `seed/framework/frontend` was "legitimately absent: zero `*.test.ts(x)`
    # files". That was WRONG, and the keeper agreed with it for a day because
    # its predicate only globbed `frontend/src/`. All 8 of that package's spec
    # files live under `frontend/tests/` — 55 tests, never run. Both the
    # predicate and this matrix are fixed. The lesson: a required-set predicate
    # that only looks where it expects reports the absence it assumed, and a
    # keeper agreeing with a comment is not evidence when the comment is what
    # the predicate was modelled on.
    name: Seed Frontend Tests (vitest)
    needs: changes
    if: needs.changes.outputs.run_heavy == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        root:
          - seed/lib/frontend
          - seed/framework/frontend

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ${{ matrix.root }}/package-lock.json

      - name: Install seed deps (both packages — they cross-import)
        # lib's vitest config path-maps `@noctusai/seed/*` at the sibling
        # framework package, so the sibling must be installed for lib's own
        # specs to resolve — the same cross-package coupling `seed-typecheck.yml`
        # documents for tsc, and the same `npm ci` pair it already runs green.
        #
        # `npm ci`, not `npm install`: the lockfile IS the freeze
        # (KB § PATTERNS/devops/product-lockfile-and-slug-drift.md). The
        # `product-frontend-tests` job installs these two with `npm install`
        # because there they are a file:-linked DEPENDENCY of the product being
        # tested; here they are the subject, and a test suite that floats its own
        # dependency graph run-to-run cannot pin a regression.
        run: |
          (cd seed/framework/frontend && npm ci --no-audit --no-fund)
          (cd seed/lib/frontend && npm ci --no-audit --no-fund)

      - name: Run FE tests (vitest)
        working-directory: ${{ matrix.root }}
        run: npm test

  pf-frontend-build:
    name: PF Frontend Build
    needs: changes
    # personal-finance is ASLEEP (deploy/fleet/active-scope.txt) — same
    # job-level gate rationale as erp-frontend-build above.
    if: needs.changes.outputs.run_heavy == 'true' && (needs.changes.outputs.active_products == 'ALL' || contains(needs.changes.outputs.active_products, ',personal-finance,'))
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: products/personal-finance/frontend/package-lock.json

      - uses: ./.github/actions/install-seed-frontend

      - name: Install dependencies
        working-directory: products/personal-finance/frontend
        run: npm ci

      - name: Build
        working-directory: products/personal-finance/frontend
        run: npm run build

  core-e2e-tests:
    name: Core E2E Tests
    needs: changes
    if: needs.changes.outputs.run_heavy == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: products/core/frontend/package-lock.json

      - uses: ./.github/actions/install-seed-frontend

      - name: Install dependencies
        working-directory: products/core/frontend
        run: npm ci

      - name: Resolve installed Playwright version (drives the cache key below)
        id: pw-version
        working-directory: products/core/frontend
        run: echo "version=$(node -e "console.log(require('@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser binaries
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}

      - name: Install Playwright browsers (cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: products/core/frontend
        run: |
          # `--with-deps` shells out to apt-get, which hits the same corrupt
          # Chrome source described above. Playwright downloads its own browser
          # binaries; only the system libs come from apt.
          sudo grep -rlE 'dl\.google\.com' /etc/apt/sources.list.d/ 2>/dev/null \
            | sudo xargs -r rm -f
          npx playwright install --with-deps chromium

      - name: Install Playwright OS deps only (browsers already cached)
        # The runner VM is fresh every job — the ~/.cache/ms-playwright cache
        # above covers the (large) browser binary download, but the apt-level
        # system libs (libnss3 etc.) never persist across jobs and must still
        # be installed even on a cache hit.
        if: steps.pw-cache.outputs.cache-hit == 'true'
        working-directory: products/core/frontend
        run: |
          sudo grep -rlE 'dl\.google\.com' /etc/apt/sources.list.d/ 2>/dev/null \
            | sudo xargs -r rm -f
          npx playwright install-deps chromium

      - name: Run E2E tests
        working-directory: products/core/frontend
        run: npx playwright test

      - name: Upload report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: core-playwright-report
          path: products/core/frontend/playwright-report/
          retention-days: 14

  erp-e2e-tests:
    name: ERP E2E Tests
    needs: changes
    # erp-imobiliario is ASLEEP (deploy/fleet/active-scope.txt) — same
    # job-level gate rationale as erp-frontend-build above.
    if: needs.changes.outputs.run_heavy == 'true' && (needs.changes.outputs.active_products == 'ALL' || contains(needs.changes.outputs.active_products, ',erp-imobiliario,'))
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: products/erp-imobiliario/frontend/package-lock.json

      - uses: ./.github/actions/install-seed-frontend

      - name: Install dependencies
        working-directory: products/erp-imobiliario/frontend
        run: npm ci --legacy-peer-deps

      - name: Resolve installed Playwright version (drives the cache key below)
        id: pw-version
        working-directory: products/erp-imobiliario/frontend
        run: echo "version=$(node -e "console.log(require('@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser binaries
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}

      - name: Install Playwright browsers (cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: products/erp-imobiliario/frontend
        run: |
          # `--with-deps` shells out to apt-get, which hits the same corrupt
          # Chrome source described above. Playwright downloads its own browser
          # binaries; only the system libs come from apt.
          sudo grep -rlE 'dl\.google\.com' /etc/apt/sources.list.d/ 2>/dev/null \
            | sudo xargs -r rm -f
          npx playwright install --with-deps chromium

      - name: Install Playwright OS deps only (browsers already cached)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        working-directory: products/erp-imobiliario/frontend
        run: |
          sudo grep -rlE 'dl\.google\.com' /etc/apt/sources.list.d/ 2>/dev/null \
            | sudo xargs -r rm -f
          npx playwright install-deps chromium

      - name: Run E2E tests
        working-directory: products/erp-imobiliario/frontend
        run: npx playwright test
        env:
          VITE_SUPABASE_URL: http://localhost:54321
          # Non-secret placeholder — E2E mocks the backend (no real Supabase
          # round-trip). A JWT-shaped literal here trips Trivy's secret scanner.
          VITE_SUPABASE_PUBLISHABLE_KEY: test-publishable-key-e2e-only
          VITE_BACKEND_API_URL: http://localhost:8001

      - name: Upload report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: erp-playwright-report
          path: products/erp-imobiliario/frontend/playwright-report/
          retention-days: 14

  docker-compose-validate:
    name: Docker Compose Validate
    needs: changes
    if: needs.changes.outputs.run_heavy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Provide .env for compose interpolation (per-product env_file refs ../../.env)
        # The root .env is gitignored (delivered out-of-band in prod); compose
        # `config` still resolves the per-product `env_file: ../../.env`, so CI
        # needs a placeholder. The template carries no secrets.
        run: cp .env.example .env
      - name: Ensure external noctus-net (compose references it as external)
        run: docker network inspect noctus-net >/dev/null 2>&1 || docker network create noctus-net
      - name: Validate noctusai-products (root, resolves all includes)
        # Deliberately left UNSCOPED — verified 2026-09-22 that a dormant
        # product's `include:` entry does not fail this (root compose config
        # resolved clean with every dormant product still included); this
        # step is cheap and its whole point is proving the INCLUDE GRAPH
        # (docker-compose.yml's `include:` list) still resolves, which is
        # exactly as true for a dormant product's entry as an active one's.
        run: docker compose -f docker-compose.yml config --quiet
      - name: Validate noctusai-infra
        run: docker compose -f docker-compose.infra.yml config --quiet
      - name: Validate each per-product compose standalone
        # ASLEEP products are skipped here (unlike the root/infra steps
        # above): this is the per-slug loop the "product treatment" applies
        # to, and it is the surface `deploy/fleet/active-scope.txt` exists to
        # gate — a dormant product's compose is out of the process, same as
        # its test jobs.
        run: |
          set -e
          ACTIVE="${{ needs.changes.outputs.active_products }}"
          for compose in products/*/docker-compose.yml; do
            slug="$(basename "$(dirname "$compose")")"
            if [ "$ACTIVE" != "ALL" ] && ! echo "$ACTIVE" | grep -q ",${slug},"; then
              echo "::notice::skipping $compose — asleep (not in deploy/fleet/active-scope.txt)"
              continue
            fi
            echo "→ $compose"
            (cd "$(dirname "$compose")" && docker compose config --quiet)
          done

  trivy-fs-scan:
    # Filesystem-level dependency scan — reads lockfiles directly
    # (requirements.txt, package-lock.json, etc.), so it catches dependency
    # CVEs without building anything. This is the ONLY Trivy job in CI: the
    # per-image scan this comment used to point at (`docker-images-build`)
    # no longer exists — verified 2026-08-10, no such job in any workflow.
    #
    # Config follows the T9 spec recorded in
    # `KNOWLEDGE-BASE/CONTEXT/PATTERNS/common/accept-with-rationale.md §
    # "Entries from trivy-prescan-2026-05-11"`:
    #   - --severity HIGH,CRITICAL
    #   - --ignore-unfixed
    #   - respects `.trivyignore` at repo root
    #
    # As of 2026-08-10 the tree is clean with the ignorefile EMPTIED
    # ENTIRELY — the 2 remaining entries are image-scan accepts this job
    # never sees. If this job goes red, a real fixable CVE landed; bump it,
    # do not add a line to `.trivyignore` (14 such lines accumulated between
    # 2026-05-11 and 2026-06-23 and none of them ever got revisited).
    name: Trivy filesystem scan (deps)
    needs: changes
    if: needs.changes.outputs.run_heavy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Compute dormant product dirs to exclude (derived, never hand-listed)
        # ASLEEP products (deploy/fleet/active-scope.txt) are out of the
        # process — their lockfiles' CVEs are not this repo's live dependency
        # debt until reactivated. Computed at runtime from disk ∩ the scope
        # file (same derive-don't-hand-maintain discipline as the connector
        # list in `tooling-tests` and the shard list in `mcp-toolkit-tests`),
        # never a literal dormant-slug list in this workflow.
        id: dormant
        run: |
          set -euo pipefail
          ACTIVE="${{ needs.changes.outputs.active_products }}"
          SKIP="projects,archive,migratingDB"
          if [ "$ACTIVE" = "ALL" ]; then
            echo "::warning::deploy/fleet/active-scope.txt unavailable upstream — scanning every products/<slug> dir (fail toward coverage)"
          else
            for d in products/*/; do
              slug="$(basename "$d")"
              if ! echo "$ACTIVE" | grep -q ",${slug},"; then
                SKIP="${SKIP},products/${slug}"
              fi
            done
          fi
          echo "skip_dirs=$SKIP" >> "$GITHUB_OUTPUT"
          echo "trivy skip-dirs: $SKIP"

      - name: Trivy filesystem scan — HIGH/CRITICAL, ignore-unfixed
        # `scan-type: fs` reads requirements*.txt / package-lock.json etc.
        # exit-code: 1 GATES the PR (blocking — noc's deployable code is clean,
        # so this passes honestly; not a workaround). `trivyignores:` picks up
        # the repo-root `.trivyignore`.
        #
        # `limit-severities-for-sarif: true` is REQUIRED for the gate to mean
        # what it says. In `format: sarif` mode, trivy-action otherwise writes
        # ALL severities to the SARIF regardless of `severity:` (so the Security
        # tab shows everything), and `exit-code: 1` then trips on ANY finding —
        # including MEDIUM. That made this gate fail on two MEDIUMs while
        # advertising "HIGH/CRITICAL" (scanner-config bug masquerading as CVE
        # debt — diagnosed 2026-05-22 from the raw CI SARIF: both findings
        # sec-sev <7.0). This flag makes the SARIF + exit-code both honor
        # `severity:` so the gate genuinely enforces HIGH/CRITICAL only.
        id: scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: .trivyignore
          # SCOPE to noc's DEPLOYABLE code (products/seed/mcp). Exclude
          # non-shipped material: projects/ (active project scaffolding + the
          # legacy one-permutas migration *reference* source), archive/ (retired
          # projects), migratingDB/ (one-off SQL). Those carry a legacy
          # Django/JS app's old deps — gating noc CI on a non-deployed reference
          # app's CVEs is a scan-scope error, NOT noc dependency debt.
          # Verified 2026-05-22: deployable code = 0 HIGH/CRITICAL (trivy v0.70.0 DB).
          # PLUS every dormant `products/<slug>` dir — see the "Compute
          # dormant product dirs" step above; derived, not hardcoded here.
          skip-dirs: ${{ steps.dormant.outputs.skip_dirs }}

      - name: Upload Trivy SARIF to GH Security tab
        # `if: always()` so the report uploads even when the scan
        # fails — same shape as the image-scan job above. Reviewers
        # need to see WHICH CVE failed.
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  bandit-scan:
    # Python static-application-security-testing.
    # Config: `bandit.yml` at repo root.
    # Gate: fails on MEDIUM+ severity AND MEDIUM+ confidence.
    # Targets: every product's backend app + the shared seed lib.
    name: Bandit Python SAST
    needs: changes
    if: needs.changes.outputs.run_heavy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install bandit
        # Pinned to 1.9.x — confirmed compatible with Python 3.11+ and
        # the bandit.yml shape at repo root. `[toml]` extra so bandit
        # can read pyproject-style configs alongside its own YAML.
        run: pip install 'bandit[toml]==1.9.4' bandit-sarif-formatter

      - name: Compute active product backend dirs to scan (derived, never hand-listed)
        # ASLEEP products (deploy/fleet/active-scope.txt) are out of the
        # process — restrict the `products/*/backend/app/` glob to AWAKE
        # products only. `bandit-baseline.json`'s grandfathered findings are
        # all under `products/social-wiring/` (an awake product), so shrinking
        # scope cannot turn this gate red: `--baseline` only fails on findings
        # NEW to the current scan, and this scan is a strict SUBSET of the
        # unscoped one — it can only drop findings, never add them.
        id: scope
        run: |
          set -euo pipefail
          ACTIVE="${{ needs.changes.outputs.active_products }}"
          DIRS=()
          for d in products/*/backend/app; do
            [ -d "$d" ] || continue
            slug="$(basename "$(dirname "$(dirname "$d")")")"
            if [ "$ACTIVE" = "ALL" ] || echo "$ACTIVE" | grep -q ",${slug},"; then
              DIRS+=("$d")
            fi
          done
          if [ "${#DIRS[@]}" -eq 0 ]; then
            echo "::error::no active product backend dirs discovered — refusing to report green over nothing"
            exit 1
          fi
          echo "dirs=${DIRS[*]}" >> "$GITHUB_OUTPUT"
          echo "bandit scope: ${DIRS[*]}"

      - name: Run bandit (SARIF output)
        # `--exit-zero` here so we can run BOTH the SARIF report
        # (always uploaded) and the gate (next step) without short-
        # circuiting on first failure. Same split-pattern as the
        # Trivy job above.
        env:
          BANDIT_DIRS: ${{ steps.scope.outputs.dirs }}
        run: |
          # BANDIT_DIRS is deliberately word-split below: it is a
          # space-separated list of dirs, each meant as its own -r
          # argument, not one quoted string.
          # shellcheck disable=SC2086
          bandit -r $BANDIT_DIRS seed/lib/backend/noctusai_lib/ \
            -c bandit.yml \
            --severity-level medium \
            --confidence-level medium \
            -f sarif \
            -o bandit.sarif \
            --exit-zero

      - name: Upload bandit SARIF to GH Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: bandit.sarif
          category: bandit

      - name: Bandit gate — fail on NEW MEDIUM+ findings
        # Real gate: re-run bandit against the committed baseline.
        # `--baseline bandit-baseline.json` grandfathers existing
        # findings (4 known issues — 3× XML parsing, 1× SHA1; tracked
        # in the follow-up bandit-baseline-cleanup project). NEW
        # findings introduced by a PR cause a non-zero exit and
        # fail the job. Same config so the report above and the
        # gate here surface identical NEW findings.
        env:
          BANDIT_DIRS: ${{ steps.scope.outputs.dirs }}
        run: |
          # Same deliberate word-split as above.
          # shellcheck disable=SC2086
          bandit -r $BANDIT_DIRS seed/lib/backend/noctusai_lib/ \
            -c bandit.yml \
            --severity-level medium \
            --confidence-level medium \
            --baseline bandit-baseline.json \
            -f screen

  gitleaks-scan:
    # Secrets scanning. Config: `.gitleaks.toml` at repo root.
    # Gate: any leaked secret fails the job.
    # On PRs: scans the PR diff (fast).
    # On push to main: scans the diff against the previous commit.
    # Full-history scan is out-of-scope (would push CI past 10min for
    # zero signal — history is already merged).
    name: Gitleaks secrets scan
    needs: changes
    # NOT on workflow_dispatch (2026-09-22): the action has no diff base for a
    # manual run, so it scans the FULL history — the out-of-scope case above — and
    # fails on long-merged, triaged fixtures. That made every dispatched run red,
    # including the full suite sync-product-scope.yml dispatches when a product
    # wakes (whose bot commit gets no push run, so that red would block bless).
    # Every human commit is still scanned by its own push/PR run; the bot commit
    # only touches the two generated deploy/fleet/*-scope.txt files.
    if: needs.changes.outputs.run_heavy == 'true' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks-action needs the diff history; fetch-depth: 0
          # pulls the full ref so the diff base is available.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          # Public repo / free tier — no license required. Action
          # auto-detects event shape (push vs pull_request) and
          # scopes the scan accordingly.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 🔴 MUST be an env var, NOT a `with:` input. gitleaks-action@v3
          # declares NO inputs (`valid inputs are ['']`) and silently warns
          # `Unexpected input(s) 'config-path'` — so the repo-root allowlist
          # was loaded for NOBODY and every triaged false positive in
          # `.gitleaks.toml` was dead config. Caught 2026-09-20 when a list of
          # D4Sign credential NAMES (not values) failed the scan despite the
          # allowlist being present and correct.
          GITLEAKS_CONFIG: .gitleaks.toml

  tooling-tests:
    # The TOOLING half of the repo — everything with a real suite that is
    # neither a product nor the seed: `dev_team` (167), the 14 MCP connectors
    # (482), `scripts/codemods` (15) and the `templates/product-seed` scaffold
    # (50). 714 tests that no workflow ran.
    #
    # 🔴 WHY EACH SUITE GETS ITS OWN pytest INVOCATION, rather than one call
    # with every path. 13 of the 14 connectors ship a file literally named
    # `tests/test_smoke.py`. Collected together they resolve to colliding
    # module names, and the result is not a clean error — it is two tests
    # reported under `mcp/google/test_smoke.py` whose traceback executes
    # entirely inside `mcp/imovelweb/tests/test_smoke.py`. Same total collected
    # (482 either way), so the COUNT does not betray it; only the attribution
    # is wrong, which is the worst way for a suite to be wrong. Per-suite
    # invocation makes the collision structurally impossible.
    #
    # 🔴 WHY `continue-on-error` IS ABSENT AND THE LOOP ACCUMULATES INSTEAD.
    # `set -e` would stop at the first red suite and hide the rest on the very
    # first run — exactly when you most want the whole picture. The loop records
    # each failure, prints a summary, and exits non-zero at the end.
    #
    # Sized before landing (the discipline from the Sixth axis): all four roots
    # run green from a scrubbed `env -i` (no `.env`, no SUPABASE_*) on 3.11 with
    # this exact dependency set, in ~8s total. Blocking from day one.
    name: Tooling Tests (pytest)
    needs: changes
    if: needs.changes.outputs.run_heavy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system build deps (cairo/pango/gdk + libpq/ffi)
        run: |
          # Same third-party-apt-source guard as `product-backend-tests` — see
          # that job for the incident it exists for.
          sudo grep -rlE 'dl\.google\.com' /etc/apt/sources.list.d/ 2>/dev/null \
            | sudo xargs -r rm -f
          sudo sed -i '/dl\.google\.com/d' /etc/apt/sources.list 2>/dev/null || true
          sudo apt-get update || true
          sudo apt-get install -y --no-install-recommends \
            libcairo2-dev libgirepository1.0-dev libpango1.0-dev \
            libgdk-pixbuf-2.0-dev libffi-dev libpq-dev pkg-config

      - name: Install dependencies (root superset + the MCP toolkit set)
        # The connectors import the `mcp` SDK and `scripts/codemods` imports
        # `libcst`; neither is in the root superset, both are in the toolkit
        # requirements. Installed from `mcp/noctusai` because that file carries
        # `-e ../../seed/lib/backend` as a CWD-relative path (see the
        # mcp-toolkit-tests job for the incident that taught us this).
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
          (cd mcp/noctusai && pip install -r requirements.txt)

      - name: Run tooling suites (each in its own invocation)
        run: |
          # Derive the connector suites from git rather than a hand-written
          # list — the drift class this repo keeps re-learning
          # (KB § PATTERNS/devops/product-lockfile-and-slug-drift.md).
          # `mcp/noctusai` is excluded: it has its own dedicated job.
          # `while read`, not `mapfile`: mapfile is bash 4+, and on a bash 3.2
          # host it fails SILENTLY leaving an empty array — the loop then runs
          # nothing and the job reports green. That is the exact unenforced-gate
          # shape this job exists to close, so it is not left to luck.
          CONNECTORS=()
          while IFS= read -r line; do
            [ -n "$line" ] && CONNECTORS+=("$line")
          done < <(
            git ls-files 'mcp/*/tests/*' \
              | grep -E 'test_.*\.py$' \
              | sed 's|/[^/]*$||' \
              | sort -u \
              | grep -v '^mcp/noctusai/'
          )
          echo "connector suites: ${#CONNECTORS[@]}"

          # 🔴 FLOOR. A derived list that silently comes back empty is how a
          # gate dies without anyone noticing. There are 14 connector suites
          # today; refuse outright below 10 rather than "pass" over nothing.
          # If connectors are legitimately removed, lower this deliberately.
          if [ "${#CONNECTORS[@]}" -lt 10 ]; then
            echo "::error::only ${#CONNECTORS[@]} connector suite(s) discovered (expected >=10) — the derivation is broken, refusing to report green over nothing"
            exit 1
          fi

          failed=()
          run_suite() {  # run_suite <label> <dir-to-cd-into> [pytest args...]
            local label="$1"; shift
            local dir="$1"; shift
            echo "::group::$label"
            if ( cd "$dir" && python -m pytest "$@" --tb=short -q ); then
              echo "  OK $label"
            else
              echo "::error::$label FAILED"
              failed+=("$label")
            fi
            echo "::endgroup::"
          }

          for d in "${CONNECTORS[@]}"; do
            run_suite "$d" . "$d"
          done
          run_suite "dev_team"                     dev_team
          run_suite "scripts/codemods"             .          scripts/codemods
          run_suite "templates/product-seed"       templates/product-seed/backend

          if [ ${#failed[@]} -ne 0 ]; then
            echo "::error::${#failed[@]} tooling suite(s) failed: ${failed[*]}"
            exit 1
          fi
          echo "all tooling suites green"

  mcp-toolkit-tests:
    # The dev toolkit's OWN suite (mcp/noctusai/tests/, ~2.6k tests): the MCP
    # tools, compliance keepers, cache infra, the embed funnel. Born 2026-05-31
    # — this suite had NO CI job, so it silently rotted to 12 red tests + 15
    # compliance regressions that only a human hand-running pytest could ever
    # catch (and none did). An unenforced quality gate is silent debt; "is it
    # green?" must be answered by CI, not a person. Memory:
    # feedback_unenforced_gate_is_silent_debt.
    # HERMETIC: no live OpenAI key — keyless, the embed tests mock/skip (verified
    # 45/45 keyless), so this stays fast + green on fork PRs (no secrets needed).
    name: MCP Toolkit Tests
    needs: changes
    if: needs.changes.outputs.run_heavy == 'true'
    runs-on: ubuntu-latest
    # SHARDED (2026-09 CI-cost audit): this suite was the workflow's critical
    # path — ~2.6k tests, single process, ~10min wall-clock, while every other
    # job finished by minute 4–5. pytest-xdist was evaluated and rejected: 31
    # test files in this suite touch the Tier-1 keeper-mirror SQLite caches
    # (fixed paths under `<git-common-dir>/noctusai/cache/`, shared — not
    # per-worker), and several rebuild/force-refresh them in-test, so
    # concurrent xdist workers hitting the same physical .sqlite file mid-test
    # is a correctness risk, not just a perf one. A file-level matrix split
    # carries no such risk (each shard is its own process, its own runner, its
    # own from-scratch cache prime) and needs no new dependency. Coverage is
    # PROVED, not assumed, by the `mcp-toolkit-tests-coverage` job below
    # (derives the same partition independently and diffs it against the full
    # file list).
    #
    # 5th shard `compliance` — ONE narrow, MEASURED exception to "never hand-
    # list": `test_compliance.py` alone was clocked at 8+ minutes standalone in
    # local verification (killed at 461s, still not done) — by a wide margin
    # the single most expensive file in the suite (it drives the whole-
    # platform compliance regression gate across every product) and, at 4350
    # lines, ~9x the size of the next-largest file here. Plain round-robin by
    # sorted filename put it in the SAME bucket as several other slow-but-
    # small files (test_catalog.py, test_server_build.py, test_rollups.py,
    # test_strict_tool_arguments.py, test_worktree_rollout_phase4.py) purely
    # by alphabetical coincidence, making that one shard the long pole instead
    # of ~1/4 of the wall-clock. Isolating it is a name, not a list — if a
    # future file becomes the new worst offender, re-measure and move the
    # name, don't grow this into a hand-maintained ranking.
    strategy:
      fail-fast: false
      matrix:
        shard: ["0", "1", "2", "3", "compliance"]
    # JOB-level hermetic env so EVERY step (incl. the cache-priming step) inherits
    # it — not just the pytest step. NOCTUS_DISABLE_AUTO_CACHE_PULL is the load-
    # bearing one: without it the structural-cache refreshes try to auto-pull from
    # the prod pgvector mirror (localhost:5432, unreachable here), which left a
    # stale-schema sqlite file → `no such column: keeper_name` in _init_schema →
    # the prime step died before pytest even ran. Disabled, each cache builds clean
    # from source.
    env:
      NOCTUS_EMBED_MIN_INTERVAL_MS: "0"
      NOCTUS_DISABLE_AUTO_CACHE_PULL: "1"
      MCP_TEST_TOTAL_SHARDS: "4"
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node
        # `mcp/noctusai/node/` (ts-morph, gitignored `node_modules`) needs a
        # runtime that satisfies its transitive deps' `engines.node` floor —
        # `brace-expansion`/`minimatch`/`balanced-match` all require
        # `20 || >=22` (checked against the ts-morph 24→28 bump, a44d2591).
        # `ubuntu-latest` is NOT guaranteed to expose a matching `node` on
        # PATH without this step — same reason every FE-build/test job in
        # this file already pins one. Match that pin (20) rather than trust
        # an unpinned runner default that could silently drift underneath us.
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install system build deps (libpq for psycopg; ffi for cffi)
        run: |
          # 🔴 A THIRD-PARTY APT SOURCE MUST NOT BE ABLE TO FAIL THIS BUILD.
          # The runner image ships Google's Chrome repo, so `apt-get update`
          # contacts dl.google.com even for a job whose only wants are
          # cairo/pango/libpq/ffi — and `apt-get update` exits 100 when ANY
          # source fails. On 2026-09-09 that index served a corrupt
          # "Hash Sum mismatch" for hours and took the WHOLE matrix down on a
          # diff touching none of it, blocking `release stage='bless'` (which
          # correctly refuses a red tip).
          #
          # Two layers, because the first attempt at this guessed wrong:
          # removing `/etc/apt/sources.list.d/google-chrome.list` did nothing,
          # since the image can declare the repo as a deb822 `.sources` file or
          # inline in `sources.list`. So find it by CONTENT rather than by a
          # path we assumed.
          sudo grep -rlE 'dl\.google\.com' /etc/apt/sources.list.d/ 2>/dev/null \
            | sudo xargs -r rm -f
          sudo sed -i '/dl\.google\.com/d' /etc/apt/sources.list 2>/dev/null || true
          # And then refuse to let a stale index be fatal at all. This is NOT a
          # swallowed error: `apt-get install` below is the real gate and stays
          # fatal — a package that genuinely cannot be resolved fails there,
          # loudly and by name. What `|| true` drops is only the "some index
          # failed to download" verdict, which says nothing about whether the
          # packages we actually need are installable.
          sudo apt-get update || true
          sudo apt-get install -y --no-install-recommends libffi-dev libpq-dev pkg-config

      - name: Install toolkit deps (incl. -e seed/lib/backend → noctusai_lib)
        # MUST run from mcp/noctusai/: requirements.txt has `-e ../../seed/lib/backend`,
        # and pip resolves a requirements-file relative path against the CWD (not the
        # file's dir). From repo-root the `../../` escapes the repo → "not a valid
        # editable requirement". This was invisible until CI actually ran (the job was
        # billing-gated since it was added) — the unenforced-gate lesson, one layer down.
        working-directory: mcp/noctusai
        run: pip install -r requirements.txt

      - name: Install MCP toolkit node deps (ts-morph — the AST keepers need it)
        # `check_lying_loading_state` Mode B (+ `ts_ast_rename_symbol`) shell
        # out to `node` against `mcp/noctusai/node/lying_loading_scan.mjs` /
        # `ts_ast_edit.mjs`, which import `ts-morph` from this dir's OWN
        # gitignored `node_modules` — a separate tooling dependency from any
        # product frontend, never installed by the FE jobs above. Landed
        # ab37df8d (Mode B AST detector) with NO install step here, so the
        # new AST-backed tests self-skipped in CI and a real fleet scan
        # degraded to a single bootstrap-error finding — honest about the
        # gap, but zero coverage. `npm ci` (not `npm install`): the lockfile
        # at `mcp/noctusai/node/package-lock.json` is the freeze.
        working-directory: mcp/noctusai/node
        run: npm ci --no-audit --no-fund

      - name: Prime hermetic state (version stamp + structural caches; zero OpenAI)
        # The suite has tests that assert the STRUCTURAL keeper-mirror caches
        # (keeper-patterns / agent-context / auto-improvement / noc-graph) exist
        # AND are populated, and that the seed version stamp matches HEAD. Those
        # are gitignored / generated, so a fresh CI checkout lacks them → cache-
        # missing compliance findings + empty-graph edge-floor failures. All four
        # caches are ZERO-OpenAI, so build them here (mirrors a real environment).
        # noc-graph is built LAST so it reads the freshly-built keeper cache
        # (→ KEEPER_RULE nodes + GUARDED_BY edges). The embedding-backed
        # semantic_neighbor edges still can't exist hermetically (no OpenAI key) —
        # that one floor test skips itself when the embedding cache is absent.
        working-directory: mcp/noctusai
        run: |
          python cli.py --stamp-seed-version
          python cli.py --refresh-keeper-cache
          python cli.py --refresh-agent-context-cache
          python cli.py --refresh-auto-improvement-cache
          python cli.py --refresh-noc-graph

      - name: Compute this shard's test files (derived — never hand-listed, except the one named isolate)
        id: shard
        # `compliance` shard: just the one measured-heaviest file (see the
        # strategy comment above). Every OTHER shard round-robins over the
        # SORTED, git-derived file list MINUS that one file (same derive-
        # don't-hand-maintain discipline `tooling-tests` above already uses
        # for its connector list): file[i] belongs to shard (i % 4).
        # Deterministic, exhaustive, non-overlapping by construction — proved
        # independently by the `mcp-toolkit-tests-coverage` job.
        # `SHARD` is set via `env:` (not interpolated as `${{ matrix.shard }}`
        # directly into the script) — the standard GH Actions hardening: never
        # splice an expression straight into `run:` shell text.
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          ISOLATED="mcp/noctusai/tests/test_compliance.py"

          if [ "$SHARD" = "compliance" ]; then
            echo "$ISOLATED" > /tmp/mcp-shard-files.txt
            echo "shard compliance: 1 file (isolated — see strategy comment)"
            exit 0
          fi

          FILES=()
          while IFS= read -r line; do
            [ -n "$line" ] && [ "$line" != "$ISOLATED" ] && FILES+=("$line")
          done < <(git ls-files 'mcp/noctusai/tests/*test_*.py' 'mcp/noctusai/tests/**/test_*.py' | sort -u)

          # 🔴 FLOOR — same shape as the connector-suite floor in `tooling-tests`
          # above: a derivation that silently comes back near-empty must refuse,
          # not report green over nothing.
          if [ "${#FILES[@]}" -lt 99 ]; then
            echo "::error::only ${#FILES[@]} test file(s) discovered under mcp/noctusai/tests (minus the isolated one) — the derivation is broken, refusing to shard over nothing"
            exit 1
          fi

          MINE=()
          for i in "${!FILES[@]}"; do
            if [ $(( i % MCP_TEST_TOTAL_SHARDS )) -eq "$SHARD" ]; then
              MINE+=("${FILES[$i]}")
            fi
          done
          echo "shard $SHARD/${MCP_TEST_TOTAL_SHARDS}: ${#MINE[@]} of ${#FILES[@]} non-isolated file(s)"
          printf '%s\n' "${MINE[@]}" > /tmp/mcp-shard-files.txt

      - name: Run MCP toolkit suite — shard ${{ matrix.shard }} (hermetic — no live OpenAI key)
        env:
          NOCTUS_EMBED_MIN_INTERVAL_MS: "0"
          NOCTUS_DISABLE_AUTO_CACHE_PULL: "1"
        # Full suite, no exclusions — just partitioned across 5 shards. (The
        # 2026-05-31 quarantine of the two platform-health gate tests was
        # lifted the same day: the social-wiring YT-OAuth production bug was
        # fixed — 8c800c37 — and the 2 organ-shim NotificationBell findings
        # were accepted into the refreshed compliance baseline with rationale.)
        run: xargs -a /tmp/mcp-shard-files.txt pytest -q -p no:cacheprovider

  mcp-toolkit-tests-coverage:
    # Independent proof that the 5 shards above (4 round-robin + the 1 named
    # isolate) are an exact partition of every test file under
    # mcp/noctusai/tests/ — no file silently dropped, none silently doubled.
    # Recomputes the SAME derivation as the shard step and diffs the union
    # against the full list; this job holds no pytest dependency at all, so
    # it can never be green for the wrong reason.
    name: MCP Toolkit Tests — shard coverage proof
    needs: changes
    if: needs.changes.outputs.run_heavy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Prove the 5 shards union back to the full file set
        run: |
          set -euo pipefail
          ISOLATED="mcp/noctusai/tests/test_compliance.py"
          git ls-files 'mcp/noctusai/tests/*test_*.py' 'mcp/noctusai/tests/**/test_*.py' | sort -u > /tmp/all.txt
          TOTAL=$(wc -l < /tmp/all.txt)
          if [ "$TOTAL" -lt 100 ]; then
            echo "::error::only $TOTAL test file(s) discovered — refusing to prove coverage over nothing"
            exit 1
          fi
          if ! grep -qxF "$ISOLATED" /tmp/all.txt; then
            echo "::error::the named isolate '$ISOLATED' no longer exists — update the strategy comment + this job's ISOLATED constant together"
            exit 1
          fi

          FILES=()
          while IFS= read -r line; do
            [ -n "$line" ] && [ "$line" != "$ISOLATED" ] && FILES+=("$line")
          done < /tmp/all.txt

          : > /tmp/union.txt
          echo "$ISOLATED" >> /tmp/union.txt
          for shard in 0 1 2 3; do
            for i in "${!FILES[@]}"; do
              if [ $(( i % 4 )) -eq "$shard" ]; then
                echo "${FILES[$i]}" >> /tmp/union.txt
              fi
            done
          done
          sort -u /tmp/union.txt -o /tmp/union.txt

          if ! diff -q /tmp/all.txt /tmp/union.txt >/dev/null; then
            echo "::error::shard coverage mismatch — the union of the 5 mcp-toolkit-tests shards does not equal the full test-file set"
            diff /tmp/all.txt /tmp/union.txt || true
            exit 1
          fi
          echo "OK: $TOTAL test files, exactly covered once each by the 5 shards (1 isolated + 4 round-robin)"
