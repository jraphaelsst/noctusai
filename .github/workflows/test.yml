name: Tests & Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  erp-backend-tests:
    name: ERP Backend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run tests
        working-directory: products/erp-imobiliario/backend
        run: pytest --tb=short -q

  core-backend-tests:
    name: Core Backend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run tests
        working-directory: products/core/backend
        run: pytest --tb=short -q

  pf-backend-tests:
    name: PF Backend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run tests
        working-directory: products/personal-finance/backend
        run: pytest --tb=short -q

  erp-frontend-build:
    name: ERP Frontend Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: products/erp-imobiliario/frontend/package-lock.json

      - name: Install dependencies
        working-directory: products/erp-imobiliario/frontend
        run: npm ci

      - name: Lint
        working-directory: products/erp-imobiliario/frontend
        run: npm run lint

      - name: Build
        working-directory: products/erp-imobiliario/frontend
        run: npm run build

  core-frontend-build:
    name: Core Frontend Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: products/core/frontend/package-lock.json

      - name: Install dependencies
        working-directory: products/core/frontend
        run: npm ci

      - name: Build
        working-directory: products/core/frontend
        run: npm run build

  pf-frontend-build:
    name: PF Frontend Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: products/personal-finance/frontend/package-lock.json

      - name: Install dependencies
        working-directory: products/personal-finance/frontend
        run: npm ci

      - name: Build
        working-directory: products/personal-finance/frontend
        run: npm run build

  core-e2e-tests:
    name: Core E2E Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: products/core/frontend/package-lock.json

      - name: Install dependencies
        working-directory: products/core/frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: products/core/frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: products/core/frontend
        run: npx playwright test

      - name: Upload report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: core-playwright-report
          path: products/core/frontend/playwright-report/
          retention-days: 14

  erp-e2e-tests:
    name: ERP E2E Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: products/erp-imobiliario/frontend/package-lock.json

      - name: Install dependencies
        working-directory: products/erp-imobiliario/frontend
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browsers
        working-directory: products/erp-imobiliario/frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: products/erp-imobiliario/frontend
        run: npx playwright test
        env:
          VITE_SUPABASE_URL: http://localhost:54321
          VITE_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
          VITE_BACKEND_API_URL: http://localhost:8001

      - name: Upload report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: erp-playwright-report
          path: products/erp-imobiliario/frontend/playwright-report/
          retention-days: 14

  docker-compose-validate:
    name: Docker Compose Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate root compose (resolves all includes)
        run: docker compose config --quiet
      - name: Validate each per-product compose standalone
        run: |
          set -e
          for compose in products/*/docker-compose.yml; do
            echo "→ $compose"
            (cd "$(dirname "$compose")" && docker compose config --quiet)
          done
      - name: FRAMEWORK_DEPS coverage (every product lists every dep that vite dedupe expects)
        run: python3 scripts/check-framework-deps.py

  prod-render-clean:
    # Codifies KB § PATTERNS/containerization.md §11d "Prod-overlay
    # dev-reset discipline" as a CI gate. The dev override
    # (docker-compose.override.yml) MUST stay fully neutralized when the
    # prod overlay is applied. Any future override change that
    # re-introduces a runtime-affecting key without a matching
    # top-level !reset in docker-compose.prod.yml fails this step before
    # merge — closes the "discipline lives only in prose" gap that
    # surfaced 2026-05-11.
    name: Prod-render clean (no dev-override leaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Seed .env from example (compose env_file requires the file to exist)
        run: cp .env.example .env
      - name: Render prod compose config
        run: |
          NOCTUS_IMAGE_TAG=ci docker compose \
            -f docker-compose.yml \
            -f docker-compose.prod.yml \
            config > /tmp/prod-render.yaml
      - name: Assert NO dev-override leaks (negative gates)
        # grep -c returns exit 1 when count is 0 → the `|| true` keeps
        # the step from failing for the WRONG reason. Patterns are
        # single-quoted so bash doesn't interpret the `--` or `"`.
        run: |
          set -e
          fail=0
          for pattern in 'type: bind' '\--reload' 'npm run dev' 'restart: "no"'; do
            count=$(grep -c "$pattern" /tmp/prod-render.yaml || true)
            if [ "$count" -gt 0 ]; then
              echo "FAIL: prod render has $count occurrence(s) of '$pattern' (dev-override leak)"
              fail=1
            else
              echo "OK:   '$pattern' → 0"
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo ""
            echo "Per KB § PATTERNS/containerization.md §11d, every runtime-affecting"
            echo "key the dev override sets that is NOT also set by the per-product"
            echo "prod overlay needs an explicit '!reset null' at the top-level of"
            echo "docker-compose.prod.yml. A leaked key above means a recent dev-override"
            echo "change skipped the recurrence-rule trigger."
            exit 1
          fi
      - name: Assert prod intent preserved (positive gates)
        # Confirms the reset wasn't over-aggressive — per-product prod
        # overlays must still apply restart: always + NODE_ENV: production.
        # Thresholds match today's fleet: 22 always-restarts, 11 prod NODE_ENVs
        # (set conservatively at >20 and >10 to absorb single-product churn).
        run: |
          set -e
          always_count=$(grep -c 'restart: always' /tmp/prod-render.yaml || true)
          nodeenv_count=$(grep -c 'NODE_ENV: production' /tmp/prod-render.yaml || true)
          echo "restart: always → $always_count (expected >20)"
          echo "NODE_ENV: production → $nodeenv_count (expected >10)"
          if [ "$always_count" -le 20 ]; then
            echo "FAIL: per-product prod overlays no longer apply restart: always — over-reset trap"
            exit 1
          fi
          if [ "$nodeenv_count" -le 10 ]; then
            echo "FAIL: per-product prod overlays no longer apply NODE_ENV: production — over-reset trap"
            exit 1
          fi

  docker-images-build:
    # Full-fleet matrix build per KB § PATTERNS/containerization.md §11f.
    # 10 products × {backend, frontend} = 20 matrix cells. fail-fast: false
    # so one heavy product (e.g. dev-team) failing doesn't cancel siblings.
    # On main pushes: build + push + scan. On PRs: build + scan only
    # (SARIF uploaded to GH Security tab; never pushes to registry).
    name: Image — ${{ matrix.product }}-${{ matrix.role }}
    runs-on: ubuntu-latest
    needs: docker-compose-validate
    permissions:
      contents: read
      packages: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        product:
          - core
          - erp-imobiliario
          - personal-finance
          - therapy-platform
          - daily-life
          - mailing
          - adconnect
          - dev-team
          - media-scheduling
          - seed
        role: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        # Only authenticate when we'll actually push (main pushes). On PRs
        # we never push, so logging in would just waste a call + grant
        # write:packages where it isn't needed.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image to local daemon (for scan)
        # First pass: ALWAYS build with `load: true` so the image is in
        # the local daemon for Trivy to scan. We don't push here — the
        # `Push to GHCR` step below pushes from the same buildx cache on
        # main only. Splitting build → scan → push lets Trivy's exit-code
        # gate the push (vulnerable image never lands in the registry).
        # `docker/build-push-action@v5` wires the GHA layer cache backend
        # (`type=gha`). Cache mode=max keeps every intermediate layer,
        # trading cache size for fastest rebuilds. The 10GB GHA cache cap
        # evicts LRU; acceptable for a 20-image fleet sharing base layers.
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: products/${{ matrix.product }}/${{ matrix.role }}/Dockerfile
          load: true
          push: false
          build-args: |
            GIT_SHA=${{ steps.sha.outputs.short }}
          tags: |
            ghcr.io/jraphaelsst/noctus-${{ matrix.product }}-${{ matrix.role }}:${{ steps.sha.outputs.short }}
            ghcr.io/jraphaelsst/noctus-${{ matrix.product }}-${{ matrix.role }}:latest
          cache-from: type=gha,scope=${{ matrix.product }}-${{ matrix.role }}
          cache-to: type=gha,mode=max,scope=${{ matrix.product }}-${{ matrix.role }}

      - name: Scan image with Trivy (HIGH,CRITICAL — fail on findings)
        # Pinned to a specific tag instead of @master so a Trivy upstream
        # change can't surprise CI silently. Bump cadence: review every
        # 3-6 months for new severities + scanner-engine improvements.
        # `exit-code: 1` ensures vulnerable images break the build before
        # the push step gets to run — vulnerable images never publish.
        # Image is in the local daemon from the build step above.
        id: scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ghcr.io/jraphaelsst/noctus-${{ matrix.product }}-${{ matrix.role }}:${{ steps.sha.outputs.short }}
          format: sarif
          output: trivy-${{ matrix.product }}-${{ matrix.role }}.sarif
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      - name: Upload Trivy SARIF to GH Security tab
        # SARIF upload runs on every build (PR or main) so security
        # findings land in the GH Security tab regardless of push gating.
        # `if: always()` so a failed Trivy scan still uploads the report
        # — that's the value: see exactly which CVE failed the build.
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.product }}-${{ matrix.role }}.sarif
          category: trivy-${{ matrix.product }}-${{ matrix.role }}

      - name: Push to GHCR (main only, scan-clean only)
        # Gated on main push AND a clean Trivy scan: build-push-action's
        # `cache-from` reuses the layers from the build step above, so
        # this is a fast cache-hit re-export rather than a second full
        # build. The image is identical to what Trivy just scanned.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: products/${{ matrix.product }}/${{ matrix.role }}/Dockerfile
          push: true
          build-args: |
            GIT_SHA=${{ steps.sha.outputs.short }}
          tags: |
            ghcr.io/jraphaelsst/noctus-${{ matrix.product }}-${{ matrix.role }}:${{ steps.sha.outputs.short }}
            ghcr.io/jraphaelsst/noctus-${{ matrix.product }}-${{ matrix.role }}:latest
          cache-from: type=gha,scope=${{ matrix.product }}-${{ matrix.role }}
          cache-to: type=gha,mode=max,scope=${{ matrix.product }}-${{ matrix.role }}
