name: Tests & Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  erp-backend-tests:
    name: ERP Backend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run tests
        working-directory: products/erp-imobiliario/backend
        run: pytest --tb=short -q

  core-backend-tests:
    name: Core Backend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run tests
        working-directory: products/core/backend
        run: pytest --tb=short -q

  pf-backend-tests:
    name: PF Backend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run tests
        working-directory: products/personal-finance/backend
        run: pytest --tb=short -q

  erp-frontend-build:
    name: ERP Frontend Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: products/erp-imobiliario/frontend/package-lock.json

      - name: Install dependencies
        working-directory: products/erp-imobiliario/frontend
        run: npm ci

      - name: Lint
        working-directory: products/erp-imobiliario/frontend
        run: npm run lint

      - name: Build
        working-directory: products/erp-imobiliario/frontend
        run: npm run build

  core-frontend-build:
    name: Core Frontend Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: products/core/frontend/package-lock.json

      - name: Install dependencies
        working-directory: products/core/frontend
        run: npm ci

      - name: Build
        working-directory: products/core/frontend
        run: npm run build

  pf-frontend-build:
    name: PF Frontend Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: products/personal-finance/frontend/package-lock.json

      - name: Install dependencies
        working-directory: products/personal-finance/frontend
        run: npm ci

      - name: Build
        working-directory: products/personal-finance/frontend
        run: npm run build

  core-e2e-tests:
    name: Core E2E Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: products/core/frontend/package-lock.json

      - name: Install dependencies
        working-directory: products/core/frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: products/core/frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: products/core/frontend
        run: npx playwright test

      - name: Upload report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: core-playwright-report
          path: products/core/frontend/playwright-report/
          retention-days: 14

  erp-e2e-tests:
    name: ERP E2E Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: products/erp-imobiliario/frontend/package-lock.json

      - name: Install dependencies
        working-directory: products/erp-imobiliario/frontend
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browsers
        working-directory: products/erp-imobiliario/frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: products/erp-imobiliario/frontend
        run: npx playwright test
        env:
          VITE_SUPABASE_URL: http://localhost:54321
          VITE_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
          VITE_BACKEND_API_URL: http://localhost:8001

      - name: Upload report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: erp-playwright-report
          path: products/erp-imobiliario/frontend/playwright-report/
          retention-days: 14

  docker-compose-validate:
    name: Docker Compose Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate root compose (resolves all includes)
        run: docker compose config --quiet
      - name: Validate each per-product compose standalone
        run: |
          set -e
          for compose in products/*/docker-compose.yml; do
            echo "→ $compose"
            (cd "$(dirname "$compose")" && docker compose config --quiet)
          done
      - name: FRAMEWORK_DEPS coverage (every product lists every dep that vite dedupe expects)
        run: python3 scripts/check-framework-deps.py

  docker-images-build:
    name: Docker Images Build (smoke)
    runs-on: ubuntu-latest
    needs: docker-compose-validate
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build core + seed images (smoke — full fleet too slow on CI)
        run: |
          docker compose build --pull \
            core-backend core-frontend \
            seed-backend seed-frontend
