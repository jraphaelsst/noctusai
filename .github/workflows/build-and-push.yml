# Build & Push product images to GHCR (the §2 ② "GHCR-pull" delivery layer).
#
# WHAT THIS IS — the BUILD/DELIVER layer. It builds the slim `--target runtime`
# product images off-box (here, on a GitHub runner) and pushes them to GHCR as
# immutable `:<sha>` artifacts + a moving `:latest`. It does NOT deploy.
#
# HOW IT COMPOSES (does NOT supersede the deploy tooling):
#   • THIS workflow   → builds + pushes the artifact (the §2 ② model).
#   • noctus.dev.deploy_image --source pull  → the DEPLOY/ROLLBACK-SAFETY layer:
#       snapshot → swap → health-probe → rollback, on the VPS (KB §2a C2).
#   • The `prod` promote-branch gate is unchanged — building on `main` does NOT
#       auto-deploy to prod. You still promote + run deploy_image deliberately.
#   The durable `:<sha>` tags ALSO make rollback/DR robust (pull an old sha)
#   instead of relying only on the in-place commit-snapshot.
#
# REQUIRED REPO SECRETS (Settings → Secrets and variables → Actions):
#   • VITE_SUPABASE_URL              — baked into the FE bundle at build time
#   • VITE_SUPABASE_PUBLISHABLE_KEY  — baked into the FE bundle at build time
#   (VITE_CORE_URL is the public domain, set as env below — not a secret.)
#   GHCR auth uses the built-in GITHUB_TOKEN (no PAT to manage/rotate).
#
# NOTE — the VPS pulls PRIVATE GHCR packages, so it needs a read:packages token
#   (or make the packages public). Until images exist here, the live fleet stays
#   on the build-on-VPS model (§2 ①) — this workflow is what activates §2 ②.
name: Build & Push Images (GHCR)

on:
  push:
    branches: [main]
    paths:
      - "products/**"
      - "seed/**"
      - "scripts/infra/build-and-push.sh"
      - "scripts/infra/build-base-images.sh"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag (default: short git sha). :latest is always moved too."
        required: false
        default: ""
      products:
        description: "Space-separated product slugs to build (default: all 8). e.g. 'social-wiring' for a ~3-min targeted test."
        required: false
        default: ""

permissions:
  contents: read
  packages: write

concurrency:
  group: build-push-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    name: Build + push fleet images
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_CORE_URL: https://core.noctusai.com
      VITE_CORE_API_URL: https://core.noctusai.com
      GHCR_USERNAME: ${{ github.actor }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5  # Node 24 (v4 was Node 20, deprecated)
        with:
          fetch-depth: 0   # need the push range (before..after) to scope the build to CHANGED products

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3  # @v3 major-pin auto-gets the Node 24 patch

      - name: Require VITE secrets (fail-closed — never push a broken-FE image)
        run: |
          if [ -z "${VITE_SUPABASE_URL}" ] || [ -z "${VITE_SUPABASE_PUBLISHABLE_KEY}" ]; then
            echo "::error::VITE_SUPABASE_URL / VITE_SUPABASE_PUBLISHABLE_KEY repo secrets are empty — refusing to build (a build without them bakes a broken FE; the seed FE inlines VITE_* at build time). Add them in Settings → Secrets and variables → Actions, then re-run."
            exit 1
          fi

      # Scope the build to what actually changed — mirrors the DEPLOY side
      # (noctus.dev.promote / deploy_pull already report `rebuild: [<slug>...]`).
      # Drift fixed 2026-06-03: a push used to rebuild the WHOLE fleet because it
      # passed no `products` arg → build-and-push.sh's "empty = ALL" default fired.
      #   • workflow_dispatch → honor the explicit `products` input (empty = ALL).
      #   • push touching seed/** or the build scripts → ALL (shared base changed).
      #   • push touching only products/<slug>/ → just those slugs.
      #   • push with no usable base (first push / force) → ALL (safe default).
      #   • push touching none of the above (e.g. only a deleted file) → SKIP.
      - name: Determine products to build (changed-only scoping)
        id: scope
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=dispatch" >> "$GITHUB_OUTPUT"
            echo "products=${{ github.event.inputs.products }}" >> "$GITHUB_OUTPUT"
            echo "scope: workflow_dispatch → '${{ github.event.inputs.products }}' (empty = ALL)"; exit 0
          fi
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "mode=all" >> "$GITHUB_OUTPUT"; echo "products=" >> "$GITHUB_OUTPUT"
            echo "scope: no usable base ($BEFORE) → ALL (safe default)"; exit 0
          fi
          CHANGED="$(git diff --name-only "$BEFORE" "${{ github.sha }}")"
          echo "changed files:"; echo "$CHANGED" | sed 's/^/  /'
          if echo "$CHANGED" | grep -qE '^(seed/|scripts/infra/build-(and-push|base-images)\.sh$)'; then
            echo "mode=all" >> "$GITHUB_OUTPUT"; echo "products=" >> "$GITHUB_OUTPUT"
            echo "scope: seed/ or build-script changed → ALL (shared base)"; exit 0
          fi
          SLUGS="$(echo "$CHANGED" | sed -nE 's#^products/([^/]+)/.*#\1#p' | sort -u | tr '\n' ' ' | sed 's/ *$//')"
          if [ -z "$SLUGS" ]; then
            echo "mode=none" >> "$GITHUB_OUTPUT"; echo "products=" >> "$GITHUB_OUTPUT"
            echo "scope: no product/<slug> files changed → SKIP build"; exit 0
          fi
          echo "mode=subset" >> "$GITHUB_OUTPUT"; echo "products=$SLUGS" >> "$GITHUB_OUTPUT"
          echo "scope: changed products → '$SLUGS'"

      - name: Build + push (seed bases + product images)
        if: steps.scope.outputs.mode != 'none'
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.image_tag }}"
          if [ -z "$TAG" ]; then TAG="${GITHUB_SHA::12}"; fi
          PRODUCTS="${{ steps.scope.outputs.products }}"
          echo "Building + pushing at tag: $TAG (+ :latest) — mode=${{ steps.scope.outputs.mode }} products: ${PRODUCTS:-ALL}"
          NOCTUS_IMAGE_TAG="$TAG" bash scripts/infra/build-and-push.sh $PRODUCTS

      - name: Skip note (nothing to build)
        if: steps.scope.outputs.mode == 'none'
        run: echo "No product/<slug> image changes in this push — nothing to build."

      - name: Summary
        if: always()
        run: |
          echo "### Build & Push" >> "$GITHUB_STEP_SUMMARY"
          echo "Pushed \`ghcr.io/jraphaelsst/noctus-<slug>\` at \`${GITHUB_SHA::12}\` + \`:latest\`." >> "$GITHUB_STEP_SUMMARY"
          echo "Deploy with \`noctus.dev.deploy_image <product> --source pull\` (C2 snapshot/health/rollback)." >> "$GITHUB_STEP_SUMMARY"
