# Build & Push product images to GHCR (the §2 ② "GHCR-pull" delivery layer).
#
# WHAT THIS IS — the BUILD/DELIVER layer. It builds the slim `--target runtime`
# product images off-box (here, on a GitHub runner) and pushes them to GHCR as
# immutable `:<sha>` artifacts. It does NOT deploy.
#
# PROD-PIN HOLE FIX (2026-07-20) — `:latest` (what the fleet's
# docker-compose.prod.yml actually pulls) used to move on EVERY `main` push,
# independent of the `prod` promote-gate (KB § GUIDES/production-deploy.md §
# 2b). It now moves ONLY on a `prod`-ref build — i.e. this workflow ALSO
# triggers on push to `prod` (only ever advanced by a deliberate
# noctus.dev.release stage='promote' FF), and `:latest` is passed
# --move-latest ONLY when `github.ref == 'refs/heads/prod'` (or the operator
# explicitly opts in via workflow_dispatch's `move_latest` input — an
# intentional escape hatch for a supervised manual push, off by default).
# Every OTHER build (a routine `main` push, an unflagged workflow_dispatch)
# tags the convenience floating pointer `:edge` instead — pullable for
# testing, never what the fleet's compose file resolves. Backstop:
# `noctus.dev.deploy_image` additionally REFUSES a `tag=latest source=pull`
# deploy whose baked revision isn't a verified ancestor of `origin/prod`.
#
# HOW IT COMPOSES (does NOT supersede the deploy tooling):
#   • THIS workflow   → builds + pushes the artifact (the §2 ② model).
#   • noctus.dev.deploy_image --source pull  → the DEPLOY/ROLLBACK-SAFETY layer:
#       snapshot → swap → ancestry-guard → health-probe → rollback, on the VPS
#       (KB §2a C2).
#   • The `prod` promote-branch gate now ALSO governs which build moves
#       :latest — building on `main` still does NOT auto-deploy to prod. You
#       still promote + run deploy_image deliberately.
#   The durable `:<sha>` tags ALSO make rollback/DR robust (pull an old sha)
#   instead of relying only on the in-place commit-snapshot.
#
# REQUIRED REPO SECRETS (Settings → Secrets and variables → Actions):
#   • VITE_SUPABASE_URL              — baked into the FE bundle at build time
#   • VITE_SUPABASE_PUBLISHABLE_KEY  — baked into the FE bundle at build time
#   (VITE_CORE_URL is the public domain, set as env below — not a secret.)
#   GHCR auth uses the built-in GITHUB_TOKEN (no PAT to manage/rotate).
#
# NOTE — the VPS pulls PRIVATE GHCR packages, so it needs a read:packages token
#   (or make the packages public). Until images exist here, the live fleet stays
#   on the build-on-VPS model (§2 ①) — this workflow is what activates §2 ②.
name: Build & Push Images (GHCR)

on:
  push:
    branches: [main, prod]
    paths:
      - "products/**"
      - "seed/**"
      - "scripts/infra/build-and-push.sh"
      - "scripts/infra/build-base-images.sh"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag (default: short git sha). :latest moves only when move_latest=true (or the run is on prod)."
        required: false
        default: ""
      products:
        description: "Space-separated product slugs to build (default: all 8). e.g. 'social-wiring' for a ~3-min targeted test."
        required: false
        default: ""
      move_latest:
        description: "Move the floating :latest tag (normally reserved for a prod-ref build). Default false — leave off unless you are deliberately overriding the PROD-PIN guard."
        required: false
        default: "false"

permissions:
  contents: read
  packages: write

concurrency:
  group: build-push-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    name: Build + push fleet images
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_CORE_URL: https://core.noctusai.com
      VITE_CORE_API_URL: https://core.noctusai.com
      GHCR_USERNAME: ${{ github.actor }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5  # Node 24 (v4 was Node 20, deprecated)
        with:
          fetch-depth: 0   # need the push range (before..after) to scope the build to CHANGED products

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3  # @v3 major-pin auto-gets the Node 24 patch

      - name: Require VITE secrets (fail-closed — never push a broken-FE image)
        run: |
          if [ -z "${VITE_SUPABASE_URL}" ] || [ -z "${VITE_SUPABASE_PUBLISHABLE_KEY}" ]; then
            echo "::error::VITE_SUPABASE_URL / VITE_SUPABASE_PUBLISHABLE_KEY repo secrets are empty — refusing to build (a build without them bakes a broken FE; the seed FE inlines VITE_* at build time). Add them in Settings → Secrets and variables → Actions, then re-run."
            exit 1
          fi

      # Scope the build to what actually changed — mirrors the DEPLOY side
      # (noctus.dev.promote / deploy_pull already report `rebuild: [<slug>...]`).
      # Drift fixed 2026-06-03: a push used to rebuild the WHOLE fleet because it
      # passed no `products` arg → build-and-push.sh's "empty = ALL" default fired.
      #   • workflow_dispatch → honor the explicit `products` input (empty = ALL fleet).
      #   • push touching seed/** or the build scripts → the ACTIVE SET (shared base
      #     changed, so every product we still maintain images for must rebuild).
      #   • push touching only products/<slug>/ → those slugs ∩ the active set.
      #   • push with no usable base (first push / force) → the ACTIVE SET.
      #   • push touching none of the above (e.g. only a deleted file) → SKIP.
      #
      # 2026-08-11 — ACTIVE-SET SCOPING (why "ALL" is gone from the push paths).
      # A `seed/**` edit used to mean "rebuild the WHOLE fleet": 11 services from
      # docker-compose.prod.yml, including the 7 products that are `ativo=false` in the
      # catalog and that we have explicitly decided not to touch. A one-line package.json
      # change cost a full 11-product build and put churn on images nobody deploys.
      # The build set now comes from `deploy/fleet/build-scope.txt` (derived from the
      # catalog: ativo=true AND deploy_scope='live', plus `core`). The FLEET file stays
      # the source of truth for what CAN run; this narrows what a PUSH rebuilds. An
      # inactive product keeps running its last-built image until it is reactivated.
      # `workflow_dispatch` still bypasses this entirely — that is the manual override.
      - name: Determine products to build (active-set ∩ changed-only scoping)
        id: scope
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=dispatch" >> "$GITHUB_OUTPUT"
            echo "products=${{ github.event.inputs.products }}" >> "$GITHUB_OUTPUT"
            echo "scope: workflow_dispatch → '${{ github.event.inputs.products }}' (empty = ALL fleet; manual override, build-scope.txt ignored)"; exit 0
          fi

          # ── the active set ────────────────────────────────────────────────────────
          SCOPE_FILE="deploy/fleet/build-scope.txt"
          FLEET_COMPOSE="deploy/fleet/docker-compose.prod.yml"
          if [ ! -f "$SCOPE_FILE" ]; then
            echo "::error::$SCOPE_FILE is missing — it declares which products get images built. Restore it (regenerate with 'python mcp/noctusai/cli.py --refresh-build-scope') or run this workflow via workflow_dispatch."
            exit 1
          fi
          ACTIVE="$(grep -vE '^\s*(#|$)' "$SCOPE_FILE" | tr -d '\r' | sort -u | tr '\n' ' ' | sed 's/ *$//')"
          if [ -z "$ACTIVE" ]; then
            echo "::error::$SCOPE_FILE lists no products — refusing to build nothing silently."
            exit 1
          fi
          # A slug here that no longer exists in the fleet would silently never build.
          # Fail loudly instead (mirrors build-and-push.sh's own fleet-membership check).
          for s in $ACTIVE; do
            if ! grep -qE "^  ${s}:" "$FLEET_COMPOSE"; then
              echo "::error::build-scope.txt lists '$s' but it is absent from $FLEET_COMPOSE — stale scope file. Regenerate with 'python mcp/noctusai/cli.py --refresh-build-scope'."
              exit 1
            fi
          done
          echo "active set (deploy/fleet/build-scope.txt): $ACTIVE"

          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "mode=active" >> "$GITHUB_OUTPUT"; echo "products=$ACTIVE" >> "$GITHUB_OUTPUT"
            echo "scope: no usable base ($BEFORE) → ACTIVE SET '$ACTIVE'"; exit 0
          fi
          CHANGED="$(git diff --name-only "$BEFORE" "${{ github.sha }}")"
          echo "changed files:"; echo "$CHANGED" | sed 's/^/  /'
          if echo "$CHANGED" | grep -qE '^(seed/|scripts/infra/build-(and-push|base-images)\.sh$)'; then
            echo "mode=active" >> "$GITHUB_OUTPUT"; echo "products=$ACTIVE" >> "$GITHUB_OUTPUT"
            echo "scope: seed/ or build-script changed → ACTIVE SET '$ACTIVE' (inactive products deliberately skipped)"; exit 0
          fi
          SLUGS="$(echo "$CHANGED" | sed -nE 's#^products/([^/]+)/.*#\1#p' | sort -u)"
          if [ -z "$SLUGS" ]; then
            echo "mode=none" >> "$GITHUB_OUTPUT"; echo "products=" >> "$GITHUB_OUTPUT"
            echo "scope: no product/<slug> files changed → SKIP build"; exit 0
          fi
          # Intersect with the active set — and SAY what was dropped (no silent caps).
          KEEP=""; DROP=""
          for s in $SLUGS; do
            if printf '%s\n' $ACTIVE | grep -qx "$s"; then KEEP="$KEEP $s"; else DROP="$DROP $s"; fi
          done
          KEEP="$(echo "$KEEP" | sed 's/^ *//;s/ *$//')"; DROP="$(echo "$DROP" | sed 's/^ *//;s/ *$//')"
          [ -n "$DROP" ] && echo "::notice::skipping inactive product(s): $DROP — changed, but not in deploy/fleet/build-scope.txt. Activate them (or use workflow_dispatch) to build."
          if [ -z "$KEEP" ]; then
            echo "mode=none" >> "$GITHUB_OUTPUT"; echo "products=" >> "$GITHUB_OUTPUT"
            echo "scope: only inactive products changed ($DROP) → SKIP build"; exit 0
          fi
          echo "mode=subset" >> "$GITHUB_OUTPUT"; echo "products=$KEEP" >> "$GITHUB_OUTPUT"
          echo "scope: changed ∩ active → '$KEEP'"

      # PROD-PIN fix: :latest moves ONLY for a prod-ref build (push to `prod`,
      # or a workflow_dispatch run explicitly opting in via move_latest=true —
      # off by default). Everything else tags :edge instead (see the header).
      - name: Decide whether this build moves :latest
        id: latest
        run: |
          set -euo pipefail
          MOVE="false"
          if [ "${{ github.ref }}" = "refs/heads/prod" ]; then MOVE="true"; fi
          if [ "${{ github.event.inputs.move_latest }}" = "true" ]; then MOVE="true"; fi
          echo "move_latest=$MOVE" >> "$GITHUB_OUTPUT"
          echo "ref=${{ github.ref }} → move_latest=$MOVE"

      - name: Build + push (seed bases + product images)
        if: steps.scope.outputs.mode != 'none'
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.image_tag }}"
          if [ -z "$TAG" ]; then TAG="${GITHUB_SHA::12}"; fi
          PRODUCTS="${{ steps.scope.outputs.products }}"
          EXTRA_FLAG=""
          if [ "${{ steps.latest.outputs.move_latest }}" = "true" ]; then EXTRA_FLAG="--move-latest"; fi
          echo "Building + pushing at tag: $TAG (+ $( [ -n "$EXTRA_FLAG" ] && echo ':latest' || echo ':edge' )) — mode=${{ steps.scope.outputs.mode }} products: ${PRODUCTS:-ALL}"
          NOCTUS_IMAGE_TAG="$TAG" bash scripts/infra/build-and-push.sh $EXTRA_FLAG $PRODUCTS

      - name: Skip note (nothing to build)
        if: steps.scope.outputs.mode == 'none'
        run: echo "No product/<slug> image changes in this push — nothing to build."

      - name: Summary
        if: always()
        run: |
          MOVED="edge"
          if [ "${{ steps.latest.outputs.move_latest }}" = "true" ]; then MOVED="latest"; fi
          echo "### Build & Push" >> "$GITHUB_STEP_SUMMARY"
          echo "Pushed \`ghcr.io/jraphaelsst/noctus-<slug>\` at \`${GITHUB_SHA::12}\` + \`:${MOVED}\`." >> "$GITHUB_STEP_SUMMARY"
          if [ "$MOVED" = "edge" ]; then
            echo "\`:latest\` (the tag the fleet actually pulls) was NOT moved — this was not a prod-ref build. See KB § GUIDES/production-deploy.md § 2b." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Deploy with \`noctus.dev.deploy_image <product> --source pull\` (C2 snapshot/ancestry-guard/health/rollback)." >> "$GITHUB_STEP_SUMMARY"
