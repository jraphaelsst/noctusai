name: Merge Queue

# The ONE path code takes into `dev` (2026-11-05). A session enqueues with
# `noctus.dev.task_branch action='enqueue'` (pushes `mq/<slug>--<sha7>`); this
# workflow composes the oldest entries onto dev, runs the full `Tests & Build`
# on the composed candidate (on GitHub runners — never the owner's laptop), and
# fast-forwards dev only to a green candidate. A red batch is bisected; a red
# single entry, a conflict or a duplicate migration number is ejected with a
# `merge-queue` commit status on the enqueued sha saying why.
#
# Two jobs, because of the push token. A batch whose diff touches
# `.github/workflows/` can only be pushed with a PAT that has the `workflows`
# permission (GITHUB_TOKEN never can). That PAT is the environment secret
# MQ_PUSH_TOKEN of the `merge-queue` environment, whose deployment-branch policy
# allows ONLY `dev`: a run can read it only if its workflow file comes from dev,
# never from a queued branch's edited copy of this file.
#  - `kick` runs on the `mq/**` push (that run's ref is the queue branch, so it
#    cannot use the environment): it only dispatches this workflow on dev.
#  - `drain` runs on dev (dispatched by kick, the schedule, or by hand), reads
#    the secret, and does the real work. The driver uses the PAT only for
#    batches that touch workflow files, so normal landings still push with
#    github.token and do not double-trigger push workflows.
# Driver + rationale: mcp/noctusai/tools/noctus/dev/merge_queue.py ·
# KB § PATTERNS/devops/merge-queue.md.
on:
  push:
    branches: ['mq/**']
  workflow_dispatch:
    inputs:
      batch:
        description: max entries per batch
        required: false
        default: '4'
  # Sweeper: a drain that died (runner loss, timeout) leaves entries queued;
  # the next tick picks them up. Cheap when the queue is empty (one fetch).
  schedule:
    - cron: '*/20 * * * *'

permissions:
  contents: write   # push the candidate ref, fast-forward dev, delete queue refs
  actions: write    # dispatch Tests & Build on the candidate, re-run failed jobs
  statuses: write   # the per-entry verdict on the enqueued sha

jobs:
  kick:
    name: Kick a drain on dev
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch the drain on dev
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run merge-queue.yml --ref dev -R "${{ github.repository }}"

  drain:
    name: Drain the merge queue
    if: github.event_name != 'push' && github.ref == 'refs/heads/dev'
    environment: merge-queue
    runs-on: ubuntu-latest
    timeout-minutes: 350
    # One drain at a time, never cancelled: a running drain finishes its batch.
    # GitHub keeps at most one PENDING run per group (a newer trigger replaces
    # the queued one) - harmless here because every drain processes the WHOLE
    # queue. Job-level, so a kick never waits behind a running drain.
    concurrency:
      group: merge-queue
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: dev
          fetch-depth: 0
      - name: Configure git identity for composed commits
        run: |
          git config user.name "noctus-merge-queue"
          git config user.email "noctus-merge-queue@users.noreply.github.com"
      # The merge drivers .gitattributes names (kb-counts, lgpd-warnings) are
      # per-repo git CONFIG, never committed: without registering them here the
      # drain's merge/rebase text-merges the derived kb-counts blocks and ejects
      # every parallel entry on a 02-LANDSCAPE.md conflict (2026-11-05). The
      # kb-counts driver re-renders via cli.py, so the toolkit deps are needed.
      # KB § PATTERNS/common/auto-generated-merge-drivers.md
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: mcp/noctusai/requirements.txt
      - name: Install toolkit deps (merge drivers re-render via cli.py)
        run: (cd mcp/noctusai && pip install -r requirements.txt)
      - name: Register merge drivers
        run: bash scripts/hooks/register-merge-drivers.sh "$GITHUB_WORKSPACE"
      - name: Drain
        env:
          GH_TOKEN: ${{ github.token }}
          MQ_PUSH_TOKEN: ${{ secrets.MQ_PUSH_TOKEN }}
        run: |
          python3 mcp/noctusai/tools/noctus/dev/merge_queue.py drain \
            --batch "${{ github.event.inputs.batch || '4' }}"
