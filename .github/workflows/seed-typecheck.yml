name: Seed Typecheck

# Gate the seed-boundary type contract.
#
# Cross-product type contracts live in two seed-boundary packages:
#   - @noctusai/lib   (seed/lib/frontend/)
#   - @noctusai/seed  (seed/framework/frontend/)
#
# Both export source .ts directly (no build step) so the strict-quality
# of the seed's types propagates to all consumers via raw-source import.
# This workflow runs `tsc --noEmit` on both packages on every PR that
# touches them and on every push to main.

on:
  # Manual re-trigger. Added 2026-08-26, during a GitHub Actions `major_outage`
  # that left a queued run wedged for over an hour with zero jobs — GitHub
  # reported the SAME run as queued, completed AND "already running" — while
  # `release stage='bless'` correctly refuses a tip with no green CI. With only
  # `push`/`pull_request` there was no way to ask for a fresh run once the
  # outage cleared: the only lever was an empty commit, i.e. dirtying history to
  # work around an upstream incident. `build-and-push.yml` and
  # `embedding-cache-gate.yml` already carried this; the two heaviest gates did
  # not.
  workflow_dispatch:
  push:
    branches: [main, dev]  # dev is the integration branch — validate its tip pre-bless
    paths:
      - "seed/lib/frontend/**"
      - "seed/framework/frontend/**"
      - ".github/workflows/seed-typecheck.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "seed/lib/frontend/**"
      - "seed/framework/frontend/**"
      - ".github/workflows/seed-typecheck.yml"

# Cancel a superseded run on rapid pushes to the same branch/PR (cost trim
# 2026-05-31 — the last workflow that lacked it; path-gated so it fires rarely,
# but free to make consistent with the other workflows). No coverage loss.
concurrency:
  group: seed-typecheck-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lib-typecheck:
    name: Lib Typecheck (@noctusai/lib)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: seed/lib/frontend/package-lock.json

      - name: Install dependencies
        working-directory: seed/lib/frontend
        run: npm ci

      # lib's tsconfig path-maps @noctusai/seed/infra → ../../framework/frontend;
      # tsc resolves that file's bare imports against ITS node_modules, so the
      # sibling package must be installed too (cross-package typecheck).
      - name: Install sibling (framework) deps
        working-directory: seed/framework/frontend
        run: npm ci

      - name: Type-check (tsc --noEmit, strict)
        working-directory: seed/lib/frontend
        run: npm run check

  framework-typecheck:
    name: Framework Typecheck (@noctusai/seed)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: seed/framework/frontend/package-lock.json

      - name: Install dependencies
        working-directory: seed/framework/frontend
        run: npm ci

      # framework's tsconfig path-maps @noctusai/lib → ../../lib/frontend; tsc
      # resolves those files' bare imports against lib's node_modules, so the
      # sibling package must be installed too (cross-package typecheck).
      - name: Install sibling (lib) deps
        working-directory: seed/lib/frontend
        run: npm ci

      - name: Type-check (tsc --noEmit, strict)
        working-directory: seed/framework/frontend
        run: npm run check
