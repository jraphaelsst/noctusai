name: Embedding Cache Gate

# Validates that KB + code embedding caches are reachable and fresh against
# the shared prod cache (Trigger T3 of roadmap cache-backend-portability-2026-05).
# Graceful-degrade: cache unreachable → warning, not failure (full Phase 3 is
# a sibling slice; the gates here go non-blocking until the secret is provisioned
# and the prod cache container is live).
#
# KB § CONTEXT/PATTERNS/devops/ci-embedding-cache-gate.md

on:
  pull_request:
    paths:
      - "KNOWLEDGE-BASE/**/*.md"
      - "mcp/**/*.py"
      - "noctusai_lib/**/*.py"
      - "products/seed/**"
  workflow_dispatch:

# Cancel in-progress runs on the same branch so two rapid pushes don't
# queue up redundant embedding work.
concurrency:
  group: cache-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  embedding-cache-validate:
    name: Embedding Cache Validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system build deps
        # pycairo / weasyprint / psycopg2-binary build deps — same set as test.yml
        # to keep the env shape uniform across CI jobs.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcairo2-dev libgirepository1.0-dev libpango1.0-dev \
            libgdk-pixbuf-2.0-dev libffi-dev libpq-dev pkg-config

      - name: Install dependencies
        run: pip install -r mcp/noctusai/requirements.txt

      - name: Check cache reachability
        # continue-on-error: sibling slice (PGV-COMPOSE) ships the CLI flag
        # --check-prod-cache-reachable; graceful-degrade until it lands.
        continue-on-error: true
        run: python mcp/noctusai/cli.py --check-prod-cache-reachable

      - name: Open SSH tunnel to prod cache-pg
        # Phase 3 connectivity (Route A — KB § PATTERNS/common/dispatch-with-project-and-notes.md §4a.3
        # of projects/cache-pg-vps-bringup/). The cache-pg container exposes
        # 5432 only on the VPS host's 127.0.0.1; CI tunnels via a restricted
        # deploy key (command="/bin/false",no-pty,permitopen="127.0.0.1:5432")
        # so the key can ONLY forward this port and CANNOT execute commands.
        # Secrets (set by tech-lead):
        #   NOCTUS_VPS_DEPLOY_KEY  — private half of the ed25519 deploy key
        #   NOCTUS_VPS_HOST        — public hostname of noctus-vps
        # Graceful-degrade: if either secret is unset, skip the tunnel; the
        # downstream gates run continue-on-error against local-sqlite fallback.
        if: ${{ secrets.NOCTUS_VPS_DEPLOY_KEY != '' && secrets.NOCTUS_VPS_HOST != '' }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.NOCTUS_VPS_DEPLOY_KEY }}" > ~/.ssh/cache-deploy-key
          chmod 600 ~/.ssh/cache-deploy-key
          ssh-keyscan -H "${{ secrets.NOCTUS_VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          # Open background tunnel; -fN = forward only, no remote command;
          # ExitOnForwardFailure=yes ensures we fail fast if permitopen rejects.
          ssh -i ~/.ssh/cache-deploy-key \
              -L 5432:127.0.0.1:5432 -fN \
              -o ExitOnForwardFailure=yes \
              -o ServerAliveInterval=30 \
              -o StrictHostKeyChecking=yes \
              root@"${{ secrets.NOCTUS_VPS_HOST }}"
          # Verify the tunnel is alive before downstream steps consume it.
          (timeout 5 bash -c 'until nc -z 127.0.0.1 5432; do sleep 0.3; done') \
            || (echo "::warning::cache-pg tunnel failed to come up; downstream gates will use sqlite fallback" && exit 0)
          echo "cache-pg tunnel UP on 127.0.0.1:5432"
          # Export tunnel-status flag so downstream gates know whether to
          # hard-fail (tunnel UP = prod cache reachable = real validation)
          # vs. soft-fail (tunnel skipped on fork PR = sqlite fallback,
          # advisory only). The flag is consumed by `continue-on-error`
          # expressions on the gate steps below.
          echo "CACHE_TUNNEL_UP=1" >> $GITHUB_ENV

      - name: Connect to prod cache
        # Exports the backend selector so all subsequent steps use the shared
        # Postgres cache. With the tunnel open, the DSN points at localhost.
        # Until the secrets above are set the tunnel step is skipped → backend
        # falls back to local SQLite and subsequent steps continue-on-error.
        run: |
          echo "NOCTUS_CACHE_BACKEND=postgres" >> $GITHUB_ENV
          echo "NOCTUS_CACHE_POSTGRES_DSN=${{ secrets.NOCTUS_CACHE_POSTGRES_DSN }}" >> $GITHUB_ENV

      - name: Run KB vector canonical gate
        # Hard-fail when the prod cache tunnel is UP (real validation against
        # the seeded prod pgvector cache). Soft-fail when the tunnel is DOWN
        # (fork PR with no secrets → sqlite fallback, advisory only).
        # The CACHE_TUNNEL_UP env is set by the tunnel step above when nc
        # confirms 127.0.0.1:5432 is listening.
        continue-on-error: ${{ env.CACHE_TUNNEL_UP != '1' }}
        run: python mcp/noctusai/cli.py --check-kb-vector-canonical

      - name: Run code embeddings cache freshness gate
        # Same conditional hard-fail rationale as the KB gate above.
        continue-on-error: ${{ env.CACHE_TUNNEL_UP != '1' }}
        run: python mcp/noctusai/cli.py --check-code-embeddings-cache-freshness

      - name: Report embedding cost since PR opened
        # Advisory output only — not a gate. Helps the tech-lead see cumulative
        # embedding cost attributed to this PR's churn.
        continue-on-error: true
        run: >
          python mcp/noctusai/cli.py
          --vector-costs-total
          --since=${{ github.event.pull_request.created_at }}

      - name: Close SSH tunnel
        # Always-run cleanup — tear down the tunnel even on prior step failure
        # so the runner doesn't leak processes.
        if: always()
        run: |
          pkill -f "ssh -i .*cache-deploy-key" 2>/dev/null || true
          rm -f ~/.ssh/cache-deploy-key
