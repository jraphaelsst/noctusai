name: Install apt packages (mirror-resilient)
description: >
  ONE apt path for every job (DRY; it was the same hand-copied block in 6 jobs).
  2026-11-11 ~14:16Z: azure.archive.ubuntu.com answered "Ign:" for every package
  and every apt step hung to its 10-min timeout - ~12 red jobs per merge-queue
  batch, and the drain bisects an infra red, ejecting innocent entries.
  So: (1) drop the third-party Google source (2026-09-09 corrupt index);
  (2) set apt-wide retries + timeouts in apt.conf.d, so tools that shell out to
  apt (playwright --with-deps / install-deps) inherit them; (3) PROBE the
  current mirror with a hard cap and switch to archive.ubuntu.com, then to the
  mirrors.txt list, when it hangs, errors or answers "Ign:"/"Err:"; (4) install
  `packages` with a capped attempt per mirror, failing LOUDLY with the mirror
  name. With `packages` empty it only prepares the sources (for playwright).
  2026-11-19 root cause of the NEXT flake class (11+ reds/24h, same step): the
  mirror was UP but SLOW - ~100 kB/s with 5-12s stalls per small .deb, so the
  68-package cairo/pango tree (11.7 MB) took >90s and the 90s per-attempt cap
  killed a healthy download (switching mirrors changed nothing: mirror+file:
  resolves to the same host). Fix by construction: (5) the .debs are cached
  (actions/cache, keyed on image + package list) so a hit downloads nothing;
  (6) on a miss the .debs are prefetched 8-wide (per-file latency, not
  bandwidth, was the bottleneck); (7) the install cap is its own, larger
  input. Telemetry: ::notice:: lines carry cache hit/miss, prefetch counts and
  the mirror that served the install.
  KB § PATTERNS/devops/merge-queue.md § 6a.

inputs:
  packages:
    description: Space-separated apt packages to install; empty = prepare sources only.
    required: false
    default: ""
  attempt-seconds:
    description: Hard cap per apt-get UPDATE attempt, in seconds.
    required: false
    default: "90"
  install-seconds:
    description: Hard cap per apt-get INSTALL attempt (and prefetch), in seconds; a slow mirror needs minutes, not 90s.
    required: false
    default: "420"

runs:
  using: composite
  steps:
    - name: Compute .deb cache key
      id: key
      if: inputs.packages != ''
      shell: bash
      env:
        PKGS: ${{ inputs.packages }}
      run: |
        echo "debs=${RUNNER_TEMP}/apt-debs" >> "$GITHUB_OUTPUT"
        mkdir -p "${RUNNER_TEMP}/apt-debs/partial"
        h="$(printf '%s' "$PKGS" | sha256sum | cut -c1-16)"
        # image version pins the distro + index generation; a new image = a cold cache, by design
        echo "key=apt-debs-v1-${ImageOS:-os}-${ImageVersion:-img}-${h}" >> "$GITHUB_OUTPUT"

    - name: Restore .deb cache
      id: debs
      if: inputs.packages != ''
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.key.outputs.debs }}
        key: ${{ steps.key.outputs.key }}

    - name: Prepare apt sources (fallback mirror) and install
      shell: bash
      env:
        PKGS: ${{ inputs.packages }}
        CAP: ${{ inputs.attempt-seconds }}
        ICAP: ${{ inputs.install-seconds }}
        DEBS: ${{ steps.key.outputs.debs }}
        CACHE_HIT: ${{ steps.debs.outputs.cache-hit }}
      run: |
        set -uo pipefail
        # Composite `shell: bash` runs `bash -e -o pipefail`; this script checks every rc itself, so -e must be
        # OFF - a grep that finds nothing (no Google source on the image) killed every job in 19ms on 2026-11-11.
        set +e
        # (1) a third-party source must not be able to fail the build (2026-09-09)
        { sudo grep -rlE 'dl\.google\.com' /etc/apt/sources.list.d/ 2>/dev/null || true; } | sudo xargs -r rm -f
        sudo sed -i '/dl\.google\.com/d' /etc/apt/sources.list 2>/dev/null || true
        # (2) apt-wide retries/timeouts - inherited by playwright's own apt-get calls
        printf 'Acquire::Retries "3";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\n' \
          | sudo tee /etc/apt/apt.conf.d/99noc-resilient >/dev/null

        SRC_FILES="$(ls /etc/apt/sources.list.d/*.sources /etc/apt/sources.list 2>/dev/null || true)"
        current_mirror() { { grep -hoE 'https?://[a-z0-9.-]+/ubuntu|mirror\+[^ ]+' $SRC_FILES 2>/dev/null || true; } | head -1; }
        switch_mirror() {  # $1 = replacement URI exactly as written into the sources (incl. trailing slash for http)
          for f in $SRC_FILES; do
            sudo sed -i -E "s#https?://(azure\.)?archive\.ubuntu\.com/ubuntu/?#$1#g" "$f"
          done
          echo "::warning::apt mirror switched to $1 (was failing: $MIRROR)"
          MIRROR="$(current_mirror)"
        }
        apt_update_ok() {  # healthy = exits 0 within the cap AND no Ign:/Err: on the ubuntu mirror
          local out rc
          out="$(sudo timeout "$CAP" apt-get update 2>&1)"; rc=$?
          echo "$out" | tail -5
          if [ "$rc" -ne 0 ]; then echo "apt-get update rc=$rc on $MIRROR"; return 1; fi
          if echo "$out" | grep -E '^(Ign|Err):' | grep -q 'ubuntu'; then echo "apt-get update saw Ign:/Err: on $MIRROR"; return 1; fi
          return 0
        }
        MIRROR="$(current_mirror)"
        FALLBACKS="http://archive.ubuntu.com/ubuntu/ mirror+http://mirrors.ubuntu.com/mirrors.txt"
        # (3) probe; walk the fallback list until a mirror answers cleanly
        if ! apt_update_ok; then
          healthy=0
          for m in $FALLBACKS; do
            switch_mirror "$m"
            if apt_update_ok; then healthy=1; break; fi
          done
          [ "$healthy" = 1 ] || echo "::warning::no apt mirror answered cleanly; trying install on $MIRROR anyway"
        fi
        # (4) install with a capped attempt; one more mirror switch on failure; loud failure naming the mirror
        if [ -z "$PKGS" ]; then echo "apt sources ready on $MIRROR"; exit 0; fi
        APT_OPTS="-o Dir::Cache::Archives=$DEBS"
        echo "::notice::apt .deb cache hit: ${CACHE_HIT:-false} (a hit means no package downloads)"
        # (6) prefetch the .debs 8-wide: the observed stall is per-file latency on the mirror, not bandwidth.
        # Best-effort - anything missed is fetched by apt itself; apt re-verifies every file by hash.
        prefetch() {
          local first uris n
          first="$(head -1 /etc/apt/apt-mirrors.txt 2>/dev/null | awk '{print $1}' | sed -E 's#/*$#/#')"
          uris="$(sudo apt-get install -y --no-install-recommends --print-uris $APT_OPTS $PKGS 2>/dev/null \
            | sed -nE 's/^\x27([^\x27]*)\x27 ([^ ]+) .*/\1 \2/p' \
            | sed -E "s#^mirror\+file:/etc/apt/apt-mirrors.txt/#${first}#")"
          n="$(printf '%s\n' "$uris" | grep -c . || true)"
          echo "::notice::apt prefetch: $n package file(s) not in cache"
          [ "$n" -gt 0 ] || return 0
          printf '%s\n' "$uris" | sudo timeout "$ICAP" xargs -P 8 -n 2 sh -c \
            'curl -fsSL --retry 2 --connect-timeout 10 --max-time 120 -o "$0/$2.part" "$1" && mv "$0/$2.part" "$0/$2"' "$DEBS" \
            || echo "::warning::apt prefetch incomplete; apt will fetch the rest itself"
        }
        install() { sudo timeout "$ICAP" apt-get install -y --no-install-recommends $APT_OPTS $PKGS; }
        prefetch
        if install; then echo "::notice::apt install OK on $MIRROR (cache hit: ${CACHE_HIT:-false})"; exit 0; fi
        for m in $FALLBACKS; do
          case "$m" in "$MIRROR"*) continue;; esac  # already on it
          switch_mirror "$m"
          sudo timeout "$CAP" apt-get update >/dev/null 2>&1 || true
          prefetch
          if install; then echo "::notice::apt install OK on $MIRROR (cache hit: ${CACHE_HIT:-false})"; exit 0; fi
        done
        echo "::error::apt install of [$PKGS] FAILED on every mirror (last: $MIRROR) - CI infra, not the code under test"
        exit 1

    - name: Hand the .deb cache back to the runner user (tar must read root-written files)
      if: success() && inputs.packages != '' && steps.debs.outputs.cache-hit != 'true'
      shell: bash
      env:
        DEBS: ${{ steps.key.outputs.debs }}
      run: |
        sudo rm -rf "$DEBS/lock" "$DEBS/partial"
        sudo chown -R "$(id -u):$(id -g)" "$DEBS"
        echo "::notice::apt .deb cache to save: $(ls "$DEBS" | wc -l) file(s), $(du -sh "$DEBS" | cut -f1)"

    - name: Save .deb cache
      if: success() && inputs.packages != '' && steps.debs.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.key.outputs.debs }}
        key: ${{ steps.key.outputs.key }}
