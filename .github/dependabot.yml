version: 2

# Dependabot configuration for NoctusAI.
#
# WHY THIS FILE EXISTS — root cause fix for the "Dependency Graph" CI failure:
#   GitHub's dependency-graph scanner auto-walks every requirements.txt it
#   finds and chokes on editable local-path installs:
#     -e seed/lib/backend
#     -e seed/framework/backend
#   These are relative filesystem paths that resolve in the container/venv but
#   are unresolvable by the remote Dependabot updater — it has no access to
#   the local checkout structure.
#
# THE FIX — Option B: scope pip to pyproject.toml directories only.
#   When this file exists, Dependabot ONLY scans the directories listed here
#   (it does NOT auto-scan the whole tree).  By pointing pip updates at the
#   canonical pyproject.toml manifests (seed/lib/backend, seed/framework/backend,
#   mcp/noctusai, dev_team) we get real PyPI dep tracking without hitting any
#   editable path installs.
#
#   Product requirements.txt files (products/*/backend/requirements.txt) are
#   INTENTIONALLY OMITTED — they are deployment-assembly files that compose:
#     (a) the -e seed/* editable installs (local, unresolvable remotely), and
#     (b) versioned PyPI deps that are ALREADY declared in the pyproject.toml
#         manifests above.
#   Scanning them would double-report known deps AND fail on (a) every time.
#
#   mcp/noctusai is also INTENTIONALLY OMITTED from the pip section because its
#   requirements.txt carries "-e ../../seed/lib/backend" alongside pyproject.toml.
#   Dependabot scans ALL pip manifests in a directory; pointing it here would
#   re-introduce the same failure.  The dep surface (openai, mcp, pydantic, ...)
#   is already covered by seed/lib/backend's pyproject.toml.
#
# NEEDS-CI-VERIFICATION: the next push that runs the Dependency Graph workflow
# should go green once Dependabot no longer attempts the editable-path manifests.
#
# ---------------------------------------------------------------------------
# 2026-08-10 — GROUPING + PR CEILING (why every entry now carries them)
#
# Ungrouped, this config opened ONE branch PER PACKAGE PER DIRECTORY. With 15
# entries × N packages that reached **105 open dependabot branches**, the
# oldest 69 days stale. Nobody triaged them, because 105 single-package PRs is
# not a review queue — it is noise that makes the genuinely urgent security
# bump indistinguishable from a `date-fns` minor.
#
#   groups.all.patterns: ["*"]  → one PR per directory per week, all bumps in
#                                 it; a single lockfile regeneration, a single
#                                 CI run, a single review.
#   open-pull-requests-limit: 2 → a hard ceiling per entry. Version updates
#                                 stop piling up; SECURITY updates are exempt
#                                 from this limit by GitHub's own rules, which
#                                 is exactly the priority ordering we want.
#
# The 105 stale branches were deleted the same day after the CVEs they carried
# were resolved directly (see `.trivyignore`'s 2026-08-10 block — postcss,
# nanoid, brace-expansion, ws bumped fleet-wide). Dependabot re-opens anything
# still outstanding on its next run, grouped this time.
# ---------------------------------------------------------------------------

updates:
  # ── Python (pip) ──────────────────────────────────────────────────────────
  # Only scan the canonical pyproject.toml manifests — no editable path deps.

  - package-ecosystem: "pip"
    # seed/lib/backend pyproject.toml: all platform-wide runtime deps
    # (fastapi, pydantic, supabase, openai, cryptography, redis, …)
    directory: "/seed/lib/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      # MINOR + PATCH ONLY. A bare `patterns: ["*"]` group also sweeps up every
      # MAJOR, which is how one "bump the all group" PR ended up carrying React
      # 18->19 + TypeScript 5->7 (#171/#173, closed 2026-08-13) and how the
      # seed groups stayed permanently red on jsdom 25->30 / eslint 9->10 /
      # lucide-react 0.462->1.31. A group PR is all-or-nothing: one unreviewable
      # major makes the other twenty safe bumps unmergeable too.
      #
      # Restricting the group to minor+patch means majors arrive as INDIVIDUAL
      # PRs — each independently reviewable, mergeable, or closeable — which is
      # dependabot's default for ungrouped updates. The `ignore:` list below
      # stays as the narrower net for the majors that are fleet-COUPLED (one
      # version declared in 14 places), where even a single-package PR can
      # never go green.
      all:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "python"

  - package-ecosystem: "pip"
    # seed/framework/backend pyproject.toml: structural seed deps
    # (noctusai-lib, fastapi, supabase, httpx, …)
    directory: "/seed/framework/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      # MINOR + PATCH ONLY. A bare `patterns: ["*"]` group also sweeps up every
      # MAJOR, which is how one "bump the all group" PR ended up carrying React
      # 18->19 + TypeScript 5->7 (#171/#173, closed 2026-08-13) and how the
