  # ── npm (frontend) ────────────────────────────────────────────────────────
  # Shared library + framework frontends are the canonical npm dep sources.
  # Product frontends are also tracked for security alerts.

  - package-ecosystem: "npm"
    directory: "/seed/lib/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      # MINOR + PATCH ONLY. A bare `patterns: ["*"]` group also sweeps up every
      # MAJOR, which is how one "bump the all group" PR ended up carrying React
      # 18->19 + TypeScript 5->7 (#171/#173, closed 2026-08-13) and how the
      # seed groups stayed permanently red on jsdom 25->30 / eslint 9->10 /
      # lucide-react 0.462->1.31. A group PR is all-or-nothing: one unreviewable
      # major makes the other twenty safe bumps unmergeable too.
      #
      # Restricting the group to minor+patch means majors arrive as INDIVIDUAL
      # PRs — each independently reviewable, mergeable, or closeable — which is
      # dependabot's default for ungrouped updates. The `ignore:` list below
      # stays as the narrower net for the majors that are fleet-COUPLED (one
      # version declared in 14 places), where even a single-package PR can
      # never go green.
      all:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # FLEET-WIDE MAJORS are coordinated migrations, not bumps: each version is
    # declared in THREE places that must move together (seed peerDependencies, the
    # `overrides` dedupe pin, and every consumer's dependencies). A single-package PR
    # contradicts the other two and can never go green. We did react-router v6->v7 and
    # vite 6->8 by hand; the rest get the same treatment. Minors/patches flow normally.
    #
    # 2026-08-13: `react`, `@types/react` and `typescript` were added after grouped
    # `all` PRs (#171 seed/lib, #173 seed/framework) arrived titled "bump the all
    # group" while quietly carrying React 18->19 AND TypeScript 5->7. The group
    # pattern "*" matches majors, so the guard below is the ONLY thing that keeps a
    # major out of a routine-looking PR — and it named react-router only. Both PRs
    # sat red on Lib/Framework Typecheck, which is the good outcome; the bad one is a
    # green group PR that moves the seed to a React the 12 products do not run.
    ignore:
      - dependency-name: "react-router-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-router"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"
      - "javascript"

