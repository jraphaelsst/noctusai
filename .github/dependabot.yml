    labels:
      - "dependencies"
      - "javascript"

  - package-ecosystem: "npm"
    directory: "/products/erp-imobiliario/frontend"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "javascript"

  - package-ecosystem: "npm"
    directory: "/products/knowledge-extractor/frontend"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "javascript"

  - package-ecosystem: "npm"
    directory: "/products/personal-finance/frontend"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "javascript"

  - package-ecosystem: "npm"
    directory: "/products/therapy-platform/frontend"
